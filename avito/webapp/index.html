<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070708">
  <title>Авито</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="kit.css?v={{v}}">
  <link rel="stylesheet" href="app.css?v={{v}}">
</head>
<body data-support="/api/support">
  <main id="app">
    <header class="hero">
      <div class="logo">🛍</div>
      <div class="titles">
        <h1>Авито</h1>
        <div class="sub" id="sub">Фото, описание, цена</div>
      </div>
      <div class="end"><button class="pill accent" id="region" type="button">📍 …</button></div>
    </header>

    <!-- Объявление: фото → описание → цена -->
    <section id="tab-ad">
      <div class="card"><div class="sk" style="height:220px"></div></div>
      <div class="card"><div class="sk" style="height:18px;width:60%"></div><div class="sk" style="height:64px;margin-top:12px"></div></div>
    </section>

    <!-- Средняя цена по любому запросу -->
    <section id="tab-price" hidden>
      <div class="card feature">
        <h2 class="title-lg">Сколько стоит?</h2>
        <p class="hint lead">Посмотрю до 100 похожих объявлений на Авито и посчитаю медиану.</p>
        <form id="q-form" autocomplete="off">
          <div class="search"><input id="q" placeholder="Например, iPhone 13 128 ГБ" maxlength="100" enterkeyhint="search"></div>
          <button id="q-go" class="btn primary" type="submit">📊 Узнать цену</button>
        </form>
      </div>
      <div id="q-result"></div>
    </section>

    <!-- Все объявления -->
    <section id="tab-hist" hidden>
      <div class="label">Мои объявления</div>
      <div id="hist" class="list"></div>
    </section>
  </main>
  <nav id="tabs"></nav>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div id="toast" class="toast" role="status"></div>
  <script src="kit.js?v={{v}}"></script>
  <script src="app.js?v={{v}}"></script>
</body>
</html>
