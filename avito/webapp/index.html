<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Авито</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="app.css?v={{v}}">
</head>
<body>
  <main id="app">
    <header class="top">
      <div class="brand">Авито</div>
      <div id="region" class="chip">…</div>
    </header>

    <section class="card">
      <h2>Средняя цена</h2>
      <form id="search" class="search" autocomplete="off">
        <input id="query" placeholder="Например, iPhone 13 128 ГБ" maxlength="100" enterkeyhint="search">
        <button id="search-go" class="btn primary" type="submit">Узнать</button>
      </form>
      <div id="search-result"></div>
    </section>

    <h3 class="section">Объявления</h3>
    <div id="ads"><div class="empty card">Загружаю…</div></div>
    <p class="hint center">Новое объявление — пришли фото вещи в чат.</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v={{v}}"></script>
</body>
</html>
