<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калории">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>Калории</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Вид — Liquid Glass iOS 27: стекло только у навигации и кнопок поверх контента (меню, кнопки, листы, тосты);
   стекло матовое, с тёмным краем и ярким бликом сверху. Контент — непрозрачный. */
:root {
  --bg: #000000;
  --group: #1c1c1e;
  --sheet: #1c1c1e;
  --sheet-group: #2c2c2e;
  --fill: rgba(120,120,128,.24);
  --fill-2: rgba(120,120,128,.36);
  --sep: rgba(84,84,88,.6);
  --text: #ffffff;
  --text-2: rgba(235,235,245,.6);
  --text-3: rgba(235,235,245,.3);
  --ink: #ffffff;
  --on-ink: #000000;
  --track: rgba(255,255,255,.11);
  --p: #6aa8ff;
  --f: #ffb547;
  --c: #5ed39b;
  --s: #bba8ff;
  --warn: #ff9f0a;
  --bad: #ff453a;
  --glass: rgba(44,44,48,.58);
  --glass-strong: rgba(36,36,40,.78);
  --glass-solid: #2c2c2e;
  --rim: rgba(255,255,255,.2);
  --spec: rgba(255,255,255,.42);
  --edge: rgba(0,0,0,.6);
  --lens: rgba(255,255,255,.13);
  --drop: 0 10px 32px rgba(0,0,0,.42);
  --ios: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.32,.64,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f2f7; --group: #ffffff; --sheet: #f2f2f7; --sheet-group: #ffffff;
    --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.2); --sep: rgba(60,60,67,.2);
    --text: #000000; --text-2: rgba(60,60,67,.6); --text-3: rgba(60,60,67,.3);
    --ink: #000000; --on-ink: #ffffff; --track: rgba(0,0,0,.07);
    --p: #2c7cf0; --f: #e8940f; --c: #1fa86b; --s: #7a5af5; --warn: #f08c00; --bad: #ff3b30;
    --glass: rgba(255,255,255,.62); --glass-strong: rgba(250,250,252,.84); --glass-solid: #ffffff;
    --rim: rgba(255,255,255,.95); --spec: rgba(255,255,255,1); --edge: rgba(0,0,0,.14); --lens: rgba(0,0,0,.07);
    --drop: 0 10px 30px rgba(0,0,0,.13);
    color-scheme: light;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.35 ui-rounded, "SF Pro Rounded", Nunito, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* мягкий круглый шрифт: на iPhone — SF Pro Rounded */
  letter-spacing: -.2px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh; -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }
svg { display: block; }

/* стекло */
.glass { position: relative; isolation: isolate; background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(1.9); backdrop-filter: blur(24px) saturate(1.9);
  box-shadow: 0 0 0 .5px var(--edge), inset 0 0 0 .5px var(--rim), inset 0 1.2px 0 var(--spec), var(--drop); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(130% 70% at 25% -10%, rgba(255,255,255,.22), transparent 55%), linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%); }
@media (prefers-color-scheme: light) { .glass::before { background: radial-gradient(130% 70% at 25% -10%, rgba(255,255,255,.7), transparent 60%); } }
@media (prefers-reduced-transparency: reduce) {
  .glass, .sheet.short, .edge-top, .edge-bottom { background: var(--glass-solid) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
.press { transition: transform .35s var(--spring), opacity .2s; }
.press:active { transform: scale(.9); }

.app { max-width: 540px; margin: 0 auto; padding: calc(8px + var(--safe-t)) max(16px, env(safe-area-inset-right)) calc(120px + var(--safe-b)) max(16px, env(safe-area-inset-left)); }

/* верх: при прокрутке — ровная полоса с размытием (iOS 27), маленький заголовок */
.edge-top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(56px + var(--safe-t)); pointer-events: none;
  -webkit-backdrop-filter: blur(14px) saturate(1.6); backdrop-filter: blur(14px) saturate(1.6);
  background: linear-gradient(var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 60%, transparent);
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent);
  opacity: 0; transition: opacity .25s; }
.nav-t { position: fixed; z-index: 31; top: calc(var(--safe-t) + 14px); left: 50%; transform: translate(-50%, 4px); font-size: 17px; font-weight: 600;
  opacity: 0; transition: opacity .2s, transform .3s var(--ios); pointer-events: none; }
body.scrolled .edge-top { opacity: 1; }
body.scrolled .nav-t { opacity: 1; transform: translate(-50%, 0); }
.edge-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 19; height: calc(96px + var(--safe-b)); pointer-events: none;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%);
  background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 60%, transparent)); }

.actions { position: fixed; z-index: 32; top: calc(6px + var(--safe-t)); right: max(16px, calc(50% - 254px)); display: flex; border-radius: 22px; }
.actions:empty { display: none; }
.ibtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { background: var(--lens); }
.today-btn { position: fixed; z-index: 32; top: calc(6px + var(--safe-t)); left: max(16px, calc(50% - 254px)); height: 44px; padding: 0 16px; border-radius: 22px;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.today-btn svg { width: 9px; height: 15px; }

.large { margin: 52px 0 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.9px; }
.subtitle { margin-top: 2px; color: var(--text-2); font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.streak { display: inline-flex; align-items: center; gap: 3px; color: var(--warn); font-weight: 600; }
.streak svg { width: 13px; height: 13px; }

/* неделя: маленькие кольца */
.week { display: grid; grid-template-columns: repeat(7, 1fr); margin: 18px -4px 0; touch-action: pan-y; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 8px; border-radius: 20px; transition: background .25s; }
.wd .l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.wd svg { width: 32px; height: 32px; }
.wd[aria-current="date"] { background: var(--group); }
.wd[aria-current="date"] .l { color: var(--text); font-weight: 600; }
.wd[disabled] { opacity: .3; pointer-events: none; }
.wd .l::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 2px; margin: 2px auto 0; }
.wd.today .l::after { background: var(--bad); }

/* сегменты: капсула, «линза» переезжает с пружиной */
.seg { position: relative; display: flex; background: var(--fill); border-radius: 999px; padding: 3px; margin-top: 18px; }
.seg button { flex: 1; position: relative; z-index: 1; height: 34px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--text); }
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--fill-2);
  box-shadow: inset 0 1px 0 var(--spec), 0 0 0 .5px var(--edge), 0 3px 10px rgba(0,0,0,.12); transition: transform .55s var(--spring), width .45s var(--spring); }
@media (prefers-color-scheme: light) { .seg .thumb { background: #fff; } }
.seg .thumb.squish { animation: squish .45s var(--ios); }
@keyframes squish { 40% { scale: 1.12 .9; } }

/* кольцо */
.ring-wrap { position: relative; width: min(62vw, 236px); aspect-ratio: 1; margin: 22px auto 0; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-wrap .arc { transition: stroke-dashoffset 1s var(--ios); }
.ring-wrap.done .arc { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ink) 35%, transparent)); }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-in .big { font-size: 50px; line-height: 1; font-weight: 600; letter-spacing: -2.2px; }
.ring-in .cap { margin-top: 6px; font-size: 15px; color: var(--text-2); }
.ring-in .of { margin-top: 10px; font-size: 13px; color: var(--text-3); }
.ring-in .big.over { color: var(--warn); }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 2px 0; }
.metric .n { font-size: 13px; color: var(--text-2); }
.metric .v { margin-top: 1px; font-size: 19px; font-weight: 600; letter-spacing: -.5px; white-space: nowrap; }
.metric .v small { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
@media (max-width: 370px) { /* узкие экраны (iPhone SE, 320 px): БЖУ и соль влезают в строку */
  .metrics { gap: 8px; } .metric .v { font-size: 16px; letter-spacing: -.4px; } .metric .v small { font-size: 11px; } .metric .n { font-size: 12px; }
  .ring-in .big { font-size: 44px; } .large { font-size: 31px; } .tab { width: 84px; } }
.metric .b { height: 4px; border-radius: 2px; background: var(--track); margin-top: 8px; overflow: hidden; }
.metric .b i { display: block; height: 100%; border-radius: 2px; background: var(--dot); transition: width .9s var(--ios), background .3s; }

/* списки (контент — без стекла) */
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px 8px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.sec-h span { font-size: 15px; color: var(--text-2); }
.list { background: var(--group); border-radius: 26px; overflow: hidden; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; text-align: left; padding: 10px 18px; background: var(--group); }
.cell + .cell::before, .swipe + .swipe .cell::before, .swipe + .cell::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; border-top: .5px solid var(--sep); }
button.cell { transition: background .15s; }
button.cell:active { background: var(--fill); }
.cell .t { flex: 1; min-width: 0; }
.cell .n { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .m { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .k { font-size: 17px; color: var(--text-2); }
.cell .chev { width: 8px; height: 13px; color: var(--text-3); flex: none; }
.cell.add { font-weight: 500; min-height: 50px; gap: 10px; }
.cell.add svg { width: 20px; height: 20px; color: var(--text-2); }
.cell.add .ph { margin-left: auto; width: 36px; height: 36px; margin-right: -8px; border-radius: 18px; display: grid; place-items: center; color: var(--text-2); }
.cell.add .ph:active { background: var(--fill); }
.swipe { position: relative; overflow: hidden; }
.swipe .del { opacity: 0; transition: opacity .2s; position: absolute; top: 0; right: 0; bottom: 0; width: 88px; background: var(--bad); color: #fff; font-weight: 600; font-size: 15px; display: grid; place-items: center; }
.swipe .cell { transition: transform .45s var(--spring); will-change: transform; }
.swipe.sw .del { opacity: 1; }
.item-in { animation: itemIn .5s var(--ios); }
@keyframes itemIn { from { opacity: 0; transform: translateY(-8px); } }

/* нижнее меню — плавающее стекло: вкладки в капсуле, «+» отдельным кругом; при прокрутке вниз сжимается */
.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: max(10px, calc(var(--safe-b) - 12px)); pointer-events: none; }
.tabbar .in { max-width: 540px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { pointer-events: auto; display: flex; position: relative; padding: 4px; border-radius: 999px; transition: padding .4s var(--spring); }
.tabs .lens { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--lens);
  transition: transform .55s var(--spring), width .45s var(--spring); }
.tab { position: relative; z-index: 1; width: 94px; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 10px; font-weight: 600; color: var(--text); transition: width .45s var(--spring), height .45s var(--spring), color .2s; }
.tab:not([aria-current]) { color: var(--text-2); }
.tab svg { width: 26px; height: 26px; transition: transform .35s var(--spring); }
.tab:active svg { transform: scale(.86); }
.tab span { transition: opacity .2s, max-height .3s; max-height: 14px; overflow: hidden; }
.fab { pointer-events: auto; width: 62px; height: 62px; border-radius: 31px; display: grid; place-items: center; color: var(--text); transition: transform .45s var(--spring), width .45s var(--spring), height .45s var(--spring); }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.88); }
body.min .tab { width: 62px; height: 46px; }
body.min .tab span { opacity: 0; max-height: 0; }
body.min .tab:not([aria-current]) { width: 0; opacity: 0; pointer-events: none; }
body.min .fab { width: 54px; height: 54px; }

.view { animation: viewIn .4s var(--ios); }
@keyframes viewIn { from { opacity: 0; transform: scale(.985); } }

/* история */
.card { background: var(--group); border-radius: 26px; padding: 18px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi .n { font-size: 13px; color: var(--text-2); }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.8px; }
.kpi .v small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.chart { margin-top: 16px; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.caption { margin: 8px 6px 0; font-size: 13px; color: var(--text-2); }

/* кнопки — капсулы */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 999px; background: var(--ink); color: var(--on-ink);
  font-size: 17px; font-weight: 600; transition: transform .4s var(--spring), opacity .2s; }
.btn:active { transform: scale(.96); }
.btn.soft { background: var(--fill); color: var(--text); }
.btn.danger { background: none; color: var(--bad); font-weight: 500; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn + .btn { margin-top: 8px; }
.btn svg { width: 20px; height: 20px; }

/* листы: высокий — непрозрачный; низкий — стеклянный, отступает от краёв экрана */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); opacity: 0; transition: opacity .4s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; height: calc(100dvh - 10px - var(--safe-t));
  display: flex; flex-direction: column; background: var(--sheet); border-radius: 38px 38px 0 0; transform: translateY(104%);
  box-shadow: 0 -0.5px 0 var(--rim), 0 -10px 40px rgba(0,0,0,.25); transition: transform .55s var(--ios); }
.sheet .list, .sheet .card { background: var(--sheet-group); }
.sheet .cell { background: var(--sheet-group); }
.sheet.short { height: auto; max-height: calc(100dvh - 24px - var(--safe-t)); left: 8px; right: 8px; bottom: calc(max(8px, calc(var(--safe-b) - 8px)) + var(--kb, 0px)); transition: transform .55s var(--ios), bottom .25s var(--ios);
  border-radius: 40px; background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(1.9); backdrop-filter: blur(30px) saturate(1.9);
  box-shadow: 0 0 0 .5px var(--edge), inset 0 0 0 .5px var(--rim), inset 0 1.2px 0 var(--spec), var(--drop); transform: translateY(calc(100% + 40px)); }
@media (min-width: 576px) { .sheet.short { left: 0; right: 0; } }
.sheet.on { transform: none; }
.sheet .head { position: relative; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; height: 64px; padding: 6px 12px 0; touch-action: none; flex: none; }
.sheet .head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--text-3); }
.sheet .head h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); }
.hbtn svg { width: 16px; height: 16px; }
.hbtn.r { justify-self: end; }
.sheet .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px calc(24px + var(--safe-b)); }
.sheet.short .body { padding-bottom: 20px; }
.sheet .body.slide { animation: slideIn .45s var(--ios); }
@keyframes slideIn { from { opacity: 0; transform: translateX(28px); } }
.group-t { margin: 22px 18px 7px; font-size: 13px; color: var(--text-2); }
.foot { margin: 7px 18px 0; font-size: 13px; color: var(--text-2); }

.search { position: relative; margin: 4px 0 0; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 999px; background: var(--fill); padding: 0 16px 0 40px; font-size: 17px; }
.search input::placeholder { color: var(--text-2); }
.search input:focus { outline: none; }
.search svg { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; color: var(--text-2); }
.photo-cta { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 12px; padding: 14px 20px; border-radius: 26px; background: var(--ink); color: var(--on-ink); text-align: left; transition: transform .4s var(--spring); }
.photo-cta:active { transform: scale(.97); }
.photo-cta svg { width: 26px; height: 26px; flex: none; }
.photo-cta b { display: block; font-size: 17px; font-weight: 600; }
.photo-cta span { font-size: 13px; opacity: .6; }
.seg.meal { margin-top: 12px; }
.seg.meal button { font-size: 14px; }

.portion { text-align: center; }
.portion .title { margin-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -.6px; }
.portion .per { margin-top: 4px; color: var(--text-2); font-size: 14px; }
.grams { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 30px 0 18px; }
.grams .st { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; }
.grams .st svg { width: 18px; height: 18px; }
.grams .box { display: flex; align-items: baseline; justify-content: center; min-width: 140px; }
.grams input { width: 3ch; min-width: 1.6ch; border: 0; background: transparent; text-align: center; font-size: 60px; font-weight: 600; letter-spacing: -2.5px; padding: 0; font-variant-numeric: tabular-nums; }
.grams input:focus { outline: none; }
.grams .u { font-size: 22px; color: var(--text-2); font-weight: 500; margin-left: 4px; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { height: 36px; padding: 0 16px; border-radius: 999px; background: var(--fill); font-size: 15px; transition: transform .35s var(--spring), background .2s, color .2s; }
.chip:active { transform: scale(.92); }
.chip.on { background: var(--ink); color: var(--on-ink); }
.facts { display: grid; grid-template-columns: repeat(5, 1fr); margin: 28px 0 26px; background: var(--sheet-group); border-radius: 26px; padding: 14px 4px; }
.facts div + div { border-left: .5px solid var(--sep); }
.facts b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.5px; }
.facts span { font-size: 12px; color: var(--text-2); }

.field { display: flex; align-items: center; gap: 10px; }
.field label { flex: 1; }
.field input { width: 110px; height: 34px; border: 0; background: transparent; text-align: right; font-size: 17px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.field input:focus { color: var(--text); outline: none; }
.field input.wide { width: 100%; text-align: left; color: var(--text); }

      </div>

/* ——— листы ——— */
let onSheetClose = null;
let lockY = null;
function lockScroll() { // iOS: body fixed — фон под листом не едет
  if (lockY != null) return;
  lockY = scrollY;
  Object.assign(document.body.style, { position: 'fixed', top: -lockY + 'px', left: '0', right: '0' });
}
function unlockScroll() {
  if (lockY == null) return;
  const y = lockY;
  Object.assign(document.body.style, { position: '', top: '', left: '', right: '' });
  scrollTo(0, y); lockY = null;
}
function openSheet(title, html, after, opts = {}) {
  const sh = $('#sheet'), sc = $('#scrim'), body = $('#sheetBody');
  $('#sheetTitle').textContent = title;
  $('#sheetBack').innerHTML = opts.back ? `<button class="hbtn glass press" id="backBtn" aria-label="Назад">${I.back}</button>` : '';
  if (opts.back) $('#backBtn').onclick = opts.back;
  sh.classList.toggle('short', !!opts.short);
  body.innerHTML = html; body.scrollTop = 0;
  body.classList.remove('slide'); if (opts.slide) { void body.offsetWidth; body.classList.add('slide'); }
  lockScroll();
  if (sh.hidden) {
    sh.hidden = sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('on'); sc.classList.add('on'); }));
  } else { sh.classList.add('on'); sc.classList.add('on'); } // открыли снова, пока прошлый лист уезжал
  after && after(body);
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  if (sh.hidden) return;
  sh.style.transform = '';
  sh.classList.remove('on'); sc.classList.remove('on');
  setTimeout(() => { if (!sh.classList.contains('on')) sh.hidden = sc.hidden = true; }, 500);
  unlockScroll();
  if (document.activeElement) document.activeElement.blur();
  photoReq && photoReq.abort(); photoReq = null;
  clearTimeout(shopTimer); shopReq && shopReq.abort(); shopReq = null;
  const f = onSheetClose; onSheetClose = null; f && f();
}
$('#scrim').onclick = closeSheet;
$('#sheetClose').onclick = closeSheet;
(() => { // лист тянется вниз пальцем
  const sh = $('#sheet'), head = sh.querySelector('.head'); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; };
  head.addEventListener('touchend', end); head.addEventListener('touchcancel', end);
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

const toFood = ([name, kcal, p, f, c, salt, u]) => ({ name, kcal, p, f, c, salt, unit: u ? { name: u.split('=')[0], g: +u.split('=')[1] } : null });
const FOODS = BASE.map(toFood), DISH = DISHES.map(f => ({ ...toFood(f), dish: true }));
const macroLine = f => `${fmt(f.kcal)} ккал · Б ${dec(f.p)} · Ж ${dec(f.f)} · У ${dec(f.c)}`;
const mealName = m => MEALS.find(x => x[0] === m)[1];

/* большая база: блюда и продукты со всего мира (USDA FNDDS, переведено) — грузится при первом поиске */
let WORLD = null, worldLoading = null;
function loadWorld() {
  if (WORLD || worldLoading) return worldLoading || Promise.resolve(WORLD);
  worldLoading = fetch('foods.json').then(r => r.ok ? r.json() : []).catch(() => []).then(rows => {
    WORLD = rows.filter(r => Array.isArray(r) && r[0]).map(([name, kcal, p, f, c, salt, g, est]) => ({ name, kcal, p, f, c, salt, unit: g > 0 ? { name: 'порция', g } : null, world: true, dish: !!est, n: norm(name) }));
    worldLoading = null; return WORLD;
  });
  return worldLoading;
}
const LIMIT = 60;
function findFoods(s) { // все слова запроса в названии; сначала мои и наши, потом мировая база; точнее и короче — выше
  const words = s.split(/[\s,()«»"-]+/).filter(Boolean);
  if (!words.length) return [];
  const pools = [S.custom.map(x => ({ ...x, custom: true, n: norm(x.name) })), DISH.concat(FOODS).map(x => (x.n = x.n || norm(x.name), x)), WORLD || []];
  const out = [];
  pools.forEach((pool, src) => { for (const f of pool) if (words.every(w => f.n.includes(w))) {
    const w0 = words[0], at = f.n.indexOf(w0);
    out.push({ f, rank: src * 3 + (at === 0 ? 0 : /[\s,(]/.test(f.n[at - 1] || '') ? 1 : 2) + (src === 2 && at !== 0 ? 1 : 0), len: f.n.length });
  } });
  return out.sort((a, b) => a.rank - b.rank || a.len - b.len).map(x => x.f);
}
let shopReq = null, shopTimer = null;
function shopSearch(q, done) { // продукты из магазинов (Open Food Facts) через сервер Тренера
  clearTimeout(shopTimer); shopReq && shopReq.abort(); shopReq = null;
  if (q.trim().length < 3) return done(null);
  shopTimer = setTimeout(async () => {
    const ctl = new AbortController(); shopReq = ctl;
    const t = setTimeout(() => ctl.abort(), 9000);
    try {
      const r = await fetch(`${API}/api/kcal/shop?q=${encodeURIComponent(q.trim())}`, { signal: ctl.signal });
      const j = await r.json().catch(() => ({}));
      if (shopReq === ctl) done(r.ok && Array.isArray(j.items) ? j.items : 'err');
    } catch (e) { if (shopReq === ctl) done(e.name === 'AbortError' && shopReq !== ctl ? null : 'err'); }
    finally { clearTimeout(t); }
  }, 450);
}

function openAdd(meal, query) {
  let m = meal || mealNow(), q = query || '', shop = null;
  const draw = () => {
    const s = norm(q.trim());
    let html = '';
    const row = (f, key, sub) => `<button class="cell" data-k="${key}"><span class="t"><div class="n">${esc(f.name)}${f.dish ? ' <span style="color:var(--text-3)">≈</span>' : ''}</div>
      <div class="m num">${sub || macroLine(f) + ' на 100 г'}</div></span>${I.chev}</button>`;
    const pool = {};
    if (!s) {
      const rec = S.recent.slice(0, 6);
      if (rec.length) { html += `<div class="group-t">Недавние</div><div class="list">${rec.map((f, i) => { pool['r' + i] = f; return row(f, 'r' + i, f.g ? `${fmt(f.g)} г · ${fmt(f.kcal * f.g / 100)} ккал` : `${fmt(f.kcal)} ккал`); }).join('')}</div>`; }
      if (S.custom.length) html += `<div class="group-t">Мои продукты</div><div class="list">${S.custom.map((f, i) => { pool['m' + i] = f; return row(f, 'm' + i); }).join('')}</div>`;
      html += `<div class="group-t">Популярные блюда</div><div class="list">${DISH.map((f, i) => { pool['d' + i] = f; return row(f, 'd' + i); }).join('')}</div>`;
      html += `<div class="group-t">Продукты</div><div class="list">${FOODS.map((f, i) => { pool['b' + i] = f; return row(f, 'b' + i); }).join('')}</div>`;
      html += `<div class="foot">В поиске — больше 5 000 блюд со всего мира и продукты из магазинов. ≈ — готовое блюдо, калорийность зависит от рецепта.</div>`;
    } else {
      const hit = findFoods(s), shown = hit.slice(0, LIMIT);
      if (shown.length) html += `<div class="list" style="margin-top:14px">${shown.map((f, i) => { pool['s' + i] = f; return row(f, 's' + i); }).join('')}</div>`;
      if (hit.length > LIMIT) html += `<div class="foot">Ещё ${fmt(hit.length - LIMIT)} — уточни запрос</div>`;
      if (!WORLD) html += `<div class="foot">Загружаю блюда со всего мира…</div>`;
      if (Array.isArray(shop) && shop.length) html += `<div class="group-t">В магазинах</div><div class="list">${shop.map((x, i) => {
        const f = { name: x.brand ? `${x.name} · ${x.brand}` : x.name, kcal: x.kcal, p: x.p, f: x.f, c: x.c, salt: x.salt, unit: x.g > 0 ? { name: 'порция', g: x.g } : null };
        pool['o' + i] = f; return row(f, 'o' + i); }).join('')}</div>`;
      else if (shop === 'wait') html += `<div class="foot">Ищу в магазинах…</div>`;
      if (!shown.length && shop !== 'wait' && !(Array.isArray(shop) && shop.length) && WORLD) html += `<div class="lead" style="margin-top:30px">Такого не нашёл.<br>Сфотографируй еду или добавь свой продукт.</div>`;
    }
    html += `<div class="list" style="margin-top:22px"><button class="cell" id="own"><span class="t"><div class="n">Свой продукт</div><div class="m">Цифры с этикетки</div></span>${I.chev}</button>
      <button class="cell" id="quick"><span class="t"><div class="n">Только калории</div><div class="m">Когда состав неизвестен</div></span>${I.chev}</button></div>
      <div class="foot">Блюда мира — база USDA FoodData Central, продукты магазинов — Open Food Facts (ODbL).</div>`;
    const res = $('#results'); if (!res) return; res.innerHTML = html;
    res.onclick = e => {
      const b = e.target.closest('[data-k]');
      if (b) { const f = pool[b.dataset.k]; if (b.dataset.k[0] === 'r' && !f.g) addItem(m, { name: f.name, g: 0, kcal: f.kcal, p: f.p, f: f.f, c: f.c, salt: f.salt || 0 }); else openPortion(f, m, null, b.dataset.k[0] === 'r' ? f.g : 0, () => openAdd(m, q)); }

  const search = () => {
    const mine = q;

    draw();
  };
  const html = `<div class="search">${I.search}<input id="q" type="search" placeholder="Любое блюдо или продукт" autocomplete="off" enterkeyhint="search" aria-label="Найти продукт"></div>
    <button class="photo-cta" id="photoCta">${I.cam}<span><b>Сфотографировать еду</b><span>Узнаю блюда и граммы по фото</span></span></button>
    <div class="seg meal" id="mseg"><span class="thumb"></span>${MEALS.map(([k, n]) => `<button data-m="${k}" aria-pressed="${k === m}">${n}</button>`).join('')}</div>
    <div id="results"></div>`;
  openSheet('Добавить', html, body => {
    const seg = $('#mseg', body);
    requestAnimationFrame(() => placeSeg(seg));
    seg.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; m = b.dataset.m; seg.querySelectorAll('[data-m]').forEach(c => c.setAttribute('aria-pressed', c === b)); placeSeg(seg, true); buzz(); };
    const inp = $('#q', body);
    inp.value = q; $('#photoCta', body).hidden = !!q.trim();
    inp.oninput = () => { q = inp.value; search(); $('#photoCta', body).hidden = !!q.trim(); };
    $('#photoCta', body).onclick = () => photoFlow(m);
    if (!WORLD) loadWorld().then(() => { if ($('#q') === inp) draw(); });
    q.trim() ? search() : draw();
  }, {});
}

function openPortion(food, meal, item, grams, back) {
  let g = item ? item.g : grams || (food.unit ? food.unit.g : 100);
  const per = food.per100 || food;
  const units = [];
  if (food.unit) units.push([`${food.unit.name}`, food.unit.g]);
  for (const x of [50, 100, 150, 200, 300]) if (!food.unit || x !== food.unit.g) units.push([`${x} г`, x]);
  const html = `<div class="portion">
    <div class="title">${esc(food.name)}</div><div class="per num">${macroLine(per)}${per.salt ? ' · соль ' + dec(per.salt) : ''} на 100 г</div>
    <div class="grams"><button class="st" id="minus" aria-label="Меньше">${I.minus}</button>
      <span class="box"><input id="g" class="num" inputmode="decimal" value="${String(r1(g)).replace('.', ',')}" aria-label="Граммы"><span class="u">г</span></span>
      <button class="st" id="plus" aria-label="Больше">${I.plus}</button></div>
    <div class="chips" id="units">${units.map(([n, v]) => `<button class="chip" data-g="${v}">${n}</button>`).join('')}</div>
    <div class="facts num" id="res"></div>
    <button class="btn" id="ok">${item ? 'Сохранить' : 'Добавить в «' + mealName(meal) + '»'}</button>
    ${item ? `<button class="btn danger" id="del">Удалить</button>` : ''}
  </div>`;
  openSheet(item ? 'Изменить' : 'Порция', html, body => {
    const inp = $('#g', body), res = $('#res', body);
    const calc = () => {
      inp.style.width = Math.max(1.6, String(inp.value).length + 0.3) + 'ch';
      const k = num(inp.value) / 100;
      res.innerHTML = `<div><b>${fmt(per.kcal * k)}</b><span>ккал</span></div><div><b>${Math.round(per.p * k)}</b><span>белки</span></div>
        <div><b>${Math.round(per.f * k)}</b><span>жиры</span></div><div><b>${Math.round(per.c * k)}</b><span>углев.</span></div><div><b>${dec((per.salt || 0) * k)}</b><span>соль</span></div>`;
      body.querySelectorAll('[data-g]').forEach(c => c.classList.toggle('on', +c.dataset.g === num(inp.value)));
    };
    const set = v => { inp.value = String(Math.max(0, Math.round(v * 10) / 10)).replace('.', ','); calc(); buzz(); };
    calc();
    inp.oninput = calc;
    inp.onfocus = () => inp.select();
    $('#minus', body).onclick = () => set(num(inp.value) - (num(inp.value) > 10 ? 10 : 1));
    $('#plus', body).onclick = () => set(num(inp.value) + (num(inp.value) >= 10 ? 10 : 1));
    $('#units', body).onclick = e => { const b = e.target.closest('[data-g]'); if (b) set(+b.dataset.g); };
    $('#ok', body).onclick = () => {
      const gr = num(inp.value);
      if (gr <= 0) { toast('Укажи граммы'); inp.focus(); return; }
      const k = gr / 100;
      const data = { name: food.name, g: gr, kcal: per.kcal * k, p: per.p * k, f: per.f * k, c: per.c * k, salt: (per.salt || 0) * k,
        per100: { kcal: per.kcal, p: per.p, f: per.f, c: per.c, salt: per.salt || 0 }, unit: food.unit || null };
      if (item) { const before = totals(cur).kcal; Object.assign(item, data); save(); closeSheet(); renderToday(false); changed(before, 'Сохранено'); }
      else addItem(meal, data);
    };
    if (item) $('#del', body).onclick = () => deleteItem(item);
  }, { back, slide: !!back });
}

function changed(before, text) { // тост после добавления/правки; перешли норму — говорим об этом
  const g = S.goals[dayType(cur)].kcal, after = totals(cur).kcal;
  if (before < g && after >= g) { toast(cur === today() ? 'Норма на сегодня закрыта' : 'Норма дня закрыта'); buzz(); }
  else toast(text);
}
function addItem(meal, data, many) {
  const before = totals(cur).kcal, d = S.days[cur] = day(cur);
  const it = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), meal }, data);
  d.items.push(it); lastAdded = it.id;
  const per = data.per100 || { kcal: data.kcal, p: data.p, f: data.f, c: data.c, salt: data.salt || 0 };
  S.recent = [{ name: data.name, g: data.g || 0, unit: data.unit || null, ...per }].concat(S.recent.filter(r => r.name !== data.name)).slice(0, 20);
  save();
  if (many) return;
  buzz(); closeSheet(); renderToday(false);
  changed(before, `${data.name.length > 22 ? data.name.slice(0, 21) + '…' : data.name} · ${fmt(data.kcal)} ккал`);
}
function deleteItem(item) {
  if (!item) return;
  const dk = cur, d = day(dk), i = d.items.indexOf(item);
  if (i < 0) return;
  d.items.splice(i, 1); save(); closeSheet(); renderToday(false); buzz();
  toast('Удалено', 'Вернуть', () => { // в тот день, откуда удалили, даже если уже открыт другой
    if (d.items.includes(item)) return;
    d.items.splice(Math.min(i, d.items.length), 0, item); S.days[dk] = d; save();
    if (view === 'today' && cur === dk) renderToday(false);
  });
}
function openItem(id) {
  const it = day(cur).items.find(i => i.id === id); if (!it) return;
  if (it.per100) openPortion({ name: it.name, per100: it.per100, unit: it.unit }, it.meal, it);
  else openQuick(it.meal, it);
}

function formRows(rows) {
  return `<div class="list">${rows.map(([id, label, val, ph, wide]) => wide
    ? `<div class="cell"><input id="${id}" class="wide" style="border:0;background:none;font-size:17px;width:100%;height:34px" placeholder="${ph}" value="${val}" autocomplete="off" aria-label="${label}"></div>`
    : `<div class="cell field"><label for="${id}">${label}</label><input id="${id}" inputmode="decimal" placeholder="${ph}" value="${val}"></div>`).join('')}</div>`;
}
function openCustom(meal) {
  const html = `<div class="group-t">Название</div>${formRows([['cn', 'Название', '', 'Например, йогурт Активиа', 1]])}
    <div class="group-t">На 100 г</div>${formRows([['ck', 'Калории', '', '0'], ['cp', 'Белки, г', '', '0'], ['cf', 'Жиры, г', '', '0'], ['cc', 'Углеводы, г', '', '0'], ['cs', 'Соль, г', '', '0']])}
    <div class="foot">Соль на этикетке бывает как «натрий» — умножь его на 2,5.</div>

      const name = $('#cn', body).value.trim(), kcal = num($('#ck', body).value);

      if (kcal <= 0) { toast('Укажи калории на 100 г'); $('#ck', body).focus(); return; }
      const ug = num($('#cu', body).value);
      const pos = id => Math.max(0, num($(id, body).value));
      const f = { name, kcal, p: pos('#cp'), f: pos('#cf'), c: pos('#cc'), salt: pos('#cs'), unit: ug > 0 ? { name: 'порция', g: ug } : null };
      S.custom = [f].concat(S.custom.filter(x => x.name !== name)); save();
      openPortion(f, meal, null, 0, () => openAdd(meal));
    };
  }, { back: () => openAdd(meal), slide: true });

const MAX_SHOTS = 3;

function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); // крупнее — видно масштаб и мелочь
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(src); ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(src); fail(); };
    img.src = src;
  });
}
async function recognize(shots, meal, hint = '') {
  if (typeof shots === 'string') shots = [shots];

  openSheet('Фото', `<div class="shot"><img src="${url}" alt=""><div class="scan"></div></div>

  const ctl = new AbortController(); photoReq = ctl;
  const timer = setTimeout(() => ctl.abort(), 180000);
  try {
    const r = await fetch(API + '/api/kcal/photo', { method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
      body: JSON.stringify({ image: url, images: shots.slice(1), text: hint }) });
    const j = await r.json().catch(() => ({}));

function showFound(url, items, comment, meal) {

  if (action) {
    const b = document.createElement('button'); b.textContent = action;
    b.onclick = () => { b.onclick = null; t.style.pointerEvents = 'none'; fn(); t.classList.remove('on'); };
    t.appendChild(b); t.style.pointerEvents = 'auto';

  t.classList.add('on'); clearTimeout(toastT);

document.addEventListener('visibilitychange', () => { // открыли на следующий день — показать новый день
  if (document.hidden) { onToday = cur === today(); return; }
  if (onToday && cur !== today() && view === 'today' && !$('#sheet').classList.contains('on')) { cur = today(); shown.left = null; renderToday(true); }
});
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
