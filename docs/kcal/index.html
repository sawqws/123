<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калории">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>Калории</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #000000;
  --group: #1c1c1e;
  --fill: #2c2c2e;
  --fill-2: #3a3a3c;
  --sep: rgba(84,84,88,.55);
  --text: #ffffff;
  --text-2: rgba(235,235,245,.6);
  --text-3: rgba(235,235,245,.3);
  --ink: #ffffff;
  --on-ink: #000000;
  --track: rgba(255,255,255,.1);
  --p: #6aa8ff;
  --f: #ffb547;
  --c: #5ed39b;
  --s: #bba8ff;
  --warn: #ff9f0a;
  --bad: #ff453a;
  --good: #30d158;
  --bar: rgba(22,22,24,.72);
  --ios: cubic-bezier(.32,.72,0,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2f2f7; --group: #ffffff; --fill: #e9e9ee; --fill-2: #dcdce2; --sep: rgba(60,60,67,.18);
    --text: #000000; --text-2: rgba(60,60,67,.6); --text-3: rgba(60,60,67,.3);
    --ink: #000000; --on-ink: #ffffff; --track: rgba(0,0,0,.07);
    --p: #2c7cf0; --f: #e8940f; --c: #1fa86b; --s: #7a5af5; --warn: #f08c00; --bad: #ff3b30; --good: #28b44c;
    --bar: rgba(249,249,251,.8);
    color-scheme: light;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  letter-spacing: -.2px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh; -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }

.app { max-width: 540px; margin: 0 auto; padding: calc(8px + var(--safe-t)) 16px calc(104px + var(--safe-b)); }

/* навигация: большой заголовок, при прокрутке — маленький в стеклянной полосе */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(44px + var(--safe-t)); padding-top: var(--safe-t);
  display: flex; align-items: center; justify-content: center; pointer-events: none;
  background: transparent; border-bottom: .5px solid transparent; transition: background .25s, border-color .25s; }
.nav .t { font-size: 17px; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .25s var(--ios); }
body.scrolled .nav { background: var(--bar); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-color: var(--sep); }
body.scrolled .nav .t { opacity: 1; transform: none; }
.actions { position: fixed; z-index: 31; top: calc(4px + var(--safe-t)); right: max(8px, calc(50% - 262px)); display: flex; gap: 2px; }
.ibtn { width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; color: var(--text); transition: opacity .15s, transform .15s; }
.ibtn:active { opacity: .45; transform: scale(.92); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn.solid { background: var(--fill); }
.today-btn { position: fixed; z-index: 31; top: calc(8px + var(--safe-t)); left: max(16px, calc(50% - 254px)); height: 30px; padding: 0 12px; border-radius: 15px;
  background: var(--fill); font-size: 15px; font-weight: 600; transition: opacity .15s; }
.today-btn:active { opacity: .5; }

.large { margin: 38px 0 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.9px; }
.subtitle { margin-top: 2px; color: var(--text-2); font-size: 15px; display: flex; align-items: center; gap: 6px; }
.streak { display: inline-flex; align-items: center; gap: 3px; color: var(--warn); font-weight: 600; }
.streak svg { width: 13px; height: 13px; }

/* неделя: маленькие кольца */
.week { display: grid; grid-template-columns: repeat(7, 1fr); margin: 18px -4px 0; touch-action: pan-y; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; border-radius: 14px; transition: background .2s; }
.wd .l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.wd svg { width: 34px; height: 34px; }
.wd[aria-current="date"] { background: var(--group); }
.wd[aria-current="date"] .l { color: var(--text); font-weight: 600; }
.wd[disabled] { opacity: .3; pointer-events: none; }
.wd.today .l::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 2px; background: var(--bad); margin: 2px auto 0; }
.wd:not(.today) .l::after { content: ""; display: block; height: 4px; margin-top: 2px; }

/* сегменты iOS */
.seg { position: relative; display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-top: 18px; }
.seg button { flex: 1; position: relative; z-index: 1; height: 30px; font-size: 14px; font-weight: 500; color: var(--text); transition: opacity .2s; }
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 7px; background: var(--fill-2); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
  transition: transform .4s var(--ios), width .4s var(--ios); }
@media (prefers-color-scheme: light) { .seg .thumb { background: #fff; } }

/* кольцо */
.ring-wrap { position: relative; width: min(62vw, 236px); aspect-ratio: 1; margin: 22px auto 0; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-wrap .arc { transition: stroke-dashoffset 1s var(--ios); }
.ring-wrap.done .arc { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ink) 35%, transparent)); }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-in .big { font-size: 50px; line-height: 1; font-weight: 600; letter-spacing: -2.2px; }
.ring-in .cap { margin-top: 6px; font-size: 15px; color: var(--text-2); }
.ring-in .of { margin-top: 10px; font-size: 13px; color: var(--text-3); }
.ring-in .big.over { color: var(--warn); }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 2px 0; }
.metric .n { font-size: 13px; color: var(--text-2); }
.metric .v { margin-top: 1px; font-size: 19px; font-weight: 600; letter-spacing: -.5px; white-space: nowrap; }
.metric .v small { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.metric .b { height: 3px; border-radius: 2px; background: var(--track); margin-top: 8px; overflow: hidden; }
.metric .b i { display: block; height: 100%; border-radius: 2px; background: var(--dot); transition: width .9s var(--ios), background .3s; }

/* списки как в Настройках iPhone */
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 7px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.sec-h span { font-size: 15px; color: var(--text-2); }
.list { background: var(--group); border-radius: 12px; overflow: hidden; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; text-align: left; padding: 9px 16px; background: var(--group); }
.cell + .cell::before, .swipe + .swipe .cell::before, .swipe + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
button.cell { transition: background .15s; }
button.cell:active { background: var(--fill); }
.cell .t { flex: 1; min-width: 0; }
.cell .n { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .m { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .k { font-size: 17px; color: var(--text-2); }
.cell .chev { width: 8px; height: 13px; color: var(--text-3); }
.cell.add { color: var(--text); font-weight: 500; min-height: 46px; gap: 10px; }
.cell.add svg { width: 20px; height: 20px; color: var(--text-2); }
.cell.add .ph { margin-left: auto; color: var(--text-2); }
.swipe { position: relative; overflow: hidden; }
.swipe .del { opacity: 0; transition: opacity .2s; position: absolute; top: 0; right: 0; bottom: 0; width: 88px; background: var(--bad); color: #fff; font-weight: 600; font-size: 15px; display: grid; place-items: center; }
.swipe .cell { transition: transform .35s var(--ios); will-change: transform; }
.swipe.sw .del { opacity: 1; }
.item-in { animation: itemIn .45s var(--ios); }
@keyframes itemIn { from { opacity: 0; transform: translateY(-8px); } }

/* нижнее меню */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 6px 0 max(8px, var(--safe-b));
  background: var(--bar); -webkit-backdrop-filter: saturate(1.8) blur(20px); backdrop-filter: saturate(1.8) blur(20px); border-top: .5px solid var(--sep); }
.tabbar .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; letter-spacing: .1px; color: var(--text-3); padding: 2px 0; transition: color .2s, transform .15s; }
.tab:active { transform: scale(.94); }
.tab svg { width: 27px; height: 27px; }
.tab[aria-current="page"] { color: var(--text); }
.tab.plus { color: var(--text); }

.view { animation: viewIn .35s var(--ios); }
@keyframes viewIn { from { opacity: 0; } }

/* история */
.card { background: var(--group); border-radius: 12px; padding: 16px; }
.card + .card, .sec .card { margin-top: 0; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi .n { font-size: 13px; color: var(--text-2); }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.8px; }
.kpi .v small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.chart { margin-top: 16px; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.caption { margin: 8px 4px 0; font-size: 13px; color: var(--text-2); }

/* кнопки */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; border-radius: 14px; background: var(--ink); color: var(--on-ink);
  font-size: 17px; font-weight: 600; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.97); opacity: .85; }
.btn.soft { background: var(--fill); color: var(--text); }
.btn.danger { background: none; color: var(--bad); font-weight: 500; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn + .btn { margin-top: 8px; }
.btn svg { width: 20px; height: 20px; }

/* листы */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .35s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; height: calc(100dvh - 12px - var(--safe-t));
  display: flex; flex-direction: column; background: var(--bg); border-radius: 12px 12px 0 0; transform: translateY(102%); transition: transform .5s var(--ios); }
@media (prefers-color-scheme: dark) { .sheet { background: #1c1c1e; } .sheet .list, .sheet .card { background: #2c2c2e; } .sheet .fillbox { background: #3a3a3c; } }
.sheet.short { height: auto; max-height: calc(100dvh - 12px - var(--safe-t)); }
.sheet.on { transform: none; }
.sheet .head { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; height: 56px; padding: 0 8px; touch-action: none; flex: none; }
.sheet .head::before { content: ""; position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--text-3); }
.sheet .head h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
.sheet .head .back, .sheet .head .close { font-size: 17px; padding: 8px; color: var(--text); }
.sheet .head .close { justify-self: end; font-weight: 600; }
.sheet .head .back { justify-self: start; display: flex; align-items: center; gap: 2px; }
.sheet .head .back svg { width: 12px; height: 20px; }
.sheet .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px calc(24px + var(--safe-b)); }
.sheet .body.slide { animation: slideIn .4s var(--ios); }
@keyframes slideIn { from { opacity: 0; transform: translateX(24px); } }
.group-t { margin: 22px 16px 7px; font-size: 13px; color: var(--text-2); }
.foot { margin: 7px 16px 0; font-size: 13px; color: var(--text-2); }

.search { position: relative; margin: 4px 0 0; }
.search input { width: 100%; height: 38px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 12px 0 34px; font-size: 17px; }
.search input::placeholder { color: var(--text-2); }
.search svg { position: absolute; left: 10px; top: 10px; width: 18px; height: 18px; color: var(--text-2); }
.photo-cta { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--ink); color: var(--on-ink); text-align: left; transition: transform .15s; }
.photo-cta:active { transform: scale(.98); }
.photo-cta svg { width: 26px; height: 26px; flex: none; }
.photo-cta b { display: block; font-size: 17px; font-weight: 600; }
.photo-cta span { font-size: 13px; opacity: .6; }
.seg.meal { margin-top: 12px; }

.portion { text-align: center; }
.portion .title { margin-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -.6px; }
.portion .per { margin-top: 4px; color: var(--text-2); font-size: 14px; }
.grams { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 30px 0 18px; }
.grams .st { width: 44px; height: 44px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; transition: transform .15s; }
.grams .st:active { transform: scale(.88); }
.grams .st svg { width: 18px; height: 18px; }
.grams .box { display: flex; align-items: baseline; justify-content: center; min-width: 140px; }
.grams input { width: 3ch; min-width: 1.6ch; border: 0; background: transparent; text-align: center; font-size: 60px; font-weight: 600; letter-spacing: -2.5px; padding: 0; font-variant-numeric: tabular-nums; }
.grams .u { font-size: 22px; color: var(--text-2); font-weight: 500; margin-left: 4px; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); font-size: 15px; transition: transform .15s, background .2s, color .2s; }
.chip:active { transform: scale(.94); }
.chip.on { background: var(--ink); color: var(--on-ink); }
.facts { display: grid; grid-template-columns: repeat(5, 1fr); margin: 28px 0 26px; background: var(--group); border-radius: 12px; padding: 14px 4px; }
.facts div + div { border-left: .5px solid var(--sep); }
.facts b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.5px; }
.facts span { font-size: 12px; color: var(--text-2); }

.field { display: flex; align-items: center; gap: 10px; }
.field label { flex: 1; }
.field input { width: 110px; height: 34px; border: 0; background: transparent; text-align: right; font-size: 17px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.field input:focus { color: var(--text); outline: none; }
.field input.wide { width: 100%; text-align: left; color: var(--text); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; }
.days button { height: 40px; border-radius: 10px; background: var(--fill); color: var(--text-2); font-size: 14px; font-weight: 600; transition: background .2s, color .2s, transform .15s; }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.days button:active { transform: scale(.92); }

/* фото */
.shot { position: relative; height: 210px; border-radius: 16px; overflow: hidden; margin-top: 4px; background: var(--fill); }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .scan { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,.0) 40%, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 60%, transparent 100%);
  background-size: 100% 220%; animation: scan 1.8s var(--ios) infinite; mix-blend-mode: overlay; }
@keyframes scan { from { background-position: 0 120%; } to { background-position: 0 -120%; } }
.thinking { text-align: center; margin-top: 22px; color: var(--text-2); font-size: 15px; }
.thinking b { display: block; color: var(--text); font-size: 20px; font-weight: 600; letter-spacing: -.4px; margin-bottom: 4px; }
.dots i { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--text-2); margin: 12px 3px 0; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: none; } }
.comment { margin: 14px 4px 0; font-size: 15px; color: var(--text-2); }
.pi { gap: 10px; }
.pi .check { width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid var(--text-3); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; }
.pi .check svg { width: 14px; height: 14px; color: var(--on-ink); opacity: 0; transition: opacity .2s; }
.pi.on .check { background: var(--ink); border-color: var(--ink); }
.pi.on .check svg { opacity: 1; }
.pi:not(.on) .t, .pi:not(.on) .mini { opacity: .4; }
.mini { display: flex; align-items: center; gap: 4px; }
.mini button { width: 30px; height: 30px; border-radius: 15px; background: var(--fill); display: grid; place-items: center; }
.mini button svg { width: 12px; height: 12px; }
.mini .g { min-width: 56px; text-align: center; font-size: 15px; font-weight: 600; }
.sum-line { display: flex; justify-content: space-between; margin: 14px 4px 18px; font-size: 15px; color: var(--text-2); }
.sum-line b { color: var(--text); }
.code { display: flex; justify-content: center; margin: 26px 0 8px; }
.code input:focus { outline: none; background: var(--fill-2); }
.code input { width: 220px; height: 64px; border: 0; border-radius: 14px; background: var(--fill); text-align: center; font-size: 34px; font-weight: 600; letter-spacing: 8px; font-variant-numeric: tabular-nums; }
.lead { text-align: center; color: var(--text-2); font-size: 15px; margin: 8px 12px 0; }
.lead b { color: var(--text); }
.hero-ico { width: 64px; height: 64px; border-radius: 18px; background: var(--fill); display: grid; place-items: center; margin: 18px auto 0; }
.hero-ico svg { width: 32px; height: 32px; }

.toast { position: fixed; left: 50%; top: calc(10px + var(--safe-t)); z-index: 60; transform: translate(-50%, -140%); opacity: 0;
  display: flex; align-items: center; gap: 10px; background: var(--group); color: var(--text); padding: 11px 18px; border-radius: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25); font-size: 15px; font-weight: 600; transition: opacity .3s, transform .5s var(--ios); white-space: nowrap; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast button { color: var(--p); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header class="nav" aria-hidden="true"><span class="t" id="navTitle"></span></header>
<div class="actions" id="actions"></div>
<button class="today-btn" id="todayBtn" hidden>Сегодня</button>
<main class="app" id="app"></main>

<nav class="tabbar" aria-label="Разделы">
  <div class="in">
    <button class="tab" data-tab="today" aria-current="page">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="14" cy="14" r="10"/><circle cx="14" cy="14" r="5"/></svg>Сегодня</button>
    <button class="tab plus" id="addTab" aria-label="Добавить еду">
      <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="currentColor"/><path d="M14 8.5v11M8.5 14h11" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/></svg>Добавить</button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 22v-7M11 22V8M16 22v-9M21 22V11"/></svg>История</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>

}

const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const wdi = s => (parseIso(s).getDay() + 6) % 7;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const norm = s => s.toLowerCase().replace(/ё/g, 'е');

let view = 'today', cur = today(), histRange = 7;

function day(d) { return S.days[d] || { items: [] }; }
function dayType(d) {
  const x = S.days[d];
  if (x && x.type) return x.type;
  return S.trainDays.includes(wdi(d)) ? 'train' : 'rest';
}
function totals(d) {
  const t = { kcal: 0, p: 0, f: 0, c: 0, salt: 0 };
  for (const it of day(d).items) { t.kcal += it.kcal; t.p += it.p; t.f += it.f; t.c += it.c; t.salt += it.salt || 0; }
  return t;
}
function dateTitle(d) {
  const t = today();
  if (d === t) return 'Сегодня';
  if (d === addDays(t, -1)) return 'Вчера';
  const x = parseIso(d);
  return `${x.getDate()} ${MONTHS[x.getMonth()]}`;
}
function mealNow() {
  const h = new Date().getHours();
  return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 18 ? 'snack' : 'dinner';
}
function streak() {
  let d = today(), n = 0;
  if (!day(d).items.length) d = addDays(d, -1);
  while (day(d).items.length) { n++; d = addDays(d, -1); }
  return n;
}
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };

function ringSvg(pct, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, pct));
  return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(pct > 0 ? Math.min(off, c - 0.01) : c).toFixed(2)}"/></svg>`;
}
function weekDays() {
  const start = addDays(cur, -wdi(cur));
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}

    <div class="seg" id="seg"><span class="thumb"></span>
      <button data-type="train" aria-pressed="${type === 'train'}">Тренировка</button>

        <div class="cap">${over ? 'ккал сверх нормы' : 'ккал осталось'}</div>

    </div>

      ${metric('f', 'Жиры', Math.round(t.f), g.f, 'г', 'var(--f)')}
      ${metric('c', 'Углеводы', Math.round(t.c), g.c, 'г', 'var(--c)')}
      ${metric('s', 'Соль', dec(t.salt), S.salt, 'г', salt > 1 ? 'var(--bad)' : salt > 0.8 ? 'var(--warn)' : 'var(--s)')}

      const its = d.items.filter(i => i.meal === m);

          <div class="m num">${i.g ? (i.g < 10 ? dec(i.g) : fmt(i.g)) + ' г · ' : ''}Б ${Math.round(i.p)} · Ж ${Math.round(i.f)} · У ${Math.round(i.c)}${i.salt >= 0.05 ? ' · соль ' + dec(i.salt) : ''}</div></span>
          <span class="k num">${fmt(i.kcal)}</span></button></div>`).join('')}
          <button class="cell add" data-add="${m}">${I.plus}Добавить<span class="ph" data-photo="${m}" role="button" aria-label="По фото">${I.cam.replace('viewBox="0 0 26 26"', 'viewBox="0 0 26 26" style="width:22px;height:22px"')}</span></button></div></section>`;
    }).join('')}
  </div>`;
  lastAdded = null;

  if (animate) requestAnimationFrame(() => requestAnimationFrame(() => {
    app.querySelectorAll('[data-w]').forEach(el => el.style.width = el.dataset.w);
    const arc = $('#ring .arc'), c = +arc.getAttribute('stroke-dasharray');
    arc.style.strokeDashoffset = pct > 0 ? Math.min(c * (1 - Math.min(1, pct)), c - 0.01) : c;
  }));
  if (shown.pct != null && shown.pct < 1 && pct >= 1 && !animate) { toast('Норма на сегодня закрыта'); buzz(); }
  shown.pct = pct;
  $('#gear').onclick = openSettings;
  $('#camBtn').onclick = () => photoFlow(mealNow());
  $('#week').onclick = e => { const b = e.target.closest('[data-d]'); if (b && b.dataset.d !== cur) { cur = b.dataset.d; shown.left = shown.pct = null; buzz(); renderToday(true); } };
  swipeWeek($('#week'));
  $('#seg').onclick = e => {
    const b = e.target.closest('button'); if (!b || b.getAttribute('aria-pressed') === 'true') return;
    S.days[cur] = Object.assign(day(cur), { type: b.dataset.type }); save(); buzz(); renderToday(false);
  };
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = e => {
    if (e.target.closest('[data-photo]')) photoFlow(b.dataset.add); else openAdd(b.dataset.add);
  });
  app.querySelectorAll('[data-item]').forEach(b => b.onclick = () => { if (!b.dataset.moved) openItem(b.dataset.item); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteItem(day(cur).items.find(i => i.id === b.dataset.del)));
  app.querySelectorAll('.swipe').forEach(swipeRow);
}
let lastAdded = null;
function swipeWeek(el) {
  let x0 = null, y0 = 0;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 == null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
    const next = addDays(cur, dx < 0 ? 7 : -7);
    cur = next > today() ? today() : next; shown.left = shown.pct = null; buzz(); renderToday(true);
  });
}
function swipeRow(row) { // свайп влево — «Удалить», как в iOS
  const cell = row.querySelector('.cell'); let x0 = null, y0 = 0, dx = 0, open = false, lock = null;
  row.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null; cell.style.transition = 'none'; delete cell.dataset.moved; }, { passive: true });
  row.addEventListener('touchmove', e => {
    if (x0 == null) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (lock == null && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(mx) > Math.abs(my) ? 'x' : 'y';
    if (lock !== 'x') return;
    dx = Math.min(0, Math.max(-120, mx + (open ? -88 : 0)));
    cell.style.transform = `translateX(${dx}px)`; cell.dataset.moved = 1; row.classList.add('sw');
  }, { passive: true });
  row.addEventListener('touchend', () => {
    if (x0 == null) return; x0 = null; cell.style.transition = '';
    if (lock !== 'x') { if (open) { open = false; cell.style.transform = ''; cell.dataset.moved = 1; setTimeout(() => !open && row.classList.remove('sw'), 350); } return; }
    open = dx < -44; cell.style.transform = open ? 'translateX(-88px)' : '';
    if (!open) setTimeout(() => !open && row.classList.remove('sw'), 350);
    if (open) buzz();
    setTimeout(() => delete cell.dataset.moved, 50);
  });
}
function placeThumb() {
  const seg = $('#seg'); if (!seg) return;
  const on = seg.querySelector('[aria-pressed="true"]'), th = seg.querySelector('.thumb');
  th.style.width = on.offsetWidth + 'px';
  th.style.transform = `translateX(${on.offsetLeft - 2}px)`;
}
function countUp(el, from, to) {
  if (from == null || from === to || reduce()) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 550;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ——— «История» ——— */
function renderHistory() {
  $('#navTitle').textContent = 'История';
  $('#todayBtn').hidden = true;
  setActions('');
  const t = today(), list = [];
  for (let i = histRange - 1; i >= 0; i--) { const d = addDays(t, -i), tt = totals(d); list.push({ d, t: tt.kcal, salt: tt.salt, g: S.goals[dayType(d)].kcal }); }
  const logged = list.filter(x => x.t > 0);
  const avg = logged.length ? logged.reduce((a, x) => a + x.t, 0) / logged.length : 0;
  const avgSalt = logged.length ? logged.reduce((a, x) => a + x.salt, 0) / logged.length : 0;
  const inNorm = logged.filter(x => x.t >= x.g * 0.9).length;
  const max = Math.max(...list.map(x => Math.max(x.t, x.g)), 1) * 1.06;
  const W = 340, H = 150, bw = W / list.length, gap = histRange === 7 ? 14 : 3, rx = histRange === 7 ? 6 : 2;
  const avgGoal = list.reduce((a, x) => a + x.g, 0) / list.length, gy = H - avgGoal / max * H;
  const bars = list.map((x, i) => {
    const h = x.t ? Math.max(4, x.t / max * H) : 4, X = i * bw + gap / 2;
    const fill = !x.t ? 'var(--track)' : x.t >= x.g * 0.9 ? 'var(--ink)' : 'color-mix(in srgb, var(--ink) 35%, transparent)';
    return `<rect x="${X.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${h.toFixed(1)}" rx="${rx}" fill="${fill}"><title>${dateTitle(x.d)}: ${fmt(x.t)} из ${fmt(x.g)}</title></rect>`;
  }).join('');
  const labels = histRange === 7 ? list.map((x, i) => `<text x="${(i * bw + bw / 2).toFixed(1)}" y="${H + 20}" text-anchor="middle" font-size="12" fill="var(--text-2)">${WEEK[wdi(x.d)]}</text>`).join('') : '';

  const ws = Object.entries(S.weights).sort((a, b) => a[0] < b[0] ? -1 : 1);
  let trend = '—', spark = '';
  if (ws.length > 1) {
    const [d0, w0] = ws[Math.max(0, ws.length - 9)], [d1, w1] = ws[ws.length - 1];
    const days = (parseIso(d1) - parseIso(d0)) / 864e5;
    if (days >= 7) { const pm = (w1 - w0) / days * 30; trend = `${pm >= 0 ? '+' : '−'}${dec(Math.abs(pm))}<small> кг/мес</small>`; }
    const pts = ws.slice(-30), lo = Math.min(...pts.map(p => p[1])) - 0.3, hi = Math.max(...pts.map(p => p[1])) + 0.3;
    const xy = pts.map((p, i) => [i / (pts.length - 1) * 340, 70 - (p[1] - lo) / (hi - lo) * 70]);
    spark = `<div class="chart"><svg viewBox="0 0 340 74"><polyline points="${xy.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${xy[xy.length - 1][0].toFixed(1)}" cy="${xy[xy.length - 1][1].toFixed(1)}" r="4.5" fill="var(--ink)"/></svg></div>`;
  }
  $('#app').innerHTML = `<div class="view">
    <h1 class="large">История</h1>
    <div class="seg" id="seg"><span class="thumb"></span>
      <button data-r="7" aria-pressed="${histRange === 7}">Неделя</button>
      <button data-r="30" aria-pressed="${histRange === 30}">Месяц</button></div>
    <section class="sec"><div class="sec-h"><h2>Калории</h2></div>
      <div class="card">
        <div class="kpis">
          <div class="kpi"><div class="n">В среднем</div><div class="v num">${logged.length ? fmt(avg) : '—'}</div></div>
          <div class="kpi"><div class="n">В норме</div><div class="v num">${inNorm}<small> из ${logged.length}</small></div></div>
          <div class="kpi"><div class="n">Соль</div><div class="v num">${logged.length ? dec(avgSalt) : '—'}<small> г</small></div></div>
        </div>
        <div class="chart"><svg viewBox="0 -4 ${W} ${H + (labels ? 28 : 6)}" role="img" aria-label="Калории по дням">
          <line x1="0" x2="${W}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="3 4"/>${bars}${labels}</svg></div>
      </div>
      <div class="caption">Пунктир — норма. Яркие столбики — день в норме, бледные — не добрал.</div>
    </section>
    <section class="sec"><div class="sec-h"><h2>Вес</h2></div>
      <div class="card">
        <div class="kpis">
          <div class="kpi"><div class="n">Сейчас</div><div class="v num">${ws.length ? dec(ws[ws.length - 1][1]) + '<small> кг</small>' : '—'}</div></div>
          <div class="kpi" style="grid-column: span 2"><div class="n">Темп</div><div class="v num">${trend}</div></div>
        </div>${spark}
      </div>
      <div class="caption">Для роста — плюс 0,5–0,8 кг в месяц. Взвешивайся утром натощак.</div>
      <div class="list" style="margin-top:14px"><button class="cell" id="addW"><span class="t"><div class="n">Записать вес</div></span>${I.chev}</button>
        ${ws.slice(-6).reverse().map(([d, w]) => `<div class="cell"><span class="t"><div class="n">${dateTitle(d)}</div></span><span class="k num">${dec(w)} кг</span></div>`).join('')}</div>
    </section>
  </div>`;
  placeThumb();
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (b && +b.dataset.r !== histRange) { histRange = +b.dataset.r; buzz(); renderHistory(); } };
  $('#addW').onclick = openWeight;
}

/* ——— листы ——— */
let onSheetClose = null;
function openSheet(title, html, after, opts = {}) {
  const sh = $('#sheet'), sc = $('#scrim'), body = $('#sheetBody');
  $('#sheetTitle').textContent = title;
  $('#sheetBack').innerHTML = opts.back ? `<button class="back" id="backBtn">${I.back}Назад</button>` : '';
  if (opts.back) $('#backBtn').onclick = opts.back;
  $('#sheetClose').textContent = opts.closeText || 'Готово';
  sh.classList.toggle('short', !!opts.short);
  body.innerHTML = html; body.scrollTop = 0;
  body.classList.remove('slide'); if (opts.slide) { void body.offsetWidth; body.classList.add('slide'); }
  if (sh.hidden) {
    sh.hidden = sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('on'); sc.classList.add('on'); }));
  } else { sh.classList.add('on'); sc.classList.add('on'); } // открыли снова, пока прошлый лист уезжал
  after && after(body);
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  if (sh.hidden) return;
  sh.style.transform = '';
  sh.classList.remove('on'); sc.classList.remove('on');
  setTimeout(() => { if (!sh.classList.contains('on')) sh.hidden = sc.hidden = true; }, 500);
  if (document.activeElement) document.activeElement.blur();
  photoReq && photoReq.abort(); photoReq = null;
  const f = onSheetClose; onSheetClose = null; f && f();
}
$('#scrim').onclick = closeSheet;
$('#sheetClose').onclick = closeSheet;
(() => { // лист тянется вниз пальцем
  const sh = $('#sheet'), head = sh.querySelector('.head'); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; });
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

const toFood = ([name, kcal, p, f, c, salt, u]) => ({ name, kcal, p, f, c, salt, unit: u ? { name: u.split('=')[0], g: +u.split('=')[1] } : null });
const FOODS = BASE.map(toFood), DISH = DISHES.map(f => ({ ...toFood(f), dish: true }));
const macroLine = f => `${fmt(f.kcal)} ккал · Б ${dec(f.p)} · Ж ${dec(f.f)} · У ${dec(f.c)}`;
const mealName = m => MEALS.find(x => x[0] === m)[1];

function openAdd(meal) {
  let m = meal || mealNow(), q = '';
  const draw = () => {
    const s = norm(q.trim()), all = S.custom.map(x => ({ ...x, custom: true })).concat(DISH, FOODS);
    let html = '';
    const row = (f, key, sub) => `<button class="cell" data-k="${key}"><span class="t"><div class="n">${esc(f.name)}${f.dish ? ' <span style="color:var(--text-3)">≈</span>' : ''}</div>
      <div class="m num">${sub || macroLine(f) + ' на 100 г'}</div></span>${I.chev}</button>`;
    const pool = {};
    if (!s) {
      const rec = S.recent.slice(0, 6);
      if (rec.length) { html += `<div class="group-t">Недавние</div><div class="list">${rec.map((f, i) => { pool['r' + i] = f; return row(f, 'r' + i, f.g ? `${fmt(f.g)} г · ${fmt(f.kcal * f.g / 100)} ккал` : `${fmt(f.kcal)} ккал`); }).join('')}</div>`; }
      if (S.custom.length) html += `<div class="group-t">Мои продукты</div><div class="list">${S.custom.map((f, i) => { pool['m' + i] = f; return row(f, 'm' + i); }).join('')}</div>`;
      html += `<div class="group-t">Популярные блюда</div><div class="list">${DISH.map((f, i) => { pool['d' + i] = f; return row(f, 'd' + i); }).join('')}</div>`;
      html += `<div class="group-t">Продукты</div><div class="list">${FOODS.map((f, i) => { pool['b' + i] = f; return row(f, 'b' + i); }).join('')}</div>`;
      html += `<div class="foot">≈ — готовое блюдо, калорийность зависит от рецепта.</div>`;
    } else {
      const words = s.split(/[\s,()]+/).filter(Boolean); // «рис сух» найдёт «Рис белый (сухой)»
      const hit = all.map(f => ({ f, n: norm(f.name) })).filter(x => words.every(w => x.n.includes(w)))
        .sort((a, b) => (b.n.startsWith(words[0]) - a.n.startsWith(words[0])) || a.n.localeCompare(b.n));
      html = hit.length ? `<div class="list" style="margin-top:14px">${hit.map((x, i) => { pool['s' + i] = x.f; return row(x.f, 's' + i); }).join('')}</div>`
        : `<div class="lead" style="margin-top:30px">Такого нет в базе.<br>Сфотографируй еду или добавь свой продукт.</div>`;
    }
    html += `<div class="list" style="margin-top:22px"><button class="cell" id="own"><span class="t"><div class="n">Свой продукт</div><div class="m">Цифры с этикетки</div></span>${I.chev}</button>
      <button class="cell" id="quick"><span class="t"><div class="n">Только калории</div><div class="m">Когда состав неизвестен</div></span>${I.chev}</button></div>`;
    const res = $('#results'); res.innerHTML = html;
    res.onclick = e => {
      const b = e.target.closest('[data-k]');
      if (b) { const f = pool[b.dataset.k]; if (b.dataset.k[0] === 'r' && !f.g) addItem(m, { name: f.name, g: 0, kcal: f.kcal, p: f.p, f: f.f, c: f.c, salt: f.salt || 0 }); else openPortion(f, m, null, b.dataset.k[0] === 'r' ? f.g : 0, () => openAdd(m)); }
      else if (e.target.closest('#own')) openCustom(m);
      else if (e.target.closest('#quick')) openQuick(m);
    };
  };
  const html = `<div class="search">${I.search}<input id="q" type="search" placeholder="Поиск" autocomplete="off" enterkeyhint="search" aria-label="Найти продукт"></div>
    <button class="photo-cta" id="photoCta">${I.cam}<span><b>Сфотографировать еду</b><span>Узнаю блюда и граммы по фото</span></span></button>
    <div class="seg meal" id="mseg"><span class="thumb"></span>${MEALS.map(([k, n]) => `<button data-m="${k}" aria-pressed="${k === m}">${n}</button>`).join('')}</div>
    <div id="results"></div>`;
  openSheet('Добавить', html, body => {
    const seg = $('#mseg', body), th = seg.querySelector('.thumb');
    const place = () => { const on = seg.querySelector('[aria-pressed="true"]'); th.style.width = on.offsetWidth + 'px'; th.style.transform = `translateX(${on.offsetLeft - 2}px)`; };
    requestAnimationFrame(place);
    seg.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; m = b.dataset.m; seg.querySelectorAll('[data-m]').forEach(c => c.setAttribute('aria-pressed', c === b)); place(); buzz(); };
    const inp = $('#q', body);
    inp.oninput = () => { q = inp.value; draw(); $('#photoCta', body).hidden = !!q.trim(); };
    $('#photoCta', body).onclick = () => photoFlow(m);
    draw();
  }, { closeText: 'Отмена' });
}

function openPortion(food, meal, item, grams, back) {
  let g = item ? item.g : grams || (food.unit ? food.unit.g : 100);
  const per = food.per100 || food;
  const units = [];
  if (food.unit) units.push([`${food.unit.name}`, food.unit.g]);
  for (const x of [50, 100, 150, 200, 300]) if (!food.unit || x !== food.unit.g) units.push([`${x} г`, x]);
  const html = `<div class="portion">
    <div class="title">${esc(food.name)}</div><div class="per num">${macroLine(per)}${per.salt ? ' · соль ' + dec(per.salt) : ''} на 100 г</div>
    <div class="grams"><button class="st" id="minus" aria-label="Меньше">${I.minus}</button>
      <span class="box"><input id="g" class="num" inputmode="decimal" value="${String(r1(g)).replace('.', ',')}" aria-label="Граммы"><span class="u">г</span></span>
      <button class="st" id="plus" aria-label="Больше">${I.plus}</button></div>
    <div class="chips" id="units">${units.map(([n, v]) => `<button class="chip" data-g="${v}">${n}</button>`).join('')}</div>
    <div class="facts num" id="res"></div>
    <button class="btn" id="ok">${item ? 'Сохранить' : 'Добавить в «' + mealName(meal) + '»'}</button>
    ${item ? `<button class="btn danger" id="del">Удалить</button>` : ''}
  </div>`;
  openSheet(item ? 'Изменить' : 'Порция', html, body => {
    const inp = $('#g', body), res = $('#res', body);
    const calc = () => {
      inp.style.width = Math.max(1.6, String(inp.value).length + 0.3) + 'ch';
      const k = num(inp.value) / 100;
      res.innerHTML = `<div><b>${fmt(per.kcal * k)}</b><span>ккал</span></div><div><b>${Math.round(per.p * k)}</b><span>белки</span></div>
        <div><b>${Math.round(per.f * k)}</b><span>жиры</span></div><div><b>${Math.round(per.c * k)}</b><span>углев.</span></div><div><b>${dec((per.salt || 0) * k)}</b><span>соль</span></div>`;
      body.querySelectorAll('[data-g]').forEach(c => c.classList.toggle('on', +c.dataset.g === num(inp.value)));
    };
    const set = v => { inp.value = String(Math.max(0, Math.round(v * 10) / 10)).replace('.', ','); calc(); buzz(); };
    calc();
    inp.oninput = calc;
    inp.onfocus = () => inp.select();
    $('#minus', body).onclick = () => set(num(inp.value) - (num(inp.value) > 10 ? 10 : 1));
    $('#plus', body).onclick = () => set(num(inp.value) + (num(inp.value) >= 10 ? 10 : 1));
    $('#units', body).onclick = e => { const b = e.target.closest('[data-g]'); if (b) set(+b.dataset.g); };
    $('#ok', body).onclick = () => {
      const gr = num(inp.value);
      if (gr <= 0) { toast('Укажи граммы'); inp.focus(); return; }
      const k = gr / 100;
      const data = { name: food.name, g: gr, kcal: per.kcal * k, p: per.p * k, f: per.f * k, c: per.c * k, salt: (per.salt || 0) * k,
        per100: { kcal: per.kcal, p: per.p, f: per.f, c: per.c, salt: per.salt || 0 }, unit: food.unit || null };
      if (item) { Object.assign(item, data); save(); closeSheet(); renderToday(false); toast('Сохранено'); }
      else addItem(meal, data);
    };
    if (item) $('#del', body).onclick = () => deleteItem(item);
  }, { back, slide: !!back, closeText: 'Отмена' });
}

function addItem(meal, data, many) {
  const d = S.days[cur] = day(cur);
  const it = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), meal }, data);
  d.items.push(it); lastAdded = it.id;
  const per = data.per100 || { kcal: data.kcal, p: data.p, f: data.f, c: data.c, salt: data.salt || 0 };
  S.recent = [{ name: data.name, g: data.g || 0, unit: data.unit || null, ...per }].concat(S.recent.filter(r => r.name !== data.name)).slice(0, 20);
  save();
  if (many) return;
  buzz(); closeSheet(); renderToday(false);
  toast(`${data.name.length > 22 ? data.name.slice(0, 21) + '…' : data.name} · ${fmt(data.kcal)} ккал`);
}
function deleteItem(item) {
  if (!item) return;
  const d = day(cur), i = d.items.indexOf(item);
  d.items.splice(i, 1); save(); closeSheet(); renderToday(false); buzz();
  toast('Удалено', 'Вернуть', () => { d.items.splice(i, 0, item); S.days[cur] = d; save(); renderToday(false); });
}
function openItem(id) {
  const it = day(cur).items.find(i => i.id === id); if (!it) return;
  if (it.per100) openPortion({ name: it.name, per100: it.per100, unit: it.unit }, it.meal, it);
  else openQuick(it.meal, it);
}

    : `<div class="cell field"><label for="${id}">${label}</label><input id="${id}" inputmode="decimal" placeholder="${ph}" value="${val}"></div>`).join('')}</div>`;
}

/* ——— еда по фото: распознаёт Тренер на сервере ——— */
let photoReq = null;
function photoFlow(meal) {
  if (!getToken()) return openPair(() => readySheet(meal));
  pickPhoto(meal);
}
function readySheet(meal) { // выбор файла можно открыть только по нажатию — после подключения нужна кнопка
  openSheet('Еда по фото', `<div class="hero-ico">${I.cam}</div><div class="portion"><div class="title">Готово</div></div>
    <div class="lead">Сфотографируй тарелку целиком, сверху или чуть сбоку. Если рядом вилка или ложка — граммы точнее.</div>
    <div style="margin-top:24px"><button class="btn" id="pick">${I.cam}Снять или выбрать фото</button></div>`,
    body => { $('#pick', body).onclick = () => pickPhoto(meal); }, { short: true, closeText: 'Отмена' });
}
function pickPhoto(meal) {
  const inp = $('#photoInput');
  inp.value = '';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    let url;
    try { url = await shrink(file); } catch (e) { toast('Не получилось открыть фото'); return; }
    recognize(url, meal);
  };
  inp.click();
}
function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(src); ok(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(src); fail(); };
    img.src = src;
  });
}
async function recognize(url, meal) {
  openSheet('Фото', `<div class="shot"><img src="${url}" alt=""><div class="scan"></div></div>
    <div class="thinking"><b>Смотрю, что на тарелке</b>Определяю блюда и граммы — обычно до минуты<div class="dots"><i></i><i></i><i></i></div></div>`, null, { closeText: 'Отмена' });
  const ctl = new AbortController(); photoReq = ctl;
  const timer = setTimeout(() => ctl.abort(), 150000);
  try {
    const r = await fetch(API + '/api/kcal/photo', { method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() }, body: JSON.stringify({ image: url }) });
    const j = await r.json().catch(() => ({}));
    if (photoReq !== ctl) return;
    if (r.status === 401) { setToken(''); return openPair(() => recognize(url, meal)); }
    if (!r.ok) throw new Error(j.error || 'Не получилось распознать');
    const items = (j.items || []).filter(i => i && i.name && i.g > 0);
    if (!items.length) throw new Error('Не нашёл на фото еду');
    showFound(url, items, j.comment || '', meal);
  } catch (e) {
    if (photoReq !== ctl) return;
    const msg = e.name === 'AbortError' ? 'Слишком долго — попробуй ещё раз' : e.message === 'Failed to fetch' ? 'Нет связи с сервером' : e.message;
    openSheet('Фото', `<div class="shot"><img src="${url}" alt=""></div><div class="thinking"><b>${esc(msg)}</b>Можно снять ещё раз или найти блюдо поиском.</div>
      <div style="margin-top:24px"><button class="btn" id="again">Снять ещё раз</button><button class="btn soft" id="bySearch">Найти поиском</button></div>`, body => {
      $('#again', body).onclick = () => pickPhoto(meal);
      $('#bySearch', body).onclick = () => openAdd(meal);
    }, { closeText: 'Закрыть' });
  } finally { clearTimeout(timer); if (photoReq === ctl) photoReq = null; }
}
function showFound(url, items, comment, meal) {
  let m = meal;
  const rows = items.map(i => {
    const g0 = Math.max(1, num(i.g)), k = 100 / g0;
    return { name: String(i.name).slice(0, 60), g: Math.round(g0), on: true,
      per: { kcal: num(i.kcal) * k, p: num(i.p) * k, f: num(i.f) * k, c: num(i.c) * k, salt: num(i.salt) * k } };
  });
  const tot = () => rows.filter(r => r.on).reduce((a, r) => { const k = r.g / 100; a.kcal += r.per.kcal * k; a.salt += r.per.salt * k; return a; }, { kcal: 0, salt: 0 });
  const html = `<div class="shot" style="height:170px"><img src="${url}" alt=""></div>
    ${comment ? `<div class="comment">${esc(comment)}</div>` : ''}
    <div class="group-t">Нашёл на фото — поправь граммы</div>
    <div class="list" id="found">${rows.map((r, i) => `<div class="cell pi on" data-i="${i}"><button class="check" data-tog="${i}" aria-label="Учитывать">${I.check}</button>
      <span class="t"><div class="n">${esc(r.name)}</div><div class="m num" id="pm${i}"></div></span>
      <span class="mini"><button data-d="-10" aria-label="Меньше">${I.minus}</button><span class="g num" id="pg${i}"></span><button data-d="10" aria-label="Больше">${I.plus}</button></span></div>`).join('')}</div>
    <div class="seg meal" id="mseg" style="margin-top:20px"><span class="thumb"></span>${MEALS.map(([k, n]) => `<button data-m="${k}" aria-pressed="${k === m}">${n}</button>`).join('')}</div>
    <div class="sum-line num" id="sum"></div>
    <button class="btn" id="addAll"></button>
    <div class="foot" style="text-align:center;margin-top:12px">Граммы по фото — оценка. Если знаешь точно, поправь.</div>`;
  openSheet('Фото', html, body => {
    const upd = () => {
      rows.forEach((r, i) => {
        const k = r.g / 100;
        $('#pg' + i, body).textContent = r.g + ' г';
        $('#pm' + i, body).textContent = `${fmt(r.per.kcal * k)} ккал · Б ${Math.round(r.per.p * k)} · Ж ${Math.round(r.per.f * k)} · У ${Math.round(r.per.c * k)}`;
        body.querySelector(`[data-i="${i}"]`).classList.toggle('on', r.on);
      });
      const t = tot(), n = rows.filter(r => r.on).length;
      $('#sum', body).innerHTML = `<span>Всего</span><span><b>${fmt(t.kcal)} ккал</b> · соль ${dec(t.salt)} г</span>`;
      const b = $('#addAll', body); b.textContent = n ? `Добавить в «${mealName(m)}»` : 'Ничего не выбрано'; b.disabled = !n;
    };
    upd();
    $('#found', body).onclick = e => {
      const row = e.target.closest('[data-i]'); if (!row) return; const r = rows[+row.dataset.i];
      const d = e.target.closest('[data-d]');
      if (d) { r.g = Math.max(5, r.g + +d.dataset.d); r.on = true; }
      else if (e.target.closest('[data-tog]') || e.target.closest('.t')) r.on = !r.on;
      buzz(); upd();
    };
    const seg = $('#mseg', body), th = seg.querySelector('.thumb');
    const place = () => { const on = seg.querySelector('[aria-pressed="true"]'); th.style.width = on.offsetWidth + 'px'; th.style.transform = `translateX(${on.offsetLeft - 2}px)`; };
    requestAnimationFrame(place);
    seg.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; m = b.dataset.m; seg.querySelectorAll('[data-m]').forEach(c => c.setAttribute('aria-pressed', c === b)); place(); upd(); buzz(); };
    $('#addAll', body).onclick = () => {
      const sel = rows.filter(r => r.on); let kcal = 0;
      for (const r of sel) {
        const k = r.g / 100; kcal += r.per.kcal * k;
        addItem(m, { name: r.name, g: r.g, kcal: r.per.kcal * k, p: r.per.p * k, f: r.per.f * k, c: r.per.c * k, salt: r.per.salt * k, per100: r.per, unit: null }, true);
      }
      buzz(); closeSheet(); renderToday(false);
      toast(`Добавлено ${sel.length} ${plural(sel.length, 'блюдо', 'блюда', 'блюд')} · ${fmt(kcal)} ккал`);
    };
  }, { closeText: 'Отмена' });
}
function openPair(then) {
  const html = `<div class="hero-ico">${I.cam}</div>
    <div class="portion"><div class="title">Еда по фото</div></div>
    <div class="lead">Фото разбирает твой Тренер. Напиши ему <b>/site</b> в Telegram — он пришлёт код из 6 цифр.</div>

        const j = await r.json().catch(() => ({}));

}

let toastT;
function toast(text, action, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>`;
  t.style.pointerEvents = 'none';
  if (action) {
    const b = document.createElement('button'); b.textContent = action;
    b.onclick = () => { fn(); t.classList.remove('on'); };
    t.appendChild(b); t.style.pointerEvents = 'auto';
  }
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 4000 : 2000);
}

function render() {
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.dataset.tab === view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  window.scrollTo(0, 0); document.body.classList.remove('scrolled');
  view === 'today' ? renderToday(true) : renderHistory();
}
document.querySelectorAll('.tab[data-tab]').forEach(t => t.onclick = () => {
  if (view !== t.dataset.tab) { view = t.dataset.tab; buzz(); render(); } else window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('#addTab').onclick = () => { if (view !== 'today') { view = 'today'; render(); } buzz(); openAdd(); };
$('#todayBtn').onclick = () => { cur = today(); shown.left = shown.pct = null; buzz(); renderToday(true); };
addEventListener('resize', placeThumb);
let onToday = true;
document.addEventListener('visibilitychange', () => { // открыли на следующий день — показать новый день
  if (document.hidden) { onToday = cur === today(); return; }
  if (onToday && cur !== today() && view === 'today' && !$('#sheet').classList.contains('on')) { cur = today(); shown.left = shown.pct = null; renderToday(true); }
});
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
