<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Калории</title>
<script>/* ?embed=1 — внутри Формы (вкладка «Питание»), ?theme=dark|light — тема Формы; до первой отрисовки, без вспышки */
(function () { try { var q = new URLSearchParams(location.search), h = document.documentElement, t = q.get('theme');
  if (q.get('embed') === '1') { h.classList.add('embed'); if (!location.hostname.endsWith('github.io')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = '/fonts.css'; document.head.appendChild(l); } }
  if (t === 'dark' || t === 'light') h.setAttribute('data-theme', t); } catch (e) {} })();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Вид — Liquid Glass iOS 26: стекло только у навигации и кнопок поверх контента (меню, кнопки, листы, тосты);
   стекло матовое, с тёмным краем и ярким бликом сверху. Контент — непрозрачный.
   Цвета — только чёрный, белый и серые (Глеб 01.11); цвет — точечно, где без него теряется смысл (соль сверх нормы, зона восстановления). */
:root {
  --bg: #000000;
  --group: #1c1c1e;
  --sheet: #1c1c1e;
  --sheet-group: #2c2c2e;
  --fill: rgba(120,120,128,.24);
  --fill-2: rgba(120,120,128,.36);
  --sep: rgba(84,84,88,.6);
  --text: #ffffff;
  --text-2: rgba(235,235,245,.6);
  --text-3: rgba(235,235,245,.3);
  --ink: #ffffff;
  --on-ink: #000000;
  --track: rgba(255,255,255,.11);
  --p: #ffffff;
  --f: #d1d1d6;
  --c: #98989d;
  --s: #636366;
  --wtr: #ffffff;
  --warn: #ffffff;
  --bad: #ff453a;
  --glass: rgba(44,44,48,.58);
  --glass-strong: rgba(36,36,40,.78);
  --glass-solid: #2c2c2e;
  --rim: rgba(255,255,255,.2);
  --spec: rgba(255,255,255,.42);
  --edge: rgba(0,0,0,.6);
  --lens: rgba(255,255,255,.13);
  --drop: 0 10px 32px rgba(0,0,0,.42);
  --ios: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.4,0,.2,1); /* плавный разгон и торможение, без перелёта и без скачка в первом кадре (Глеб 29.10: дёргано) */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
/* светлая тема: по системе или явно (?theme=light / сообщение Формы); data-theme="dark" — тёмная при светлой системе */
:root[data-theme="light"] {
    --bg: #ffffff; --group: #f2f2f7; --sheet: #ffffff; --sheet-group: #f2f2f7;
    --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.2); --sep: rgba(60,60,67,.2);
    --text: #000000; --text-2: rgba(60,60,67,.6); --text-3: rgba(60,60,67,.3);
    --ink: #000000; --on-ink: #ffffff; --track: rgba(0,0,0,.07);
    --p: #000000; --f: #48484a; --c: #8e8e93; --s: #aeaeb2; --wtr: #000000; --warn: #000000; --bad: #ff3b30;
    --glass: rgba(255,255,255,.62); --glass-strong: rgba(250,250,252,.84); --glass-solid: #ffffff;
    --rim: rgba(255,255,255,.95); --spec: rgba(255,255,255,1); --edge: rgba(0,0,0,.14); --lens: rgba(0,0,0,.07);
    --drop: 0 10px 30px rgba(0,0,0,.13);
    color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --group: #f2f2f7; --sheet: #ffffff; --sheet-group: #f2f2f7;
    --fill: rgba(118,118,128,.12); --fill-2: rgba(118,118,128,.2); --sep: rgba(60,60,67,.2);
    --text: #000000; --text-2: rgba(60,60,67,.6); --text-3: rgba(60,60,67,.3);
    --ink: #000000; --on-ink: #ffffff; --track: rgba(0,0,0,.07);
    --p: #000000; --f: #48484a; --c: #8e8e93; --s: #aeaeb2; --wtr: #000000; --warn: #000000; --bad: #ff3b30;
    --glass: rgba(255,255,255,.62); --glass-strong: rgba(250,250,252,.84); --glass-solid: #ffffff;
    --rim: rgba(255,255,255,.95); --spec: rgba(255,255,255,1); --edge: rgba(0,0,0,.14); --lens: rgba(0,0,0,.07);
    --drop: 0 10px 30px rgba(0,0,0,.13);
    color-scheme: light;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
/* внутри Формы — шрифт Формы (SF Pro на iPhone, Inter с её домена на Windows/Android), чтобы был один сайт */
html.embed body, html.embed input, html.embed button, html.embed textarea { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", sans-serif; }
body {
  font: 17px/1.35 ui-rounded, "SF Pro Rounded", Nunito, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; /* мягкий круглый шрифт: на iPhone — SF Pro Rounded */
  letter-spacing: -.2px; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh; -webkit-user-select: none; user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; }
svg { display: block; }

/* стекло */
.glass { position: relative; isolation: isolate; background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); will-change: transform;
  box-shadow: 0 0 0 .5px var(--edge), inset 0 0 0 .5px var(--rim), inset 0 1.2px 0 var(--spec), var(--drop); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(130% 70% at 25% -10%, rgba(255,255,255,.22), transparent 55%), linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%); }
:root[data-theme="light"] .glass::before { background: radial-gradient(130% 70% at 25% -10%, rgba(255,255,255,.7), transparent 60%); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .glass::before { background: radial-gradient(130% 70% at 25% -10%, rgba(255,255,255,.7), transparent 60%); } }
@media (prefers-reduced-transparency: reduce) {
  .glass, .sheet.short, .edge-top, .edge-bottom { background: var(--glass-solid) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
.press { transition: transform .35s var(--spring), opacity .2s; }
.press:active { transform: scale(.93); }
/* нажатие — быстро (.12 с), отпускание — плавно (обычная длительность) */
.press:active, .fab:active, .btn:active, .chip:active, .photo-cta:active, .days button:active, .mini button:active, .pi .check:active, .tab:active svg { transition-duration: .12s; }

.app { max-width: 540px; margin: 0 auto; padding: calc(8px + var(--safe-t)) max(16px, env(safe-area-inset-right)) calc(120px + var(--safe-b)) max(16px, env(safe-area-inset-left)); }

/* верх: при прокрутке — мягкая полоса цвета фона, маленький заголовок */
.edge-top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: calc(56px + var(--safe-t)); pointer-events: none;
  background: linear-gradient(var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 60%, transparent);
  -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent);
  opacity: 0; transition: opacity .25s; }
.nav-t { position: fixed; z-index: 31; top: calc(var(--safe-t) + 14px); left: 50%; transform: translate(-50%, 4px); font-size: 17px; font-weight: 600;
  opacity: 0; transition: opacity .2s, transform .3s var(--ios); pointer-events: none; }
body.scrolled .edge-top { opacity: 1; } /* без размытия: включение размытия посреди прокрутки давало рывок на iPhone */
body.scrolled .nav-t { opacity: 1; transform: translate(-50%, 0); }
.edge-bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 19; height: calc(96px + var(--safe-b)); pointer-events: none;
  background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 75%, transparent)); } /* без размытия: на прокрутке оно самое дорогое */

.actions { position: fixed; z-index: 32; top: calc(6px + var(--safe-t)); right: max(16px, calc(50% - 254px)); display: flex; border-radius: 22px; }
.actions:empty { display: none; }
.ibtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--text); }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { background: var(--lens); }
.today-btn { position: fixed; z-index: 32; top: calc(6px + var(--safe-t)); left: max(16px, calc(50% - 254px)); height: 44px; padding: 0 16px; border-radius: 22px;
  font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.today-btn svg { width: 9px; height: 15px; }

.large { margin: 52px 0 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.9px; }
.subtitle { margin-top: 2px; color: var(--text-2); font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.streak { display: inline-flex; align-items: center; gap: 3px; color: var(--warn); font-weight: 600; }
.streak svg { width: 13px; height: 13px; }

/* неделя: маленькие кольца */
.week { display: grid; grid-template-columns: repeat(7, 1fr); margin: 18px -4px 0; touch-action: pan-y; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 8px; border-radius: 20px; transition: background .25s; }
.wd .l { font-size: 12px; color: var(--text-2); font-weight: 500; }
.wd svg { width: 32px; height: 32px; }
.wd[aria-current="date"] { background: var(--group); }
.wd[aria-current="date"] .l { color: var(--text); font-weight: 600; }
.wd[disabled] { opacity: .3; pointer-events: none; }
.wd .l::after { content: ""; display: block; width: 4px; height: 4px; border-radius: 2px; margin: 2px auto 0; }
.wd.today .l::after { background: var(--bad); }

/* сегменты: капсула, «линза» переезжает с пружиной */
.seg { position: relative; display: flex; background: var(--fill); border-radius: 999px; padding: 3px; margin-top: 18px; }
.seg button { flex: 1; position: relative; z-index: 1; height: 36px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--text); }
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--fill-2);
  box-shadow: inset 0 1px 0 var(--spec), 0 0 0 .5px var(--edge), 0 3px 10px rgba(0,0,0,.12); transition: transform .55s var(--spring), width .45s var(--spring); }
:root[data-theme="light"] .seg .thumb { background: #fff; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .seg .thumb { background: #fff; } }
.seg .thumb.squish { animation: squish .45s var(--ios); }
@keyframes squish { 40% { scale: 1.05 .96; } }

/* кольцо */
.ring-wrap { position: relative; width: min(62vw, 236px); aspect-ratio: 1; margin: 22px auto 0; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-wrap .arc { transition: stroke-dashoffset 1s var(--ios); }
.ring-wrap.done .arc { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ink) 35%, transparent)); }
.ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-in .big { font-size: 50px; line-height: 1; font-weight: 600; letter-spacing: -2.2px; }
.ring-in .cap { margin-top: 6px; font-size: 15px; color: var(--text-2); }
.ring-in .of { margin-top: 10px; font-size: 13px; color: var(--text-3); }
.ring-in .big.over { color: var(--warn); }

.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 2px 0; }
.metric .n { font-size: 13px; color: var(--text-2); }
.metric .v { margin-top: 1px; font-size: 19px; font-weight: 600; letter-spacing: -.5px; white-space: nowrap; }
.metric .v small { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
@media (max-width: 370px) { /* узкие экраны (iPhone SE, 320 px): БЖУ и соль влезают в строку */
  .metrics { gap: 8px; } .metric .v { font-size: 16px; letter-spacing: -.4px; } .metric .v small { font-size: 11px; } .metric .n { font-size: 12px; }
  .ring-in .big { font-size: 44px; } .large { font-size: 31px; } .tabbar .tabs { --tw: 66px; } .tabbar .fab { width: 54px; height: 54px; } .tabbar .in { padding: 0 14px; } /* специфичнее общих правил ниже */ }
.wcard { padding: 16px; }
.wbar { position: relative; height: 44px; border-radius: 22px; background: var(--track); overflow: hidden; }
.wbar i { position: absolute; inset: 0 auto 0 0; border-radius: 22px; background: linear-gradient(90deg, color-mix(in srgb, var(--wtr) 75%, transparent), var(--wtr)); transition: width .9s var(--spring); }
.wbar span { position: relative; display: flex; align-items: center; height: 100%; padding: 0 16px; font-size: 15px; font-weight: 600; color: #fff; mix-blend-mode: difference; }
.wbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.wb { height: 58px; border-radius: 20px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.wb b { font-size: 17px; font-weight: 700; color: var(--text); }
.wb span { font-size: 11px; color: var(--text-2); }
.wb svg { width: 18px; height: 18px; color: var(--text-2); }
.wb[disabled] { opacity: .35; pointer-events: none; }
.metric .b { height: 4px; border-radius: 2px; background: var(--track); margin-top: 8px; overflow: hidden; }
.metric .b i { display: block; height: 100%; border-radius: 2px; background: var(--dot); transform-origin: left; transition: transform .9s var(--ios), background .3s; }

/* «Форма»: восстановление, сон, нагрузка, тренировка, режим — из бота-тренера */
.fcard { margin-top: 18px; padding: 16px 18px; }
.fcard.fin { animation: fadeUp .5s var(--ios); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
.frow { display: flex; align-items: center; gap: 16px; }
.fring { position: relative; width: 66px; height: 66px; flex: none; }
.fring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.fring .arc { transition: stroke-dashoffset 1s var(--ios); }
.fring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.fring b { font-size: 20px; line-height: 1; font-weight: 700; letter-spacing: -.6px; }
.zdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.fstats { flex: 1; min-width: 0; display: grid; grid-template-columns: 1.3fr 1fr; gap: 6px 12px; }
.fhd { grid-column: 1 / -1; font-size: 15px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fhd b { color: var(--text); font-weight: 600; }
.fst .n { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fst .v { margin-top: 1px; font-size: 19px; font-weight: 600; letter-spacing: -.5px; white-space: nowrap; }
.fst .v small { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.fline { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: .5px solid var(--sep); font-size: 15px; color: var(--text-2); }
.fline + .fline { margin-top: 0; padding-top: 10px; border-top: 0; }
.fline svg { width: 18px; height: 18px; flex: none; color: var(--text-2); }
.fline .t { flex: 1; min-width: 0; line-height: 1.3; } /* на узком экране — в две строки, без обрезки */
.fline b { color: var(--text); font-weight: 600; }
.fline .r { color: var(--text-2); font-variant-numeric: tabular-nums; }
.wfoot { margin: 8px 6px 0; font-size: 13px; color: var(--text-2); }
.cell.ro { min-height: 52px; }
@media (max-width: 370px) { .fring { width: 58px; height: 58px; } .fring b { font-size: 18px; } .fst .v { font-size: 16px; } .fstats { gap: 4px 8px; } }

/* списки (контент — без стекла) */
.sec { margin-top: 30px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px 8px; }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
.sec-h span { font-size: 15px; color: var(--text-2); }
.list { background: var(--group); border-radius: 26px; overflow: hidden; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; text-align: left; padding: 10px 18px; background: var(--group); }
.cell + .cell::before, .swipe + .swipe .cell::before, .swipe + .cell::before { content: ""; position: absolute; top: 0; left: 18px; right: 0; border-top: .5px solid var(--sep); }
button.cell { transition: background .15s; }
button.cell:active { background: var(--fill); }
.cell .t { flex: 1; min-width: 0; }
.cell .n { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .m { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .k { font-size: 17px; color: var(--text-2); }
.cell .chev { width: 8px; height: 13px; color: var(--text-3); flex: none; }
.cell.add { font-weight: 500; min-height: 50px; gap: 10px; }
.cell.add svg { width: 20px; height: 20px; color: var(--text-2); }
.cell.add .ph { margin-left: auto; width: 36px; height: 36px; margin-right: -8px; border-radius: 18px; display: grid; place-items: center; color: var(--text-2); }
.cell.add .ph:active { background: var(--fill); }
.swipe { position: relative; overflow: hidden; }
.swipe .del { opacity: 0; transition: opacity .2s; position: absolute; top: 0; right: 0; bottom: 0; width: 88px; background: var(--bad); color: #fff; font-weight: 600; font-size: 15px; display: grid; place-items: center; }
.swipe .cell { transition: transform .45s var(--spring); will-change: transform; }
.swipe.sw .del { opacity: 1; }
.item-in { animation: itemIn .5s var(--ios); }
@keyframes itemIn { from { opacity: 0; transform: translateY(-8px); } }

/* нижнее меню — плавающее стекло: вкладки в капсуле, «+» отдельным кругом; размер не меняется (Глеб 29.10: сжатие при прокрутке дёргалось) */
.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: max(10px, calc(var(--safe-b) - 12px)); pointer-events: none; }
.tabbar .in { max-width: 540px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { --tw: 84px; flex: none; pointer-events: auto; display: flex; position: relative; padding: 4px; border-radius: 999px; transition: padding .4s var(--spring); }
/* «линза» стоит по номеру вкладки (--i) и ширине вкладки (--tw) из CSS — едет вместе с вкладками, без замеров в JS и рывка в конце */
.tabs .lens { position: absolute; top: 4px; bottom: 4px; left: 4px; width: var(--tw); border-radius: 999px; background: var(--lens);
  transform: translateX(calc(var(--i, 0) * var(--tw))); will-change: transform; transition: transform .38s var(--spring); }
.tab { position: relative; z-index: 1; width: var(--tw); height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-size: 11px; font-weight: 600; color: var(--text); transition: color .25s ease; }
.tab:not([aria-current]) { color: var(--text-2); }
.tab svg { width: 26px; height: 26px; transition: transform .35s var(--spring); }
.tab:active svg { transform: scale(.9); }
.fab { flex: none; pointer-events: auto; width: 62px; height: 62px; border-radius: 31px; display: grid; place-items: center; color: var(--text); transition: transform .35s var(--spring); }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(.92); }

body.kb .tabbar, body.kb .edge-bottom { opacity: 0; pointer-events: none; }
.view.enter { animation: appear .24s ease-out; }
#actions.enter { animation: appear .24s ease-out; }
@keyframes appear { from { opacity: 0; } }
.view.swap .card { animation: fadeIn .3s var(--ios); }
.ghost { position: fixed; left: 0; right: 0; z-index: 5; pointer-events: none; animation: ghostOut .22s ease-out forwards; }
@keyframes ghostOut { to { opacity: 0; } }
.today-btn:not([hidden]) { animation: appear .22s ease-out; } /* Неделя ↔ Месяц: графики меняются мягко */
@keyframes fadeIn { from { opacity: .35; } }
.sheet .list { content-visibility: auto; contain-intrinsic-size: auto 560px; } /* длинные списки в листе рисуются по мере прокрутки */
.app .list, .card { contain: layout paint; }
button, .cell { -webkit-touch-callout: none; }

/* история */
.card { background: var(--group); border-radius: 26px; padding: 18px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi .n { font-size: 13px; color: var(--text-2); }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.8px; }
.kpi .v small { font-size: 14px; color: var(--text-2); font-weight: 500; letter-spacing: 0; }
.chart { margin-top: 16px; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.caption { margin: 8px 6px 0; font-size: 13px; color: var(--text-2); }

/* кнопки — капсулы */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 999px; background: var(--ink); color: var(--on-ink);
  font-size: 17px; font-weight: 600; transition: transform .4s var(--spring), opacity .2s; }
.btn:active { transform: scale(.96); }

.btn svg { width: 20px; height: 20px; }

/* листы: высокий — непрозрачный; низкий — стеклянный, отступает от краёв экрана */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); opacity: 0; transition: opacity .4s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; height: calc(100dvh - 10px - var(--safe-t));
  display: flex; flex-direction: column; background: var(--sheet); border-radius: 38px 38px 0 0; transform: translateY(104%);
  box-shadow: 0 -0.5px 0 var(--rim), 0 -10px 40px rgba(0,0,0,.25); transition: transform .55s var(--ios); }
.sheet .list, .sheet .card { background: var(--sheet-group); }
.sheet .cell { background: var(--sheet-group); }
.sheet.short { height: auto; max-height: calc(100dvh - 24px - var(--safe-t)); left: 8px; right: 8px; bottom: calc(max(8px, calc(var(--safe-b) - 8px)) + var(--kb, 0px)); transition: transform .55s var(--ios), bottom .25s var(--ios);
  border-radius: 40px; background: var(--glass-strong); -webkit-backdrop-filter: blur(30px) saturate(1.9); backdrop-filter: blur(30px) saturate(1.9);
  box-shadow: 0 0 0 .5px var(--edge), inset 0 0 0 .5px var(--rim), inset 0 1.2px 0 var(--spec), var(--drop); transform: translateY(calc(100% + 40px)); }

.sheet .head { position: relative; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; height: 64px; padding: 6px 12px 0; touch-action: none; flex: none; }

/* понятные кнопки выхода (Глеб 01.11): «Назад» — капсула с подписью, крестик — заметный круг */
.hbtn.bk { width: auto; padding: 0 14px 0 9px; gap: 3px; display: inline-flex; align-items: center; font: 600 16px/1 inherit; font-weight: 600; letter-spacing: -.2px; justify-self: start; }

#sheetClose svg { width: 15px; height: 15px; }
.sheet .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px calc(24px + var(--safe-b)); }

/* быстрый завтрак: капсулы над списком «Завтрака» и в листе «Добавить» */
.qb { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }

.qchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 999px; background: var(--fill); font-size: 15px; font-weight: 500; white-space: nowrap;
  transition: transform .35s var(--spring), background .2s, color .2s; }
.qchip svg { width: 13px; height: 13px; margin-left: -3px; }

.qchip.on { background: var(--ink); color: var(--on-ink); }
/* «Часто» и закрепы: строки iOS — слева блюдо и обычная порция, справа круг «+» (одно нажатие); закреплённые — с булавкой */
.fav-t { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

.fa { flex: none; width: 36px; height: 36px; border-radius: 18px; background: var(--fill); display: grid; place-items: center; transition: transform .35s var(--spring), background .2s, color .2s; }

.fa.done { background: var(--ink); color: var(--on-ink); }
.held { animation: held .32s var(--ios); }
@keyframes held { 40% { transform: scale(.97); } }
.qb.fq { margin-top: -2px; }
.qchip .pinm { width: 11px; height: 11px; margin-left: -4px; color: inherit; } .qchip .pinm svg { width: 11px; height: 11px; }
.pinb { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; margin-top: 16px; border-radius: 999px; background: var(--fill); font-size: 14px; font-weight: 500; transition: transform .35s var(--spring), background .2s, color .2s; }
.pinb svg { width: 13px; height: 13px; }
.pinb[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.pinb:active { transform: scale(.94); transition-duration: .12s; }
.foot { margin: 7px 18px 0; font-size: 13px; color: var(--text-2); }

.search { position: relative; margin: 4px 0 0; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 999px; background: var(--fill); padding: 0 16px 0 40px; font-size: 17px; }
.search input::placeholder { color: var(--text-2); }

.photo-cta { display: flex; align-items: center; gap: 14px; width: 100%; margin-top: 12px; padding: 14px 20px; border-radius: 26px; background: var(--ink); color: var(--on-ink); text-align: left; transition: transform .4s var(--spring); }

.photo-cta b { display: block; font-size: 17px; font-weight: 600; }
.photo-cta span span { display: block; font-size: 13px; opacity: .6; } /* подпись тусклее, заголовок — в полную силу */
/* «Мои рецепты»: вторая кнопка — мягкая; запись — большой круг микрофона, пульс только transform/opacity */
.photo-cta.soft { margin-top: 8px; background: var(--fill); color: var(--text); }
.fav-t .lnk { height: 36px; margin: -12px -6px -10px 0; padding: 0 6px; font-size: 13px; font-weight: 600; color: var(--text); border-radius: 12px; }
.rec-rec { display: flex; flex-direction: column; align-items: center; margin-top: 14px; }
.mic { position: relative; isolation: isolate; width: 104px; height: 104px; border-radius: 52px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center;
  touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; transition: transform .4s var(--spring), opacity .25s; }
.mic svg { width: 42px; height: 42px; transition: opacity .25s; }
.mic::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--ink); opacity: 0; }
.mic.on { transform: scale(1.06); }
.mic.on::before { animation: micPulse 1.6s var(--ios) infinite; }
@keyframes micPulse { from { opacity: .3; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.mic:active { transform: scale(.94); transition-duration: .12s; }
.mic.busy { opacity: .4; }
.mic.busy::before { animation: none; }
@media (prefers-reduced-motion: reduce) { .mic.on::before { animation: none; opacity: .2; transform: scale(1.25); } }
.rec-st { min-height: 46px; margin: 16px 12px 0; text-align: center; color: var(--text-2); font-size: 15px; }

#recCancel { margin-top: 10px; }
#recText { display: block; width: 100%; min-height: 76px; padding: 4px 0; border: 0; background: none; resize: none; font-size: 17px; line-height: 1.35; }
#recText:focus { outline: none; }
#recText::placeholder, .rname::placeholder { color: var(--text-3); }
.rname { width: 100%; height: 40px; border: 0; background: none; font-size: 20px; font-weight: 600; letter-spacing: -.4px; }
.rname:focus { outline: none; }
.rec-said { margin: 12px 18px 0; font-size: 14px; color: var(--text-2); }
.rec-said span { display: block; margin-bottom: 1px; font-size: 12px; color: var(--text-3); }
/* «Надиктовать» и «Мой рецепт» — две мягкие кнопки в ряд под «Сфотографировать» */
.cta2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.cta2 .photo-cta.soft { margin-top: 0; min-height: 58px; padding: 10px 14px; gap: 10px; border-radius: 24px; }
.cta2 .photo-cta svg { width: 22px; height: 22px; }
.cta2 .photo-cta > span { min-width: 0; }

@media (max-width: 374px) { .cta2 .photo-cta.soft { padding: 10px 12px; } .cta2 .photo-cta svg { display: none; } } /* узкий телефон: подпись важнее значка */
/* предпросмотр «Надиктовать»: строки как у фото, кнопки для пальца ≥ 36 px; вода — переключатель */
.vsaid { margin-top: 6px; }
.vsaid .vmore { margin-top: 6px; }
.vnote { margin-top: 8px; }
/* «Понял так» — что разбор понял не дословно (оговорка, «греча» — гречка, 2 кг → 200 г), и «Поправить» (Глеб 06.11) */
.vfix { margin: 10px 18px 0; padding: 10px 14px; border-radius: 16px; background: var(--fill); font-size: 14px; line-height: 1.35; }
.vfix-t { display: block; margin-bottom: 3px; font-size: 12px; color: var(--text-3); }
.vfix-i { position: relative; padding-left: 13px; color: var(--text); }
.vfix-i + .vfix-i { margin-top: 2px; }
.vfix-i::before { content: ""; position: absolute; left: 1px; top: .58em; width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); }
.vact { margin: 10px 18px 2px; }
.vfixb { display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 12px; }
.vfixb svg { width: 17px; height: 17px; flex: none; }
.range .nw { white-space: nowrap; }
.vi .mini button { width: 36px; height: 36px; border-radius: 18px; }
.vi .mini .g { height: 36px; width: 50px; }
#vsum:empty { display: none; }
.wrow { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.wrow .wi { flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--fill); display: grid; place-items: center; transition: opacity .25s; }

.tg { position: relative; flex: none; width: 52px; height: 36px; }

@media (max-width: 359px) { .ing .mini button { display: none; } .ing .mini .g { background: var(--fill); height: 36px; } } /* iPhone SE 1-го поколения: граммы — числом, имени место */
.rtab { display: grid; grid-template-columns: minmax(78px, 1.5fr) repeat(5, 1fr); align-items: baseline; margin-top: 16px; padding: 10px 14px 12px; border-radius: 22px; background: var(--sheet-group); font-size: 15px; }

.field { display: flex; align-items: center; gap: 10px; }

/* фото */

  background-size: 100% 220%; animation: scan 1.8s var(--ios) infinite; mix-blend-mode: overlay; }

.thinking { text-align: center; margin-top: 22px; color: var(--text-2); font-size: 15px; }

.dots i { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--text-2); margin: 12px 3px 0; animation: dot 1.2s infinite; }

.comment { margin: 14px 6px 0; font-size: 15px; color: var(--text-2); }
.pi { gap: 10px; }

.mini { display: flex; align-items: center; gap: 4px; }

.hero-ico { width: 64px; height: 64px; border-radius: 22px; background: var(--fill); display: grid; place-items: center; margin: 10px auto 0; }
.hero-ico svg { width: 32px; height: 32px; }

.toast { position: fixed; left: 50%; top: calc(8px + var(--safe-t)); z-index: 60; transform: translate(-50%, -150%) scale(.9); opacity: 0;
  display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; max-width: calc(100vw - 32px);
  font-size: 15px; font-weight: 600; transition: opacity .3s, transform .6s var(--spring); white-space: nowrap; pointer-events: none; }
.toast span { overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast button { color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }


/* ——— широкие экраны: iPad, ноутбук, монитор (правило Глеба 29.10 — нормальный вид на всех устройствах) ——— */
.wkrow { display: flex; align-items: center; gap: 4px; }
.wkrow .week { flex: 1; }
.wk-nav { display: none; width: 36px; height: 36px; border-radius: 18px; place-items: center; color: var(--text-2); flex: none; }
.wk-nav svg { width: 10px; height: 16px; }
.wk-nav[disabled] { opacity: .25; pointer-events: none; }
@media (hover: hover) and (pointer: fine) { /* мышь: стрелки недели, подсветка под курсором */
  .wk-nav { display: grid; margin-top: 18px; }
  .wk-nav:hover, .ibtn:hover, .hbtn:hover, .tab:hover, .chip:hover, .wb:hover, .qchip:not(.on):hover { background: var(--lens); }
  .qchip.on:hover { opacity: .9; }
  button.cell:hover, .wd:hover { background: var(--fill); }
  .btn:hover { opacity: .9; }
  button, [role=button] { cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
}
@media (min-width: 768px) { /* iPad и больше: окна — по центру, как на iPad */
  .sheet, .sheet.short { top: 50%; bottom: auto; left: 50%; right: auto; width: min(600px, 92vw); max-width: none; margin: 0;
    height: min(86dvh, 880px); border-radius: 38px; transform: translate(-50%, -46%) scale(.97); opacity: 0; transition: transform .45s var(--ios), opacity .3s; }
  .sheet.short { height: auto; max-height: 86dvh; }
  .sheet.on { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .head::before { display: none; }
  .ring-wrap { width: 260px; }
  .seg button { height: 38px; }
}
@media (min-width: 960px) { /* ноутбук и монитор: две колонки */
  .app { max-width: 1180px; padding-left: 40px; padding-right: 40px; }
  .tgrid { display: grid; grid-template-columns: minmax(360px, 440px) 1fr; gap: 48px; align-items: start; }
  .tb > .sec:first-child { margin-top: 52px; }
  .hgrid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0 32px; align-items: start; }
  .hgrid .hcal { grid-row: span 2; }
  .actions { right: max(40px, calc(50% - 550px)); }
  .today-btn { left: max(40px, calc(50% - 550px)); }

  .large { font-size: 40px; }
}

@media (min-width: 1600px) { .app { max-width: 1320px; } .tgrid { grid-template-columns: 480px 1fr; gap: 64px; } }

/* ——— внутри Формы (?embed=1, coach/SYNC.md §5): своего нижнего меню нет — разделы сверху сегментами;
   низ — над меню Формы (--emb), на ≥ 1024 px меню Формы сбоку — отступа нет ——— */
.etop { display: none; }
:root.embed { --emb: max(calc(env(safe-area-inset-bottom, 0px) + 90px), 110px); /* в рамке iOS отдаёт safe-area = 0 — с запасом */ --etop: calc(60px + var(--safe-t)); }
@media (min-width: 1024px) { :root.embed { --emb: 0px; } }
.embed .edge-top, .embed .edge-bottom, .embed .nav-t, .embed .today-btn, .embed .tabbar .tabs { display: none !important; }
.embed .etop { display: block; position: fixed; z-index: 33; top: 0; left: 0; right: 0; pointer-events: none;
  padding: calc(8px + var(--safe-t)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));

/* листаю вниз — панель уезжает вверх (как строка адреса Safari), вверх — возвращается (Глеб 03.11); только transform — без перерисовки */
.embed .etop.away { transform: translateY(calc(-100% - 6px)); opacity: 0; }
.embed .etop.away .in { pointer-events: none; }
.embed .etop .in { max-width: 540px; margin: 0 auto; pointer-events: auto; }

      const fk = new Set(favs.map(x => x.key)), rec = S.recent.filter(f => !fk.has(favKey(f.name))).slice(0, 6); // что уже в «Часто» — не повторяем
      if (rec.length) { html += `<div class="group-t">Недавние</div><div class="list">${rec.map((f, i) => { pool['r' + i] = f; return row(f, 'r' + i, f.g ? `${fmt(f.g)} г · ${fmt(f.kcal * f.g / 100)} ккал` : `${fmt(f.kcal)} ккал`); }).join('')}</div>`; }
      if (S.custom.length) html += `<div class="group-t">Мои продукты</div><div class="list">${S.custom.map((f, i) => { pool['m' + i] = f; return row(f, 'm' + i); }).join('')}</div>`;
      html += `<div class="big-t">Популярные блюда</div>${grouped(DISHES, DISH, 'd', pool, row)}`;
      html += `<div class="big-t">Рестораны</div>${cmCell()}`;
      html += `<div class="big-t">Продукты</div>${grouped(BASE, FOODS, 'b', pool, row)}`;
      html += `<div class="foot">В поиске — больше 5 000 блюд со всего мира и продукты из магазинов. ≈ — готовое блюдо, калорийность зависит от рецепта.</div>`;
    } else {
      const hit = s.split(/\s+/).every(w => CM_Q.test(w)) ? CMF.slice() : findFoods(s), shown = hit.slice(0, LIMIT); // просто «кофемания» — меню по порядку разделов, а не самые короткие названия
      if (CM_Q.test(s)) html += cmCell('margin-top:14px');
      if (shown.length) html += `<div class="list" style="margin-top:14px">${shown.map((f, i) => { pool['s' + i] = f; return row(f, 's' + i); }).join('')}</div>`;
      if (hit.length > LIMIT) html += `<div class="foot">Ещё ${fmt(hit.length - LIMIT)} — уточни запрос</div>`;
      if (!WORLD) html += `<div class="foot">Загружаю блюда со всего мира…</div>`;
      if (Array.isArray(shop) && shop.length) html += `<div class="group-t">В магазинах</div><div class="list">${shop.map((x, i) => {
        const f = { name: x.brand ? `${x.name} · ${x.brand}` : x.name, kcal: x.kcal, p: x.p, f: x.f, c: x.c, salt: x.salt, unit: x.g > 0 ? { name: 'порция', g: x.g } : null };
        pool['o' + i] = f; return row(f, 'o' + i); }).join('')}</div>`;
      else if (shop === 'wait') html += `<div class="foot">Ищу в магазинах…</div>`;
      if (!shown.length && shop !== 'wait' && !(Array.isArray(shop) && shop.length) && WORLD) html += `<div class="lead" style="margin-top:30px">Такого не нашёл.<br>Сфотографируй еду или добавь свой продукт.</div>`;
    }
    html += `<div class="list" style="margin-top:22px"><button class="cell" id="own"><span class="t"><div class="n">Свой продукт</div><div class="m">Цифры с этикетки</div></span>${I.chev}</button>
      <button class="cell" id="quick"><span class="t"><div class="n">Только калории</div><div class="m">Когда состав неизвестен</div></span>${I.chev}</button></div>
      <div class="foot">Блюда мира — база USDA FoodData Central, продукты магазинов — Open Food Facts (ODbL).</div>`;
    const res = $('#results'); if (!res) return; res.innerHTML = html;
    const pl = pool;
    res.onclick = e => {
      const b = e.target.closest('[data-k]'), pool = pl;
      if (b) { const f = pool[b.dataset.k]; if (b.dataset.k[0] === 'r' && !f.g) addItem(m, { name: f.name, g: 0, kcal: f.kcal, p: f.p, f: f.f, c: f.c, salt: f.salt || 0 }); else openPortion(f, m, null, b.dataset.k[0] === 'r' ? f.g : f.recipe ? recG(f.recipe) : 0, () => openAdd(m, q)); }
      else if (e.target.closest('#own')) openCustom(m);
      else if (e.target.closest('#quick')) openQuick(m);
      else if (e.target.closest('#cmOpen')) openCM(m, q);
    };
  };
  const search = () => {
    const mine = q;
    shop = q.trim().length >= 3 ? 'wait' : null;
    shopSearch(q, items => { if (mine === q) { shop = items; draw(); } });
    draw();
  };
  const html = `<div class="search">${I.search}<input id="q" type="search" placeholder="Любое блюдо или продукт" autocomplete="off" enterkeyhint="search" aria-label="Найти продукт"></div>
    <button class="photo-cta" id="photoCta">${I.cam}<span><b>Сфотографировать еду</b><span>Узнаю блюда и граммы по фото</span></span></button>
    <div class="cta2" id="cta2"><button class="photo-cta soft" id="voiceCta">${I.mic}<span><b>Надиктовать</b><span>Что съел и выпил</span></span></button>
      <button class="photo-cta soft" id="recipeCta">${I.pot}<span><b>Мой рецепт</b><span>Что приготовил</span></span></button></div>
    <div class="seg meal" id="mseg"><span class="thumb"></span>${MEALS.map(([k, n]) => `<button data-m="${k}" aria-pressed="${k === m}">${n}</button>`).join('')}</div>
    <div id="qbAdd" style="margin-top:14px">${quickRow(true)}</div>
    <div id="recs"></div>
    <div id="fav"></div>
    <div id="results"></div>`;
  openSheet('Добавить', html, body => {
    const seg = $('#mseg', body);
    requestAnimationFrame(() => placeSeg(seg));
    const qb = $('#qbAdd', body), qbShow = () => { qb.hidden = m !== 'breakfast' || !!q.trim(); }; // быстрый завтрак — когда выбран «Завтрак»
    qb.onclick = e => { const b = e.target.closest('[data-qb]'); if (b) quickBreakfast(b.dataset.qb); };
    seg.onclick = e => { const b = e.target.closest('[data-m]'); if (!b || b.dataset.m === m) return; m = b.dataset.m; seg.querySelectorAll('[data-m]').forEach(c => c.setAttribute('aria-pressed', c === b)); placeSeg(seg, true); qbShow(); buzz();
      drawFav(true); if (!q.trim()) draw(); }; // другой приём пищи — «Часто» переставляется плавно
    const fb = $('#fav', body);
    fb.onclick = e => {
      const a = e.target.closest('[data-fa]'), o = e.target.closest('[data-fo]');
      const x = a ? favs[+a.dataset.fa] : o ? favs[+o.dataset.fo] : null;
      if (!x) return;
      if (a || !x.e.per100) { // «+» — сразу в дневник с обычной порцией; лист не закрывается — можно добавить ещё
        const btn = a || fb.querySelector(`[data-fa="${favs.indexOf(x)}"]`);
        onSheetClose = () => view === 'today' && renderToday(false);
        favAdd(m, x.e, done => { if (btn) { btn.classList.toggle('done', done); btn.innerHTML = done ? I.check : I.plus; } });
      } else openPortion({ name: x.e.name, per100: x.e.per100, unit: x.e.unit }, m, null, x.e.g, () => openAdd(m, q));
    };
    longPress(fb, '[data-fk]', el => { const x = favs.find(f => f.key === el.dataset.fk); if (x && togglePin(x.e) !== null) drawFav(true); });
    const rb = $('#recs', body);
    rb.onclick = e => {
      if (e.target.closest('#recAll')) return openRecipes(m);
      const a = e.target.closest('[data-ra]'), o = e.target.closest('[data-ro]'), r = a ? recRows[+a.dataset.ra] : o ? recRows[+o.dataset.ro] : null;
      if (!r) return;
      const g = recG(r.id), f = recFood(r);
      if (a) { // «+» — сразу в дневник с привычной порцией
        onSheetClose = () => view === 'today' && renderToday(false);
        favAdd(m, foodEntry(f, g), done => { a.classList.toggle('done', done); a.innerHTML = done ? I.check : I.plus; });
      } else openPortion(f, m, null, g, () => openAdd(m, q));
    };
    longPress(rb, '[data-rk]', el => { const r = recById(el.dataset.rk); if (r && togglePin(foodEntry(recFood(r), recG(r.id))) !== null) drawFav(true); });
    $('#recipeCta', body).onclick = () => openRecipeNew(m);
    $('#voiceCta', body).onclick = () => openVoice(m);
    longPress($('#results', body), '[data-k]', el => { // закрепить любое блюдо из списка или поиска
      const f = pool[el.dataset.k]; if (!f) return;
      const e = el.dataset.k[0] === 'r' && !f.g ? entryOf(f, 0) : foodEntry(f, el.dataset.k[0] === 'r' ? f.g : myG(f.unit) || 100);
      if (togglePin(e) !== null) drawFav(true);
    });
    const inp = $('#q', body);
    inp.value = q; $('#photoCta', body).hidden = $('#cta2', body).hidden = rb.hidden = !!q.trim(); qbShow(); fb.hidden = !!q.trim(); drawFav(false);
    let typing = 0;
    inp.oninput = () => { q = inp.value; $('#photoCta', body).hidden = $('#cta2', body).hidden = rb.hidden = fb.hidden = !!q.trim(); qbShow(); clearTimeout(typing); typing = setTimeout(search, 90); }; // пока печатает — не перерисовываем на каждую букву
    $('#photoCta', body).onclick = () => photoFlow(m);
    if (!WORLD) loadWorld().then(() => { if ($('#q') === inp) draw(); });
    q.trim() ? search() : requestAnimationFrame(() => requestAnimationFrame(draw)); // лист уже поехал — длинный список следом
  }, {});
}

/* «Кофемания»: весь раздел — отдельным листом по разделам меню; цифры — на порцию, как в меню ресторана */
const cmLine = f => `Кофемания · ${fmt(f.unit.g)} г · ${fmt(f.kcal * f.unit.g / 100)} ккал`;
const cmCell = style => `<div class="list"${style ? ` style="${style}"` : ''}><button class="cell" id="cmOpen"><span class="t"><div class="n">Кофемания</div>
  <div class="m">${CMF.length} блюд из меню · вес и КБЖУ ресторана</div></span>${I.chev}</button></div>`;
function openCM(meal, q) {
  const pool = {}, k = f => f.unit.g / 100;
  const row = (f, key) => `<button class="cell" data-k="${key}"><span class="t"><div class="n">${esc(f.name)}</div>
    <div class="m num">${fmt(f.unit.g)} г · ${fmt(f.kcal * k(f))} ккал · Б ${Math.round(f.p * k(f))} · Ж ${Math.round(f.f * k(f))} · У ${Math.round(f.c * k(f))}</div></span>${I.chev}</button>`;
  openSheet('Кофемания', `<div id="cmList">${grouped(CM, CMF, 'c', pool, row)}</div>
    <div class="foot">Вес и КБЖУ на порцию — из меню coffeemania.ru (03.11.2026). Соль в меню не указана. Удерживай блюдо — закрепить наверху.</div>`, body => {
    const list = $('#cmList', body);
    list.onclick = e => { const b = e.target.closest('[data-k]'); if (b) openPortion(pool[b.dataset.k], meal, null, 0, () => openCM(meal, q)); };
    longPress(list, '[data-k]', el => { const f = pool[el.dataset.k]; if (f) togglePin(foodEntry(f, f.unit.g)); });
  }, { back: () => openAdd(meal, q), slide: true });
}

const myG = u => u && u.scale ? Math.round(u.g * (S.portion || 1) / 5) * 5 : u ? u.g : 0; // только порции из базы; свои и с упаковки — как есть
function openPortion(food, meal, item, grams, back) {
  const ug = myG(food.unit);
  let g = item ? item.g : grams || ug || 100;
  const per = food.per100 || food;
  const units = [];
  if (food.unit) units.push([`${food.unit.name} · ${fmt(ug)} г`, ug]);
  if (food.whole && food.whole !== ug) units.push([`всё блюдо · ${fmt(food.whole)} г`, food.whole]); // рецепт
  for (const x of [50, 100, 200, 300, 400, 500]) if (!food.unit || x !== ug) units.push([`${x} г`, x]);
  const html = `<div class="portion">
    <div class="title">${esc(food.name)}</div><div class="per num">${macroLine(per)}${per.salt ? ' · соль ' + dec(per.salt) : ''} на 100 г</div>
    <div class="grams"><button class="st" id="minus" aria-label="Меньше">${I.minus}</button>
      <span class="box"><input id="g" class="num" inputmode="decimal" value="${String(r1(g)).replace('.', ',')}" aria-label="Граммы"><span class="u">г</span></span>
      <button class="st" id="plus" aria-label="Больше">${I.plus}</button></div>
    <div class="chips" id="units">${units.map(([n, v]) => `<button class="chip" data-g="${v}">${n}</button>`).join('')}</div>
    <div class="facts num" id="res"></div>
    <button class="btn" id="ok">${item ? 'Сохранить' : 'Добавить в «' + mealName(meal) + '»'}</button>
    ${item ? `<button class="btn danger" id="del">Удалить</button>` : ''}
    <button class="pinb" id="pinB" aria-pressed="${isPinned(food.name)}">${I.pin}<span>${isPinned(food.name) ? 'Закреплено' : 'Закрепить наверху'}</span></button>
    ${food.recipe && recById(food.recipe) ? `<button class="pinb" id="recOpen" style="margin-left:6px">${I.pot}<span>Рецепт</span></button>` : ''}
  </div>`;
  openSheet(item ? 'Изменить' : 'Порция', html, body => {
    const inp = $('#g', body), res = $('#res', body);
    const calc = () => {
      inp.style.width = Math.max(1.6, String(inp.value).length + 0.3) + 'ch';
      const k = num(inp.value) / 100;
      res.innerHTML = `<div><b>${fmt(per.kcal * k)}</b><span>ккал</span></div><div><b>${Math.round(per.p * k)}</b><span>белки</span></div>
        <div><b>${Math.round(per.f * k)}</b><span>жиры</span></div><div><b>${Math.round(per.c * k)}</b><span>углев.</span></div><div><b>${dec((per.salt || 0) * k)}</b><span>соль</span></div>`;
      body.querySelectorAll('[data-g]').forEach(c => c.classList.toggle('on', +c.dataset.g === num(inp.value)));
    };
    const set = v => { inp.value = String(Math.max(0, Math.round(v * 10) / 10)).replace('.', ','); calc(); buzz(); };
    calc();
    inp.oninput = calc;
    inp.onfocus = () => inp.select();
    $('#minus', body).onclick = () => set(num(inp.value) - (num(inp.value) > 10 ? 10 : 1));
    $('#plus', body).onclick = () => set(num(inp.value) + (num(inp.value) >= 10 ? 10 : 1));
    $('#units', body).onclick = e => { const b = e.target.closest('[data-g]'); if (b) set(+b.dataset.g); };
    $('#pinB', body).onclick = () => { // закреп — с той порцией, что сейчас стоит
      const r = togglePin(foodEntry({ name: food.name, per100: { kcal: per.kcal, p: per.p, f: per.f, c: per.c, salt: per.salt || 0 }, unit: food.unit || null }, num(inp.value) || ug || 100));
      if (r !== null) { const b = $('#pinB', body); b.setAttribute('aria-pressed', r); b.lastChild.textContent = r ? 'Закреплено' : 'Закрепить наверху'; }
    };
    $('#ok', body).onclick = () => {
      const gr = num(inp.value);
      if (gr <= 0) { toast('Укажи граммы'); inp.focus(); return; }
      const k = gr / 100;
      const data = { name: food.name, g: gr, kcal: per.kcal * k, p: per.p * k, f: per.f * k, c: per.c * k, salt: (per.salt || 0) * k,
        per100: { kcal: per.kcal, p: per.p, f: per.f, c: per.c, salt: per.salt || 0 }, unit: food.unit || null };
      if (item) { const before = totals(cur).kcal; Object.assign(item, data); save(); closeSheet(); renderToday(false); changed(before, 'Сохранено'); }
      else addItem(meal, data);
    };
    if (item) $('#del', body).onclick = () => deleteItem(item);
    const ro = $('#recOpen', body); if (ro) ro.onclick = () => openRecipe(food.recipe, meal);
  }, { back, slide: !!back });
}

function changed(before, text) { // тост после добавления/правки; перешли норму — говорим об этом
  const g = S.goals[dayType(cur)].kcal, after = totals(cur).kcal;
  if (before < g && after >= g) { toast(cur === today() ? 'Норма на сегодня закрыта' : 'Норма дня закрыта'); buzz(); }
  else toast(text);
}
function addItem(meal, data, many) {
  const before = totals(cur).kcal, d = S.days[cur] = day(cur);
  const it = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), meal }, data);
  d.items.push(it); lastAdded = it.id;
  const per = data.per100 || { kcal: data.kcal, p: data.p, f: data.f, c: data.c, salt: data.salt || 0 };
  S.recent = [{ name: data.name, g: data.g || 0, unit: data.unit || null, ...per }].concat(S.recent.filter(r => r.name !== data.name)).slice(0, 20);
  save();
  if (many) return;
  buzz(); closeSheet(); renderToday(false);
  changed(before, `${data.name.length > 22 ? data.name.slice(0, 21) + '…' : data.name} · ${fmt(data.kcal)} ккал`);
}
function deleteItem(item) {
  if (!item) return;
  const dk = cur, d = day(dk), i = d.items.indexOf(item);
  if (i < 0) return;
  d.items.splice(i, 1); save(); closeSheet(); renderToday(false); buzz();
  toast('Удалено', 'Вернуть', () => { // в тот день, откуда удалили, даже если уже открыт другой
    if (d.items.includes(item)) return;
    d.items.splice(Math.min(i, d.items.length), 0, item); S.days[dk] = d; save();
    if (view === 'today' && cur === dk) renderToday(false);
  });
}
/* Быстрый завтрак (Глеб 03.11): каша на молоке большой порцией (глубокая тарелка до краёв) + авокадо — одним нажатием.
   Цифры — оценка по таблицам состава, на всю порцию:
   · хлопья гречневые Nordic: ~100 г сухих (≈ 340–350 ккал) + 250 мл молока 2,5 % (≈ 130 ккал) ≈ 490 ккал, Б 17, Ж 9, У 86;
   · рисовая каша на молоке ≈ 99 ккал / 100 г (Б 3, Ж 2,4, У 16,3), пшённая ≈ 115 ккал / 100 г (Б 3,7, Ж 3,1, У 18,1) —
     середина табличных 97–100 и 110–120; порция 400 г готовой; соль — молоко и щепотка в каше;
   · авокадо целиком — ~145 г мякоти: 230 ккал, Б 3, Ж 21, У 3 (без клетчатки), соли нет.
   Авокадо — отдельной строкой (можно убрать свайпом) и только если его ещё нет в завтраке. Порции не умножаются на «Размер порций» — они уже большие. */
const AVO = { name: 'Авокадо', g: 145, kcal: 230, p: 3, f: 21, c: 3, salt: 0 };
const QUICK = [
  ['nordic', 'Хлопья Nordic', { name: 'Хлопья гречневые Nordic на молоке', g: 350, kcal: 490, p: 17, f: 9, c: 86, salt: 0.3 }],
  ['rice', 'Рисовая каша', { name: 'Каша рисовая на молоке', g: 400, kcal: 396, p: 12, f: 9.6, c: 65.2, salt: 1 }],
  ['millet', 'Пшённая каша', { name: 'Каша пшённая на молоке', g: 400, kcal: 460, p: 14.8, f: 12.4, c: 72.4, salt: 1 }],
  ['avo', 'Авокадо', AVO],
];
const quickItem = x => ({ ...x, per100: { kcal: x.kcal * 100 / x.g, p: x.p * 100 / x.g, f: x.f * 100 / x.g, c: x.c * 100 / x.g, salt: x.salt * 100 / x.g }, unit: { name: 'порция', g: x.g } });
const quickHas = name => day(cur).items.some(i => i.meal === 'breakfast' && i.name === name);
const quickRow = (title) => `<div class="qb" role="group" aria-label="Быстрый завтрак">${title ? '<div class="qb-t">Быстрый завтрак · каша на молоке + авокадо</div>' : ''}${QUICK.map(([k, l, x]) => {
  const on = quickHas(x.name);
  return `<button class="qchip${on ? ' on' : ''}" data-qb="${k}" aria-pressed="${on}">${on ? I.check : ''}${l}</button>`; }).join('')}</div>`;
function quickBreakfast(key, force) {
  const q = QUICK.find(x => x[0] === key); if (!q) return;
  const main = q[2];
  if (!force && quickHas(main.name)) { // повтор — не дублируем молча
    buzz(); toast(`${q[1]} — уже в завтраке`, 'Ещё раз', () => quickBreakfast(key, true)); return;
  }
  const list = [main].concat(main !== AVO && !quickHas(AVO.name) ? [AVO] : []);
  const dk = cur, ids = [];
  for (const x of list) { addItem('breakfast', quickItem(x), true); ids.push(lastAdded); }
  lastAdded = ids;
  buzz(); closeSheet(); renderToday(false);
  toast(list.length > 1 ? `${q[1]} + авокадо` : `${q[1]} · ${fmt(main.kcal)} ккал`, 'Отменить', () => { // коротко — рядом кнопка
    const d = day(dk); d.items = d.items.filter(i => !ids.includes(i.id)); S.days[dk] = d; save();
    if (view === 'today' && cur === dk) renderToday(false);
  });
}
/* ——— «Часто» и закрепы (Глеб 03.11: «то, что я больше всего добавляю, — на первое место, как закрепы») ———
   Частота за 60 дней с затуханием: запись весит 0,5^(дней назад / 14) — вчерашнее ≈ 1, двухнедельное ½, месячное ¼.
   В выбранном приёме пищи выше то, что ем именно в нём: счёт × (0,35 + 0,65 × доля этого приёма).
   В «Часто» — блюда, добавленные ≥ 2 раз (до 8). Порция — та, что ставлю чаще всего (с тем же затуханием).
   Закрепы S.pins (до 6, удержание строки или кнопка в листе порции) — всегда первыми. Частота считается по дням
   дневника — значит, едет на все устройства вместе с ними; сами закрепы — в памяти устройства с остальными данными. */
const FAV_DAYS = 60, FAV_HALF = 14, FAV_MAX = 8, FAV_MIN = 2, PIN_MAX = 6;
const favKey = name => norm(String(name || '')).trim();
const fmtG = g => g < 10 ? dec(g) : fmt(g);
function favStats() {
  const t0 = today(), from = addDays(t0, 1 - FAV_DAYS), T = parseIso(t0), map = new Map();
  for (const [k, d] of Object.entries(S.days)) {
    if (k < from || k > t0) continue;
    const w = Math.pow(0.5, Math.round((T - parseIso(k)) / 864e5) / FAV_HALF);
    for (const it of d.items) {
      const key = favKey(it.name); if (!key) continue;
      let s = map.get(key);
      if (!s) map.set(key, s = { key, n: 0, w: 0, meals: {}, gs: new Map(), last: '', it });
      s.n++; s.w += w; s.meals[it.meal] = (s.meals[it.meal] || 0) + w;
      const g = r1(it.g || 0); s.gs.set(g, (s.gs.get(g) || 0) + w);
      if (k >= s.last) { s.last = k; s.it = it; }
    }
  }
  return map;
}
function usualG(s) { let best = s.it.g || 0, bw = -1; for (const [g, w] of s.gs) if (w > bw + 1e-9 || (Math.abs(w - bw) < 1e-9 && g === s.it.g)) { best = g; bw = w; } return best; }
function entryOf(it, g) { // запись дневника (или закреп) → что добавить с порцией g
  if (it.per100 && g > 0) { const k = g / 100, p = it.per100;
    return { name: it.name, g, kcal: p.kcal * k, p: p.p * k, f: p.f * k, c: p.c * k, salt: (p.salt || 0) * k, per100: { ...p }, unit: it.unit || null }; }
  return { name: it.name, g: it.g || 0, kcal: it.kcal, p: it.p, f: it.f, c: it.c, salt: it.salt || 0, ...(it.per100 ? { per100: { ...it.per100 }, unit: it.unit || null } : {}) };
}
const foodEntry = (f, g) => entryOf({ name: f.name, per100: f.per100 || { kcal: f.kcal, p: f.p, f: f.f, c: f.c, salt: f.salt || 0 }, unit: f.unit || null }, g); // продукт базы → запись
function favList(meal) {
  const st = favStats(), out = [], seen = new Set();
  for (const p of S.pins) {
    const key = favKey(p.name), s = st.get(key); if (seen.has(key)) continue; seen.add(key);
    out.push({ key, pin: true, e: s ? entryOf(s.it, usualG(s)) : entryOf(p, p.g), mw: s ? (s.meals[meal] || 0) / s.w : 0 });
  }
  const sc = s => s.w * (0.35 + 0.65 * (s.meals[meal] || 0) / s.w);
  [...st.values()].filter(s => s.n >= FAV_MIN && !seen.has(s.key))
    .sort((a, b) => sc(b) - sc(a) || b.n - a.n || (a.last < b.last ? 1 : a.last > b.last ? -1 : 0)).slice(0, FAV_MAX)
    .forEach(s => out.push({ key: s.key, e: entryOf(s.it, usualG(s)), mw: (s.meals[meal] || 0) / s.w }));
  return out;
}
const isPinned = name => S.pins.some(p => favKey(p.name) === favKey(name));
let pinLock = false;
function togglePin(e) { // e — запись с порцией; true/false — закреплено/откреплено, null — ничего не поменялось
  if (pinLock) return null; // удержание и «контекстное меню» Android — одно действие
  pinLock = true; setTimeout(() => { pinLock = false; }, 700);
  const key = favKey(e.name), i = S.pins.findIndex(p => favKey(p.name) === key);
  if (i >= 0) { S.pins.splice(i, 1); persist(); buzz(); toast('Откреплено'); return false; }
  if (S.pins.length >= PIN_MAX) { buzz(); toast(`Закрепить можно до ${PIN_MAX} блюд`); return null; }
  const x = entryOf(e, e.g);
  S.pins.push({ name: x.name, g: x.g, kcal: x.kcal, p: x.p, f: x.f, c: x.c, salt: x.salt || 0, ...(x.per100 ? { per100: x.per100, unit: x.unit || null } : {}) });

}
function favAdd(meal, e, after) { // одним нажатием, с обычной порцией; «Отменить» — в тосте
  const dk = cur; addItem(meal, entryOf(e, e.g), true); const id = lastAdded; buzz();
  toast(`${e.name.length > 20 ? e.name.slice(0, 19) + '…' : e.name} · ${fmt(e.kcal)} ккал`, 'Отменить', () => {
    const d = day(dk); d.items = d.items.filter(i => i.id !== id); S.days[dk] = d; save();
    if (view === 'today' && cur === dk && !$('#sheet').classList.contains('on')) renderToday(false); // лист открыт — «Сегодня» обновится при закрытии
    after && after(false);

function longPress(root, sel, fn) { // удержание ~0,45 с (палец не уехал дальше 8 px) или правая кнопка мыши
  let t = null, x0 = 0, y0 = 0, fired = false;
  const stop = () => { clearTimeout(t); t = null; };
  const fire = el => { el.classList.remove('held'); void el.offsetWidth; el.classList.add('held'); fn(el); };
  root.addEventListener('touchstart', e => {
    const el = e.target.closest(sel); fired = false; stop(); if (!el || e.touches.length > 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t = setTimeout(() => { t = null; fired = true; fire(el); }, 450);
  }, { passive: true });
  root.addEventListener('touchmove', e => { if (t && Math.hypot(e.touches[0].clientX - x0, e.touches[0].clientY - y0) > 8) stop(); }, { passive: true });
  root.addEventListener('touchend', e => { stop(); if (fired && e.cancelable) e.preventDefault(); }); // после удержания — без «нажатия»
  root.addEventListener('touchcancel', stop);
  root.addEventListener('contextmenu', e => { const el = e.target.closest(sel); if (!el) return; e.preventDefault(); if (!fired) fire(el); });
  root.addEventListener('click', e => { if (fired) { fired = false; e.stopPropagation(); e.preventDefault(); } }, true);
}
function flip(box, html) { // новый порядок строк — плавно переезжают на место (FLIP), новые проявляются; без прыжка списка
  const old = {}; box.querySelectorAll('[data-fk]').forEach(el => old[el.dataset.fk] = el.getBoundingClientRect().top);
  box.innerHTML = html;
  if (reduce() || !Element.prototype.animate) return;
  box.querySelectorAll('[data-fk]').forEach(el => {
    const t = old[el.dataset.fk], dy = t == null ? null : t - el.getBoundingClientRect().top;
    if (dy == null) el.animate([{ opacity: 0, transform: 'scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'ease-out' });
    else if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.32,.72,0,1)' });
  });
}
/* капсулы «Часто» в приёме пищи на «Сегодня»: что ем именно в нём (≥ половины раз), до 3; в завтраке — до 2, кроме быстрых каш */
function favChips(meal) {
  const quick = new Set(QUICK.map(q => favKey(q[2].name)));
  return favList(meal).filter(x => x.mw >= 0.5 && !(meal === 'breakfast' && quick.has(x.key))).slice(0, meal === 'breakfast' ? 2 : 3);
}
const favHas = (meal, name) => day(cur).items.some(i => i.meal === meal && favKey(i.name) === favKey(name));
function favChipRow(meal) {

function openItem(id) {

/* ——— «Мои рецепты» (Глеб 03.11: «готовлю по своим рецептам — сказать голосом, ты расшифровал, и чтобы осталось»):
   голос или текст → сервер Тренера (/api/kcal/recipe/parse: речь — common/voice.py, разбор — Claude) → предпросмотр (граммы
   правятся, продукты убираются и добавляются) → рецепт навсегда (S.recipes, sync как дни). В дневник рецепт идёт как обычное
   блюдо с КБЖУ на 100 г готового и порцией — правка рецепта записанные дни не меняет. ——— */
const recLive = () => S.recipes.filter(r => !r.del);
const recById = id => S.recipes.find(r => r.id === id && !r.del) || null;
function recTot(r) { const t = { g: 0, kcal: 0, p: 0, f: 0, c: 0, salt: 0 }; for (const i of r.ings) for (const k in t) t[k] += num(i[k]); return t; }
const recOut = r => r.out > 0 ? r.out : recTot(r).g; // вес готового: сказал — его, иначе сумма продуктов
const recServ = r => Math.max(1, Math.round(recOut(r) / (r.servings > 0 ? r.servings : 1)));
function recFood(r) { // рецепт → «продукт»: КБЖУ на 100 г готового, порция — одна порция (порций не сказал — всё блюдо)
  const t = recTot(r), o = recOut(r) || 1, k = 100 / o;
  return { name: r.name, kcal: t.kcal * k, p: t.p * k, f: t.f * k, c: t.c * k, salt: t.salt * k, recipe: r.id,
    unit: { name: r.servings > 1 ? 'порция' : 'всё блюдо', g: recServ(r) }, whole: Math.round(o) };
}
function recG(id) { // привычная порция: та, что ставил чаще всего (как в «Часто»), иначе одна порция
  const r = recById(id); if (!r) return 0;
  const s = favStats().get(favKey(r.name)), g = s ? usualG(s) : 0;
  return g > 0 ? g : recServ(r);
}
const recLine = f => `Мой рецепт · ${f.unit.name} ${fmt(f.unit.g)} г · ${fmt(f.kcal * f.unit.g / 100)} ккал`;
function recSorted() { // чаще и недавно съеденные — выше, потом недавно сохранённые
  const st = favStats();
  return recLive().map(r => ({ r, w: (st.get(favKey(r.name)) || {}).w || 0 })).sort((a, b) => b.w - a.w || b.r.u - a.r.u).map(x => x.r);
}
const recStamp = r => { r.u = Math.max(Date.now(), (r.u || 0) + 1, S.recU + 1); }; // u растёт строго — правка новее всего, что ушло на сервер
function saveRecipe(d) { // черновик → рецепт (новый или поверх старого); null — не сохранилось (сказали почему)
  const i = d.id ? S.recipes.findIndex(r => r.id === d.id) : -1;
  if (i < 0 && recLive().length >= REC_MAX) { toast(`Рецептов уже ${REC_MAX} — удали старые`); return null; }
  const r = cleanRecipe({ ...d, id: d.id || 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), u: i >= 0 ? S.recipes[i].u : 0 });
  if (!r) { toast('Напиши название'); return null; }
  if (!r.ings.length) { toast('Добавь хотя бы один продукт'); return null; }

function deleteRecipe(id, after) { // «надгробие» с новым u — удаление дойдёт до других устройств; «Вернуть» — в тосте
  const i = S.recipes.findIndex(r => r.id === id && !r.del); if (i < 0) return;
  const old = S.recipes[i], dead = { id, u: old.u, del: true }; recStamp(dead);
  S.recipes[i] = dead; S.recipes = trimRecipes(S.recipes); save(); buzz();
  toast('Рецепт удалён', 'Вернуть', () => {
    const back = { ...old }; recStamp(back);
    const j = S.recipes.findIndex(r => r.id === id); if (j >= 0) S.recipes[j] = back; else S.recipes.push(back);
    save(); after && after();
  });
}
const sheetIs = t => !$('#sheet').hidden && $('#sheet').classList.contains('on') && $('#sheetTitle').textContent === t;

function openRecipes(meal) {
  const list = recSorted();
  const html = `<button class="photo-cta" id="recNew">${I.mic}<span><b>Новый рецепт</b><span>Расскажи голосом или напиши</span></span></button>
    ${list.length ? `<div class="list" id="recList" style="margin-top:18px">${list.map(r => { const f = recFood(r); return `<button class="cell" data-rid="${esc(r.id)}"><span class="t"><div class="n">${esc(r.name)}</div>
      <div class="m num">${r.ings.length} ${plural(r.ings.length, 'продукт', 'продукта', 'продуктов')} · ${f.unit.name} ${fmt(f.unit.g)} г · ${fmt(f.kcal * f.unit.g / 100)} ккал</div></span>${I.chev}</button>`; }).join('')}</div>`
      : `<div class="lead" style="margin-top:28px">Здесь будут твои рецепты.<br>Расскажи, что приготовил, — посчитаю и запомню.</div>`}
    <div class="foot">Рецепты хранятся ${getToken() ? 'на всех твоих устройствах' : 'на этом устройстве'}. Правка рецепта не меняет уже записанную еду.</div>`;
  openSheet('Мои рецепты', html, body => {
    $('#recNew', body).onclick = () => openRecipeNew(meal);
    const l = $('#recList', body); if (l) l.onclick = e => { const b = e.target.closest('[data-rid]'); if (b) openRecipe(b.dataset.rid, meal); };
  }, { back: () => openAdd(meal), slide: true });

function openRecipe(id, meal) { const r = recById(id); if (!r) return openRecipes(meal); showRecipe(structuredClone(r), { meal, back: () => openRecipes(meal) }); }

/* запись голоса — общий лист для «Мой рецепт» и «Надиктовать»: нажал — говоришь — нажал (или удерживай и отпусти); до 2 минут;
   Safari пишет audio/mp4, Chrome — webm/opus; запасное поле текста. o: title, url (сервер Тренера), text, ph, aria, go, foot,
   write (без микрофона), short (слишком коротко), empty (пустой текст), min, enter (Enter — отправить), deaf/none ([жирное, строка]
   на 422 «голос не распознан» / «не то»), again, reopen(text) — после новой связки, back, ok(ответ, тело) → [жирное, строка], если не подошло,
   extra — что ещё отправить вместе с голосом или текстом (prev у «Поправить»), think — [жирное, строка] третьей стадией ожидания */
const REC_SEC = 120;

function micType() {
  if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
  for (const t of ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus']) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {} }
  return '';
}
function micSheet(o) {
  const canMic = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && typeof MediaRecorder !== 'undefined');
  const html = `<div class="rec-rec">
      <button class="mic" id="mic" aria-label="Записать голосом"${canMic ? '' : ' hidden'}>${I.mic}</button>
      <div class="rec-st" id="recSt" role="status" aria-live="polite"></div>
      <button class="chip" id="recCancel" hidden>Отменить запись</button></div>
    <div class="group-t">${canMic ? 'Или напиши' : 'Напиши'}</div>
    <div class="list"><div class="cell"><textarea id="recText" rows="3" maxlength="2000" aria-label="${esc(o.aria)}"${o.enter ? ' enterkeyhint="send"' : ''}
      placeholder="${esc(o.ph)}">${esc(o.text || '')}</textarea></div></div>
    <div style="margin-top:16px"><button class="btn" id="recGo">${esc(o.go)}</button></div>
    <div class="foot" style="text-align:center">${esc(o.foot)}</div>`;
  openSheet(o.title, html, body => {
    const mic = $('#mic', body), st = $('#recSt', body), ta = $('#recText', body), go = $('#recGo', body), cancel = $('#recCancel', body);
    let mode = 'idle', stream = null, rec = null, chunks = [], t0 = 0, timer = 0, held = false, downAt = 0, drop = false, ctl = null, slow = 0, slow2 = 0;
    const say = (b, s) => { st.innerHTML = `<b>${esc(b)}</b>${s ? esc(s) : ''}`; };
    const idle = (b, s) => {
      mode = 'idle'; mic.classList.remove('on', 'busy'); mic.disabled = false; mic.setAttribute('aria-label', 'Записать голосом');
      cancel.hidden = true; go.disabled = false; ta.disabled = false;
      say(b || (canMic ? 'Нажми и говори' : o.write), s ?? (canMic ? 'Или удерживай, пока говоришь' : 'Запись голоса в этом браузере не работает'));
    };
    const secs = () => (performance.now() - t0) / 1000;
    const clock = () => { const n = Math.floor(secs()); say(`Слушаю · ${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`, 'Нажми, когда закончишь'); if (n >= REC_SEC) stop(); };
    const release = () => { clearInterval(timer); timer = 0; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
    const denied = e => {
      const n = e && e.name, no = n === 'NotAllowedError' || n === 'SecurityError';
      idle(no ? 'Нет доступа к микрофону' : n === 'NotFoundError' ? 'Микрофон не найден' : 'Микрофон не включился',

        addItem(m, { name: r.name, g: r.g, kcal: r.per.kcal * k, p: r.per.p * k, f: r.per.f * k, c: r.per.c * k, salt: r.per.salt * k, per100: r.per, unit: null }, true);
        ids.push(lastAdded);
      }
      lastAdded = ids; // новые строки на «Сегодня» проявляются
      if (w) { const dd = S.days[dk] = day(dk); (dd.water = dd.water || []).push(w); wi = dd.water.length - 1; save(); }
      buzz(); closeSheet(); renderToday(false);
      const goal = S.goals[dayType(dk)].kcal, closed = sel.length && before < goal && totals(dk).kcal >= goal;
      const what = sel.length ? `${sel.length} ${plural(sel.length, 'блюдо', 'блюда', 'блюд')} · ${fmt(kcal)} ккал${w ? ` · +${fmt(w)} мл` : ''}` : `Вода +${fmt(w)} мл`; // коротко — рядом «Отменить»
      toast(closed ? (dk === today() ? 'Норма на сегодня закрыта' : 'Норма дня закрыта') : what, 'Отменить', () => {
        const dd = day(dk); dd.items = dd.items.filter(i => !ids.includes(i.id));
        if (wi >= 0 && dd.water) { const j = dd.water[wi] === w ? wi : dd.water.lastIndexOf(w); if (j >= 0) dd.water.splice(j, 1); }
        S.days[dk] = dd; save();
        if (view === 'today' && cur === dk && !$('#sheet').classList.contains('on')) renderToday(false);
      });
    };
  }, { back, slide: true });
}

/* предпросмотр и правка рецепта: название, продукты (граммы −/+ или числом, убрать, добавить), порции и вес готового → КБЖУ

    };

/* ——— еда по фото: распознаёт Тренер на сервере ——— */
let photoReq = null;

function readySheet(meal) { // выбор файла можно открыть только по нажатию — после подключения нужна кнопка

const MAX_SHOTS = 3;

function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); // крупнее — видно масштаб и мелочь
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(src); ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(src); fail(); };
    img.src = src;
  });
}
async function recognize(shots, meal, hint = '') {
  if (typeof shots === 'string') shots = [shots];
  const url = shots[0];
  openSheet('Фото', `<div class="shot"><img src="${url}" alt=""><div class="scan"></div></div>
    <div class="thinking"><b>Смотрю, что на тарелке</b>Считаю штуки и прикидываю граммы по масштабу — обычно до минуты<div class="dots"><i></i><i></i><i></i></div></div>`, null, {});
  const ctl = new AbortController(); photoReq = ctl;
  const timer = setTimeout(() => ctl.abort(), 180000);
  try {
    const r = await fetch(API + '/api/kcal/photo', { method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + getToken() },
      body: JSON.stringify({ image: url, images: shots.slice(1), text: hint, portion: S.portion || 1 }) }); // portion — размер моих порций: подсказка модели
    const j = await r.json().catch(() => ({}));
    if (photoReq !== ctl) return;
    if (r.status === 401) { setToken(''); if (EMBED) { closeSheet(); return authLost(); } return openPair(() => recognize(shots, meal, hint)); }
    if (!r.ok) throw new Error(j.error || 'Не получилось распознать');
    const items = (Array.isArray(j.items) ? j.items : []).filter(i => i && i.name && num(i.g) > 0 && (num(i.kcal) > 0 || num(i.salt) > 0));
    if (!items.length) throw new Error('Не нашёл на фото еду');
    showFound(url, items, j.comment || '', meal);
  } catch (e) {
    if (photoReq !== ctl) return;
    const msg = e.name === 'AbortError' ? 'Слишком долго — попробуй ещё раз' : e instanceof TypeError ? 'Нет связи с сервером' : e.message;
    openSheet('Фото', `<div class="shot"><img src="${url}" alt=""></div><div class="thinking"><b>${esc(msg)}</b>Можно попробовать ещё раз или найти блюдо поиском.</div>
      <div style="margin-top:24px"><button class="btn" id="retry">Попробовать ещё раз</button><button class="btn soft" id="again">Снять заново</button><button class="btn soft" id="bySearch">Найти поиском</button></div>`, body => {
      $('#retry', body).onclick = () => recognize(shots, meal, hint);
      $('#again', body).onclick = () => pickPhoto(meal);
      $('#bySearch', body).onclick = () => openAdd(meal);
    }, {});
  } finally { clearTimeout(timer); if (photoReq === ctl) photoReq = null; }
}
function showFound(url, items, comment, meal) {

      per: { kcal: num(i.kcal) * k, p: num(i.p) * k, f: num(i.f) * k, c: num(i.c) * k, salt: num(i.salt) * k } };
  });
  const tot = () => rows.filter(r => r.on).reduce((a, r) => { const k = r.g / 100; a.kcal += r.per.kcal * k; a.salt += r.per.salt * k; return a; }, { kcal: 0, salt: 0 });
  const html = `<div class="shot" style="height:170px"><img src="${url}" alt=""></div>
    ${comment ? `<div class="comment">${esc(comment)}</div>` : ''}
    <div class="group-t">Нашёл на фото — поправь граммы</div>
    <div class="list" id="found">${rows.map((r, i) => `<div class="cell pi on" data-i="${i}"><button class="check" data-tog="${i}" aria-label="Учитывать">${I.check}</button>
      <span class="t"><div class="n">${esc(r.name)}</div><div class="m num" id="pm${i}"></div>
        ${r.lo && r.hi ? `<div class="m num range${r.sure === 'low' ? ' low' : ''}">${r.sure === 'low' ? 'Проверь вес · ' : ''}по фото ${r.lo}–${r.hi} г</div>` : ''}</span>
      <span class="mini"><button data-d="-10" aria-label="Меньше">${I.minus}</button><input class="g num" id="pg${i}" inputmode="numeric" aria-label="Граммы"><button data-d="10" aria-label="Больше">${I.plus}</button></span></div>`).join('')}</div>
    <div class="seg meal" id="mseg" style="margin-top:20px"><span class="thumb"></span>${MEALS.map(([k, n]) => `<button data-m="${k}" aria-pressed="${k === m}">${n}</button>`).join('')}</div>
    <div class="sum-line num" id="sum"></div>
    <button class="btn" id="addAll"></button>
    <div class="foot" style="text-align:center;margin-top:12px">Граммы по фото — оценка. Нажми на число, чтобы ввести точный вес.</div>`;
  openSheet('Фото', html, body => {
    const upd = typing => {
      rows.forEach((r, i) => {
        const k = r.g / 100, inp = $('#pg' + i, body);
        if (typing !== i) inp.value = r.g;
        $('#pm' + i, body).textContent = `${fmt(r.per.kcal * k)} ккал · Б ${Math.round(r.per.p * k)} · Ж ${Math.round(r.per.f * k)} · У ${Math.round(r.per.c * k)}`;
        body.querySelector(`[data-i="${i}"]`).classList.toggle('on', r.on);
      });
      const t = tot(), n = rows.filter(r => r.on).length;
      $('#sum', body).innerHTML = `<span>Всего</span><span><b>${fmt(t.kcal)} ккал</b> · соль ${dec(t.salt)} г</span>`;
      const b = $('#addAll', body); b.textContent = n ? `Добавить в «${mealName(m)}»` : 'Ничего не выбрано'; b.disabled = !n;
    };
    upd();
    $('#found', body).onclick = e => {
      const row = e.target.closest('[data-i]'); if (!row || e.target.closest('input')) return; const r = rows[+row.dataset.i];
      const d = e.target.closest('[data-d]');
      if (d) { r.g = Math.max(5, r.g + +d.dataset.d); r.on = true; }
      else if (e.target.closest('[data-tog]') || e.target.closest('.t')) r.on = !r.on;
      buzz(); upd();
    };
    $('#found', body).oninput = e => { // точный вес руками
      const i = +e.target.closest('[data-i]').dataset.i, v = Math.round(num(e.target.value));
      e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 4);
      if (v > 0) { rows[i].g = v; rows[i].on = true; upd(i); }
    };
    $('#found', body).addEventListener('focusin', e => { if (e.target.matches('input')) e.target.select(); });
    $('#found', body).addEventListener('focusout', () => upd());
    const seg = $('#mseg', body);
    requestAnimationFrame(() => placeSeg(seg));
    seg.onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; m = b.dataset.m; seg.querySelectorAll('[data-m]').forEach(c => c.setAttribute('aria-pressed', c === b)); placeSeg(seg, true); upd(); buzz(); };
    $('#addAll', body).onclick = () => {
      const sel = rows.filter(r => r.on), before = totals(cur).kcal; let kcal = 0;
      for (const r of sel) {
        const k = r.g / 100; kcal += r.per.kcal * k;
        addItem(m, { name: r.name, g: r.g, kcal: r.per.kcal * k, p: r.per.p * k, f: r.per.f * k, c: r.per.c * k, salt: r.per.salt * k, per100: r.per, unit: null }, true);
      }
      buzz(); closeSheet(); renderToday(false);

  }, {});
}
function openPair(then, kind) { // kind — что разбирает Тренер: фото (по умолчанию), голос «Надиктовать», рецепт
  if (EMBED) return toast('Нет связи с Формой — открой «Питание» заново'); // вход — у Формы: кода и второго входа здесь нет
  const [ico, title, who] = { voice: [I.mic, 'Еда голосом', 'Голос'], recipe: [I.pot, 'Мои рецепты', 'Рецепт'] }[kind] || [I.cam, 'Еда по фото', 'Фото'];
  const html = `<div class="hero-ico">${ico}</div>
    <div class="portion"><div class="title">${title}</div></div>
    <div class="lead">${who} разбирает твой Тренер. Напиши ему <b>/site</b> в Telegram — он пришлёт код из 6 цифр.</div>

    let busy = false;
    b.onclick = async () => {
      if (busy) return; busy = true; // повторный ввод, пока идёт проверка, второй запрос не шлёт
      b.disabled = true; b.textContent = 'Проверяю…';
      try {
        const r = await fetch(API + '/api/kcal/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: inp.value }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.token) throw new Error(j.error || 'Неверный или старый код');
        setToken(j.token); syncLast = ''; buzz(); toast('Связано с Формой'); then(); startSync();
      } catch (e) {
        toast(e instanceof TypeError ? 'Нет связи с сервером' : e.message); b.textContent = 'Подключить'; b.disabled = false; inp.select();
      } finally { busy = false;
      }

}

  openSheet('Настройки', html, body => {

    body.querySelectorAll('[data-wg]').forEach(inp => inp.onchange = () => { const v = Math.round(num(inp.value));
