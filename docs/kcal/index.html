let toastT;
function toast(text, action, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>`;
  t.style.pointerEvents = 'none';
  if (action) {
    const b = document.createElement('button'); b.textContent = action;
    b.onclick = () => { b.onclick = null; t.style.pointerEvents = 'none'; fn(); t.classList.remove('on'); };
    t.appendChild(b); t.style.pointerEvents = 'auto';
  }
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 4000 : 2000);
}

function markTab(squish) {
  document.querySelectorAll('.tab[data-tab]').forEach(t => t.dataset.tab === view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current')); placeLens();
  const es = $('#eseg'); if (es) { es.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === view)); placeSeg(es, squish); }
  document.body.dataset.view = view;
}
function render(from) { // from — вкладка, с которой ушли (смена вкладки); без него — первый показ
  markTab(); unlockScroll();
  if (from) scrollMem[from] = scrollY; // до того, как старая страница уйдёт (иначе высота схлопнется и прокрутка станет 0)
  const app = $('#app'), old = from && !reduce() && app.firstElementChild;
  if (old) { // старая страница — «призрак» поверх новой, тает за .22 с: без мелькания фона и прыжка
    document.querySelectorAll('.ghost').forEach(g => g.remove());
    const g = document.createElement('div'); g.className = 'app ghost'; g.style.top = app.getBoundingClientRect().top + 'px'; g.setAttribute('aria-hidden', 'true');
    old.querySelectorAll('[id]').forEach(e => e.removeAttribute('id')); old.classList.remove('enter', 'swap'); g.appendChild(old);
    app.after(g); g.addEventListener('animationend', () => g.remove());
  }
  view === 'today' ? renderToday(!from) : renderHistory(!from);
  window.scrollTo(0, from ? scrollMem[view] || 0 : 0); topY = scrollY; showTop(true); onScroll(); // вкладка открывается там, где её оставили (как в iOS); разделы сверху — видны
  if (from) { const nt = $('#navTitle'), et = $('.edge-top'); // маленький заголовок и полоса — сразу в нужном виде, без второго «тающего» заголовка
    nt.style.transition = et.style.transition = 'none'; requestAnimationFrame(() => requestAnimationFrame(() => { nt.style.transition = et.style.transition = ''; })); }
  const a = $('#actions'); a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter'); // верхние кнопки проявляются вместе со страницей
}
const scrollMem = {};
if (window.visualViewport) visualViewport.addEventListener('resize', () => { // клавиатура не закрывает низкий лист
  const kb = Math.max(0, innerHeight - visualViewport.height - visualViewport.offsetTop);
  $('#sheet').style.setProperty('--kb', (kb > 80 ? kb : 0) + 'px');
  document.body.style.setProperty('--kbh', (kb > 80 ? kb : 0) + 'px'); document.body.classList.toggle('kb', kb > 80); // клавиатура открыта — нижнее меню прячется
});
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
// смена вкладки: сначала линза и цвет вкладки (сразу, в этом кадре), страница — со следующего кадра,
// чтобы тяжёлая отрисовка не задерживала отклик меню; без снимка всей страницы (startViewTransition) — он и дёргал меню
let renderQ = 0;
if (EMBED) $('#tabs').remove(); else $('#etop').remove(); // внутри Формы — разделы сегментами сверху, меню снизу — у Формы
function goTab(tab) {
  if (view === tab) { // ещё раз на «Сегодня», когда открыт другой день, — вернуться к сегодня
    if (tab === 'today' && cur !== today() && EMBED) return $('#todayBtn').onclick();
    return window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  const from = view; view = tab; markTab(true); buzz();
  if (!renderQ) renderQ = requestAnimationFrame(() => setTimeout(() => { renderQ = 0; if (from !== view) render(from); }));
}
document.querySelectorAll('.tab[data-tab]').forEach(t => t.onclick = () => goTab(t.dataset.tab));
if (EMBED) $('#eseg').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab); };
if (EMBED) addEventListener('message', e => { // Форма сменила тему
  if (e.origin !== location.origin || !e.data || e.data.type !== 'forma-theme' || !['dark', 'light'].includes(e.data.theme)) return;
  document.documentElement.setAttribute('data-theme', e.data.theme);
});
document.addEventListener('touchstart', () => {}, { passive: true }); // без этого iPhone не показывает нажатие (:active) на кнопках
$('#addTab').onclick = () => { if (view !== 'today') { view = 'today'; render(); } buzz(); openAdd(); };
$('#todayBtn').onclick = () => { cur = today(); shown.left = shown.pct = shown.w = null; buzz(); renderToday(true); };
addEventListener('resize', () => { placeThumb(); placeLens(); placeSeg($('#eseg')); });
let onToday = true;
document.addEventListener('visibilitychange', () => { // открыли на следующий день — показать новый день
  if (document.hidden) { onToday = cur === today(); if (syncT) syncNow(false, true); return; } // уходим — несохранённое у Тренера отправить сразу
  if (onToday && cur !== today() && view === 'today' && !$('#sheet').classList.contains('on')) { cur = today(); shown.left = shown.pct = shown.w = null; renderToday(true); }
  if (getToken() && Date.now() - syncAt > 15000) pullState().then(() => syncBody() !== syncLast || !S.fullSync ? syncNow(false) : getForma()); // вернулись — правки с других устройств, свежие сон и восстановление
});
function takePair() { // ссылка из Формы: …/kcal/#pair=<токен> → связать, убрать токен из адреса
  const m = /^#pair=(.*)$/.exec(location.hash); if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  let t = ''; try { t = decodeURIComponent(m[1]); } catch (e) {}
  if (!/^[\w.~-]{6,200}$/.test(t)) { toast('Ссылка не подошла — возьми новую в Форме'); return false; }
  setToken(t); syncLast = ''; F = null; toast('Связано с Формой'); return true;
}
addEventListener('hashchange', () => { if (takePair()) startSync(); });
const paired = takePair();
render();
if (getToken()) setTimeout(startSync, paired ? 0 : 400); // при открытии — дневник с сервера, потом свой Тренеру, в ответ свежая Форма
(window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => loadWorld()); // база блюд грузится заранее, без рывка при первом поиске
// офлайн-копия — только как отдельный сайт; внутри Формы свой service worker не нужен (область — папка kcal/)
if (!EMBED && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
