<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калории">
<meta name="theme-color" content="#0f1828">
<title>Калории</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #0f1828;
  --surface: #172234;
  --surface-2: #1f2c42;
  --line: rgba(255,255,255,.07);
  --text: #eef2f8;
  --muted: #8b97ab;
  --faint: #5d6980;
  --accent: #ff5a5f;
  --p: #5aa9ff;
  --f: #f6b445;
  --c: #3ed6a2;
  --ok: #3ed6a2;
  --low: #ff7a6b;
  --high: #7d9dff;
  --seg-bg: #172234;
  --seg-thumb: #26344d;
  --ios: cubic-bezier(.32,.72,0,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #e7ebf2; --line: rgba(15,24,40,.08);
    --text: #0f1828; --muted: #5d6980; --faint: #97a1b3; --accent: #e8474d;
    --seg-bg: #dfe4ec; --seg-thumb: #ffffff;
    --p: #2f86ec; --f: #e19a1b; --c: #17ad7c; --ok: #17ad7c; --low: #e5574a; --high: #5b7ef0;
    color-scheme: light;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  min-height: 100vh; min-height: 100dvh;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--p); outline-offset: 2px; border-radius: 10px; }

.app { max-width: 520px; margin: 0 auto; padding: calc(10px + var(--safe-t)) 16px calc(110px + var(--safe-b)); }

/* шапка */
.top { display: flex; align-items: center; gap: 6px; height: 44px; }
.top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; letter-spacing: -.2px; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--muted); transition: background .2s, transform .15s; }
.icon-btn:active { background: var(--surface-2); transform: scale(.92); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[disabled] { opacity: .25; pointer-events: none; }

/* переключатель дня */
.seg { display: flex; position: relative; background: var(--seg-bg); border-radius: 14px; padding: 3px; margin: 8px 0 0; }
.seg button { flex: 1; position: relative; z-index: 1; height: 36px; border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--muted); transition: color .25s; }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 11px; background: var(--seg-thumb); box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .35s var(--ios), width .35s var(--ios); }

/* главное число */
.hero { padding: 26px 2px 6px; }
.hero .left { font-size: 76px; line-height: .95; font-weight: 800; letter-spacing: -3.5px; }
.hero .left.over { color: var(--high); }
.hero .sub { margin-top: 8px; color: var(--muted); font-size: 15px; }
.hero .sub b { color: var(--text); font-weight: 600; }

.tank { position: relative; height: 18px; border-radius: 9px; background: var(--surface); overflow: hidden; margin: 18px 0 0; display: flex; }
.tank i { display: block; height: 100%; transition: width .7s var(--ios); }
.tank .tp { background: var(--p); } .tank .tf { background: var(--f); } .tank .tc { background: var(--c); }
.tank .goal { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); opacity: .5; }

.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 6px; }
.macro { background: var(--surface); border-radius: 16px; padding: 11px 12px 12px; }
.macro .name { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.macro .name::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--dot); }
.macro .val { margin-top: 3px; font-size: 19px; font-weight: 700; letter-spacing: -.4px; }
.macro .val small { font-size: 13px; color: var(--faint); font-weight: 500; letter-spacing: 0; }
.macro .bar { height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.macro .bar i { display: block; height: 100%; background: var(--dot); border-radius: 2px; transition: width .7s var(--ios); }

/* приёмы пищи */
.meal { margin-top: 22px; }
.meal-head { display: flex; align-items: center; gap: 10px; padding: 0 2px 8px; }
.meal-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
.meal-head .sum { flex: 1; color: var(--muted); font-size: 15px; }
.add-btn { width: 34px; height: 34px; border-radius: 17px; background: var(--surface); color: var(--accent); display: grid; place-items: center; transition: transform .15s, background .2s; }
.add-btn:active { transform: scale(.88); background: var(--surface-2); }
.add-btn svg { width: 18px; height: 18px; }
.items { background: var(--surface); border-radius: 18px; overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; transition: background .15s; animation: pop .35s var(--ios); }
.item + .item { border-top: 1px solid var(--line); }
.item:active { background: var(--surface-2); }
.item .t { flex: 1; min-width: 0; }
.item .n { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .g { font-size: 13px; color: var(--muted); }
.item .k { font-size: 16px; font-weight: 600; }
.empty-row { padding: 14px; color: var(--faint); font-size: 15px; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }

/* нижнее меню */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 16px calc(8px + var(--safe-b));
  background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6);
  border-top: 1px solid var(--line); }
.tabbar .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 72px 1fr; align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--faint); padding: 4px 0; transition: color .2s; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { color: var(--text); }
.fab { justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: var(--accent); color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 45%, transparent); transition: transform .18s var(--ios); }
.fab:active { transform: scale(.9); }
.fab svg { width: 26px; height: 26px; }

.view { animation: fade .3s var(--ios); }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }

/* история */
.card { background: var(--surface); border-radius: 20px; padding: 16px; margin-top: 14px; }
.sheet .card { background: none; padding: 0; margin-top: 22px; }
.sheet .card:first-child { margin-top: 4px; }
.card h3 { margin: 0 0 2px; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.card .hint { color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.6px; }
.stat .l { font-size: 13px; color: var(--muted); }
.chart { margin-top: 14px; }
.chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--dot); margin-right: 6px; }
.wlist { margin-top: 10px; }
.wrow { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.wrow span:first-child { color: var(--muted); }
.btn { display: block; width: 100%; height: 50px; border-radius: 15px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.danger { background: transparent; color: var(--low); }
.btn + .btn { margin-top: 8px; }
.row-btns { display: flex; gap: 8px; margin-top: 14px; }
.row-btns .btn { margin: 0; }

/* настройки */
.field { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field label { flex: 1; font-size: 16px; }
.field input { width: 96px; height: 38px; border-radius: 11px; border: 0; background: var(--surface-2); text-align: right; padding: 0 12px; font-size: 16px; font-variant-numeric: tabular-nums; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.days button { height: 42px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: 14px; font-weight: 600; transition: background .2s, color .2s, transform .15s; }
.days button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.days button:active { transform: scale(.92); }
.note { color: var(--faint); font-size: 13px; margin-top: 10px; }

/* листы */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4,8,16,.5); opacity: 0; transition: opacity .3s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: calc(100dvh - 40px - var(--safe-t));
  display: flex; flex-direction: column; background: var(--surface); border-radius: 26px 26px 0 0;
  transform: translateY(105%); transition: transform .42s var(--ios); padding-bottom: var(--safe-b); }
.sheet.on { transform: none; }
.sheet .grab { padding: 8px 0 4px; display: grid; place-items: center; touch-action: none; }
.sheet .grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--faint); opacity: .5; }
.sheet .head { display: flex; align-items: center; padding: 2px 10px 6px 18px; gap: 8px; touch-action: none; }
.sheet .head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
.sheet .body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px 18px; overscroll-behavior: contain; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface-2); color: var(--muted); font-size: 15px; font-weight: 500; transition: background .2s, color .2s, transform .15s; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chip:active { transform: scale(.94); }
.search { position: relative; margin: 12px 0 6px; }
.search input { width: 100%; height: 44px; border-radius: 13px; border: 0; background: var(--surface-2); padding: 0 14px 0 40px; font-size: 17px; }
.search svg { position: absolute; left: 12px; top: 12px; width: 20px; height: 20px; color: var(--faint); }
.group-t { font-size: 13px; color: var(--muted); margin: 14px 2px 4px; }
.food { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 2px; border-bottom: 1px solid var(--line); transition: opacity .15s; }
.food:active { opacity: .55; }
.food .t { flex: 1; min-width: 0; }
.food .n { font-size: 16px; }
.food .m { font-size: 13px; color: var(--muted); }
.food .k { font-size: 15px; color: var(--muted); }
.links { display: flex; gap: 8px; margin-top: 14px; }
.links .btn { height: 44px; font-size: 15px; margin: 0; }

.portion .title { font-size: 22px; font-weight: 700; letter-spacing: -.4px; margin: 2px 0 2px; }
.portion .per { color: var(--muted); font-size: 14px; }
.grams { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 22px 0 12px; }
.grams button { width: 48px; height: 48px; border-radius: 24px; background: var(--surface-2); font-size: 26px; font-weight: 500; transition: transform .15s; }
.grams button:active { transform: scale(.88); }
.grams .box { display: flex; align-items: baseline; gap: 4px; }
.grams input { width: 3ch; min-width: 1.6ch; border: 0; background: transparent; text-align: center; font-size: 52px; font-weight: 800; letter-spacing: -2px; padding: 0; font-variant-numeric: tabular-nums; }
.grams .u { font-size: 22px; color: var(--muted); font-weight: 600; }
.portion .chips { justify-content: center; flex-wrap: wrap; }
.result { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 6px; margin: 20px 0 18px; text-align: center; }
.result div { background: var(--surface-2); border-radius: 14px; padding: 10px 4px; }
.result b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
.result span { font-size: 12px; color: var(--muted); }
.form .field input { width: 120px; }
.form .field input.wide { width: 100%; text-align: left; }
.form .field.col { flex-direction: column; align-items: stretch; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); z-index: 60; transform: translate(-50%, 20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 15px; font-weight: 600; pointer-events: none;
  transition: opacity .25s, transform .35s var(--ios); white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>

  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>

const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ');
const r1 = n => Math.round(n * 10) / 10;
const dec = n => String(r1(n)).replace('.', ',');
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const today = () => iso(new Date());
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

let view = 'today', cur = today(), histRange = 7;

function day(d) { return S.days[d] || { items: [] }; }
function dayType(d) {
  const x = S.days[d];
  if (x && x.type) return x.type;
  return S.trainDays.includes((parseIso(d).getDay() + 6) % 7) ? 'train' : 'rest';
}
function totals(d) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  for (const it of day(d).items) { t.kcal += it.kcal; t.p += it.p; t.f += it.f; t.c += it.c; }
  return t;
}
function dateTitle(d) {
  const t = today();
  if (d === t) return 'Сегодня';
  if (d === addDays(t, -1)) return 'Вчера';

}

}

function placeThumb() {

function countUp(el, from, to) {
  if (from == null || from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 450;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };

}

/* ——— «История» ——— */
function renderHistory() {
  const t = today(), list = [];
  for (let i = histRange - 1; i >= 0; i--) { const d = addDays(t, -i); list.push({ d, t: totals(d).kcal, g: S.goals[dayType(d)].kcal }); }
  const logged = list.filter(x => x.t > 0);
  const avg = logged.length ? logged.reduce((a, x) => a + x.t, 0) / logged.length : 0;
  const inNorm = logged.filter(x => x.t >= x.g * 0.9).length;
  const max = Math.max(...list.map(x => Math.max(x.t, x.g)), 1) * 1.08;
  const W = 320, H = 150, bw = W / list.length, pad = Math.min(6, bw * 0.25);
  const color = x => x.t === 0 ? 'var(--surface-2)' : x.t < x.g * 0.9 ? 'var(--low)' : x.t > x.g * 1.1 ? 'var(--high)' : 'var(--ok)';
  const bars = list.map((x, i) => {
    const h = x.t ? Math.max(3, x.t / max * H) : 3, gy = H - x.g / max * H, X = i * bw + pad / 2;
    return `<rect x="${X}" y="${H - h}" width="${bw - pad}" height="${h}" rx="${Math.min(5, (bw - pad) / 2)}" fill="${color(x)}"><title>${dateTitle(x.d)}: ${fmt(x.t)} из ${fmt(x.g)}</title></rect>
      <line x1="${X}" x2="${X + bw - pad}" y1="${gy}" y2="${gy}" stroke="var(--text)" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>`;
  }).join('');
  const labels = histRange === 7 ? list.map((x, i) => `<text x="${i * bw + bw / 2}" y="${H + 18}" text-anchor="middle" font-size="12" fill="var(--muted)">${WEEK[(parseIso(x.d).getDay() + 6) % 7]}</text>`).join('') : '';

  const ws = Object.entries(S.weights).sort((a, b) => a[0] < b[0] ? 1 : -1);
  let trend = '';
  if (ws.length > 1) {
    const [d1, w1] = ws[0], [d0, w0] = ws[Math.min(ws.length - 1, 8)];
    const days = (parseIso(d1) - parseIso(d0)) / 864e5;
    if (days >= 7) {
      const perMonth = (w1 - w0) / days * 30;
      trend = `${perMonth >= 0 ? '+' : '−'}${dec(Math.abs(perMonth))} кг в месяц`;
    }
  }
  $('#app').innerHTML = `<div class="view">
    <div class="top"><h1>История</h1></div>
    <div class="seg" id="seg"><span class="thumb"></span>
      <button data-r="7" aria-pressed="${histRange === 7}">7 дней</button>
      <button data-r="30" aria-pressed="${histRange === 30}">30 дней</button></div>
    <div class="card">
      <h3>Калории</h3><div class="hint">Чёрточка — норма дня</div>
      <div class="stats">
        <div class="stat"><div class="v num">${logged.length ? fmt(avg) : '—'}</div><div class="l">в среднем</div></div>
        <div class="stat"><div class="v num">${inNorm} из ${logged.length}</div><div class="l">дней в норме</div></div>
        <div class="stat"><div class="v num">${logged.length}</div><div class="l">дней записано</div></div>
      </div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H + (labels ? 24 : 4)}" preserveAspectRatio="none" role="img" aria-label="Калории по дням">${bars}${labels}</svg></div>
      <div class="legend"><span style="--dot:var(--low)">меньше нормы</span><span style="--dot:var(--ok)">в норме</span><span style="--dot:var(--high)">больше</span></div>
    </div>
    <div class="card">
      <h3>Вес</h3><div class="hint">Для роста — плюс 0,5–0,8 кг в месяц. Взвешивайся утром натощак.</div>
      <div class="stats">
        <div class="stat"><div class="v num">${ws.length ? dec(ws[0][1]) : '—'}</div><div class="l">кг сейчас</div></div>
        <div class="stat" style="grid-column: span 2"><div class="v num">${trend || '—'}</div><div class="l">темп</div></div>
      </div>
      <div class="row-btns"><button class="btn" id="addW">Записать вес</button></div>
      <div class="wlist">${ws.slice(0, 8).map(([d, w]) => `<div class="wrow"><span>${dateTitle(d)}</span><span class="num">${dec(w)} кг</span></div>`).join('')}</div>
    </div>

  placeThumb();
  $('#seg').onclick = e => { const b = e.target.closest('button'); if (b) { histRange = +b.dataset.r; buzz(); renderHistory(); } };

let onSheetClose = null;
function openSheet(title, html, after) {
  const sh = $('#sheet'), sc = $('#scrim');
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = html;
  $('#sheetBody').scrollTop = 0;
  if (sh.hidden) {
    sh.hidden = sc.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sh.classList.add('on'); sc.classList.add('on'); }));
  } else { sh.classList.add('on'); sc.classList.add('on'); } // открыли снова, пока прошлый лист уезжал
  after && after($('#sheetBody'));
}
function closeSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  if (sh.hidden) return;
  sh.style.transform = '';
  sh.classList.remove('on'); sc.classList.remove('on');
  setTimeout(() => { if (!sh.classList.contains('on')) sh.hidden = sc.hidden = true; }, 420);
  if (document.activeElement) document.activeElement.blur();
  const f = onSheetClose; onSheetClose = null; f && f();
}
$('#scrim').onclick = closeSheet;
$('#sheetClose').onclick = closeSheet;
(() => { // лист тянется вниз пальцем
  const sh = $('#sheet'); let y0 = null, dy = 0;
  const start = e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; };
  const move = e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 110) closeSheet(); else sh.style.transform = ''; };
  for (const el of [sh.querySelector('.grab'), sh.querySelector('.head')]) {
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchmove', move, { passive: true });
    el.addEventListener('touchend', end);
  }
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function allFoods() {

    const unit = u ? { name: u.split('=')[0], g: +u.split('=')[1] } : null;

      if (!s) {
        const rec = S.recent.slice(0, 8);
        if (rec.length) html += `<div class="group-t">Недавние</div>` + rec.map((f, i) => row(f, 'r' + i, f.g ? `${fmt(f.g)} г · ${fmt(f.kcal * f.g / 100)} ккал` : `${fmt(f.kcal)} ккал`)).join('');
        html += `<div class="group-t">Все продукты</div>` + foods.map((f, i) => row(f, i)).join('');
      } else {
        const words = s.split(/[\s,()]+/).filter(Boolean); // «рис сух» найдёт «Рис белый (сухой)»
        const hit = foods.map((f, i) => ({ f, i, n: norm(f.name) })).filter(x => words.every(w => x.n.includes(w)))
          .sort((a, b) => (b.n.startsWith(s) - a.n.startsWith(s)) || a.n.localeCompare(b.n));
        html = hit.length ? hit.map(x => row(x.f, x.i)).join('') : `<div class="empty-row">Такого нет в базе. Добавь «Свой продукт» — по этикетке.</div>`;

function openPortion(food, meal, item, grams) {
  let g = item ? item.g : grams || (food.unit ? food.unit.g : 100);
  const per = food.per100 || food;
  const units = [];
  if (food.unit) units.push([`${food.unit.name} · ${food.unit.g} г`, food.unit.g]);
  for (const x of [50, 100, 150, 200, 300]) if (!food.unit || x !== food.unit.g) units.push([`${x} г`, x]);
  const html = `<div class="portion">
    <div class="title">${esc(food.name)}</div><div class="per num">${macroLine(per)} на 100 г</div>
    <div class="grams"><button id="minus" aria-label="Меньше">−</button>
      <span class="box"><input id="g" class="num" inputmode="decimal" value="${g}" aria-label="Граммы"><span class="u">г</span></span>
      <button id="plus" aria-label="Больше">+</button></div>
    <div class="chips" id="units">${units.map(([n, v]) => `<button class="chip" data-g="${v}">${n}</button>`).join('')}</div>
    <div class="result num" id="res"></div>
    <button class="btn" id="ok">${item ? 'Сохранить' : 'Добавить · ' + MEALS.find(x => x[0] === meal)[1]}</button>
    ${item ? `<button class="btn danger" id="del">Удалить</button>` : ''}
  </div>`;
  openSheet(item ? 'Изменить' : 'Порция', html, body => {
    const inp = $('#g', body), res = $('#res', body);
    const calc = () => {
      inp.style.width = Math.max(1.6, String(inp.value).length + 0.4) + 'ch';
      const k = num(inp.value) / 100;
      res.innerHTML = `<div><b>${fmt(per.kcal * k)}</b><span>ккал</span></div><div><b>${Math.round(per.p * k)}</b><span>белки</span></div>
        <div><b>${Math.round(per.f * k)}</b><span>жиры</span></div><div><b>${Math.round(per.c * k)}</b><span>углеводы</span></div>`;
    };
    const set = v => { inp.value = Math.max(0, Math.round(v)); calc(); buzz(); };
    calc();
    inp.oninput = calc;
    inp.onfocus = () => inp.select();
    $('#minus', body).onclick = () => set(num(inp.value) - 10);
    $('#plus', body).onclick = () => set(num(inp.value) + 10);
    $('#units', body).onclick = e => { const b = e.target.closest('[data-g]'); if (b) set(+b.dataset.g); };
    $('#ok', body).onclick = () => {
      const gr = num(inp.value);
      if (gr <= 0) { toast('Укажи граммы'); inp.focus(); return; }
      const k = gr / 100;
      const data = { name: food.name, g: gr, kcal: per.kcal * k, p: per.p * k, f: per.f * k, c: per.c * k,
        per100: { kcal: per.kcal, p: per.p, f: per.f, c: per.c }, unit: food.unit || null };
      if (item) { Object.assign(item, data); save(); closeSheet(); renderToday(false); toast('Сохранено'); }
      else addItem(meal, data);
    };
    if (item) $('#del', body).onclick = () => deleteItem(item);
  });
}

function addItem(meal, data) {
  const d = S.days[cur] = day(cur);
  const it = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), meal }, data);
  d.items.push(it);
  const per = data.per100 || { kcal: data.kcal, p: data.p, f: data.f, c: data.c };
  S.recent = [{ name: data.name, g: data.g || 0, unit: data.unit || null, ...per }].concat(S.recent.filter(r => r.name !== data.name)).slice(0, 20);
  save(); buzz(); closeSheet(); renderToday(false);
  toast(`Добавлено · ${fmt(data.kcal)} ккал`);
}
function deleteItem(item) {
  const d = day(cur), i = d.items.indexOf(item);
  d.items.splice(i, 1); save(); closeSheet(); renderToday(false);
  toast('Удалено', 'Вернуть', () => { d.items.splice(i, 0, item); S.days[cur] = d; save(); renderToday(false); });
}
function openItem(id) {
  const it = day(cur).items.find(i => i.id === id); if (!it) return;
  if (it.per100) openPortion({ name: it.name, per100: it.per100, unit: it.unit }, it.meal, it);
  else openQuick(it.meal, it);
}

function openCustom(meal) {
  const html = `<div class="form">
    <div class="field col"><label for="cn">Название</label><input id="cn" class="wide" placeholder="Например, йогурт Активиа" autocomplete="off"></div>
    <div class="field"><label for="ck">Ккал на 100 г</label><input id="ck" inputmode="decimal"></div>
    <div class="field"><label for="cp">Белки, г</label><input id="cp" inputmode="decimal"></div>
    <div class="field"><label for="cf">Жиры, г</label><input id="cf" inputmode="decimal"></div>
    <div class="field"><label for="cc">Углеводы, г</label><input id="cc" inputmode="decimal"></div>
    <div class="field"><label for="cu">Порция, г (если есть)</label><input id="cu" inputmode="decimal"></div>
    <p class="note">Цифры — с этикетки, столбец «на 100 г». Продукт сохранится в базе.</p>
    <button class="btn" id="csave">Сохранить и выбрать порцию</button></div>`;
  openSheet('Свой продукт', html, body => {
    $('#csave', body).onclick = () => {
      const name = $('#cn', body).value.trim(), kcal = num($('#ck', body).value);
      if (!name) { toast('Напиши название'); $('#cn', body).focus(); return; }
      if (kcal <= 0) { toast('Укажи ккал на 100 г'); $('#ck', body).focus(); return; }
      const ug = num($('#cu', body).value);
      const f = { name, kcal, p: num($('#cp', body).value), f: num($('#cf', body).value), c: num($('#cc', body).value), unit: ug > 0 ? { name: 'порция', g: ug } : null };
      S.custom = [f].concat(S.custom.filter(x => x.name !== name)); save();
      openPortion(f, meal);
    };
  });
}
function openQuick(meal, item) {
  const v = k => item ? Math.round(item[k]) : '';
  const html = `<div class="form">
    <div class="field col"><label for="qn">Что съел</label><input id="qn" class="wide" placeholder="Например, обед в столовой" value="${item ? esc(item.name) : ''}" autocomplete="off"></div>
    <div class="field"><label for="qk">Ккал</label><input id="qk" inputmode="decimal" value="${v('kcal')}"></div>
    <div class="field"><label for="qp">Белки, г</label><input id="qp" inputmode="decimal" value="${v('p')}" placeholder="—"></div>
    <div class="field"><label for="qf">Жиры, г</label><input id="qf" inputmode="decimal" value="${v('f')}" placeholder="—"></div>
    <div class="field"><label for="qc">Углеводы, г</label><input id="qc" inputmode="decimal" value="${v('c')}" placeholder="—"></div>
    <button class="btn" id="qsave">${item ? 'Сохранить' : 'Добавить · ' + MEALS.find(x => x[0] === meal)[1]}</button>
    ${item ? `<button class="btn danger" id="qdel">Удалить</button>` : ''}</div>`;
  openSheet(item ? 'Изменить' : 'Только калории', html, body => {
    $('#qsave', body).onclick = () => {
      const kcal = num($('#qk', body).value);
      if (kcal <= 0) { toast('Укажи калории'); $('#qk', body).focus(); return; }
      const data = { name: $('#qn', body).value.trim() || 'Без названия', g: 0, kcal, p: num($('#qp', body).value), f: num($('#qf', body).value), c: num($('#qc', body).value) };
      if (item) { Object.assign(item, data); save(); closeSheet(); renderToday(false); toast('Сохранено'); }
      else addItem(meal, data);
    };
    if (item) $('#qdel', body).onclick = () => deleteItem(item);
  });
}

function openWeight() {
  const last = Object.entries(S.weights).sort().pop();
  const html = `<div class="portion">
    <div class="grams"><span class="box"><input id="w" class="num" inputmode="decimal" value="${last ? dec(last[1]) : ''}" placeholder="58" aria-label="Вес, кг"><span class="u">кг</span></span></div>
    <p class="note" style="text-align:center">Утром, после туалета, до еды. Записывается на сегодня.</p>
    <button class="btn" id="wsave">Сохранить вес</button></div>`;
  openSheet('Вес', html, body => {
    const inp = $('#w', body); inp.onfocus = () => inp.select();
    const fit = () => inp.style.width = Math.max(2.4, String(inp.value || inp.placeholder).length + 0.4) + 'ch';
    inp.oninput = fit; fit();
    $('#wsave', body).onclick = () => {
      const w = num(inp.value);
      if (w < 25 || w > 200) { toast('Проверь вес'); inp.focus(); return; }
      S.weights[today()] = r1(w); save(); closeSheet(); renderHistory(); toast('Вес сохранён');
    };
  });
}

function openSettings() {
  const goal = (t, n) => `<div class="card"><h3>${n}</h3>
    ${[['kcal', 'Калории'], ['p', 'Белки, г'], ['f', 'Жиры, г'], ['c', 'Углеводы, г']].map(([k, l]) =>
      `<div class="field"><label for="g-${t}-${k}">${l}</label><input id="g-${t}-${k}" data-t="${t}" data-k="${k}" inputmode="numeric" value="${S.goals[t][k]}"></div>`).join('')}</div>`;
  const html = `${goal('train', 'Норма в день тренировки')}${goal('rest', 'Норма в день отдыха')}
    <div class="card"><h3>Дни тренировок</h3><div class="hint">В эти дни сразу стоит «Тренировка». Переключить можно на главной.</div>
      <div class="days" id="days">${WEEK.map((w, i) => `<button data-d="${i}" aria-pressed="${S.trainDays.includes(i)}">${w}</button>`).join('')}</div></div>
    <div class="card"><h3>Данные</h3><div class="hint">Всё хранится только на этом устройстве. Копию можно скачать и загрузить на другом.</div>
      <div class="row-btns"><button class="btn ghost" id="exp">Скачать копию</button><button class="btn ghost" id="imp">Загрузить</button></div>
      <input type="file" id="file" accept="application/json,.json" hidden>
      <button class="btn danger" id="wipe" style="margin-top:8px">Удалить все записи</button></div>
    <p class="note">Состав продуктов — средние значения из таблиц. Значок ≈ — готовое блюдо, его калорийность сильно разная. Для упаковок точнее этикетка.</p>`;
  openSheet('Настройки', html, body => {
    body.querySelectorAll('[data-t]').forEach(inp => inp.onchange = () => {
      const v = Math.round(num(inp.value));
      if (v > 0) { S.goals[inp.dataset.t][inp.dataset.k] = v; save(); toast('Сохранено'); } else inp.value = S.goals[inp.dataset.t][inp.dataset.k];
    });
    $('#days', body).onclick = e => {
      const b = e.target.closest('[data-d]'); if (!b) return;
      const i = +b.dataset.d, on = S.trainDays.includes(i);
      S.trainDays = on ? S.trainDays.filter(x => x !== i) : S.trainDays.concat(i).sort();
      b.setAttribute('aria-pressed', !on); save(); buzz();
    };
    $('#exp', body).onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
      a.download = `kalorii-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    $('#imp', body).onclick = () => $('#file', body).click();
    $('#file', body).onchange = async e => {
      try {
        const x = JSON.parse(await e.target.files[0].text());
        if (!x || !x.goals || !x.days) throw 0;
        S = Object.assign(structuredClone(DEFAULT), x); save(); closeSheet(); render(); toast('Копия загружена');
      } catch (err) { toast('Это не копия из «Калорий»'); }
    };
    $('#wipe', body).onclick = () => {
      if (!confirm('Удалить всю еду и вес? Нормы останутся.')) return;
      S.days = {}; S.weights = {}; S.recent = []; save(); closeSheet(); render(); toast('Записи удалены');
    };
  });
  onSheetClose = () => view === 'today' && renderToday(false);
}

let toastT;
function toast(text, action, fn) {
  const t = $('#toast');
  t.textContent = text;
  t.style.pointerEvents = 'none';
  if (action) {
    const b = document.createElement('button');
    b.textContent = action; b.style.cssText = 'margin-left:12px;color:var(--accent);font-weight:700';
    b.onclick = () => { fn(); t.classList.remove('on'); };
    t.appendChild(b); t.style.pointerEvents = 'auto';
  }
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 4000 : 1800);
}

function render() {
  document.querySelectorAll('.tab').forEach(t => t.dataset.tab === view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  view === 'today' ? renderToday(true) : renderHistory();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { if (view !== t.dataset.tab) { view = t.dataset.tab; buzz(); render(); } });
$('#fab').onclick = () => { if (view !== 'today') { view = 'today'; cur = today(); render(); } buzz(); openAdd(); };
addEventListener('resize', placeThumb);
let onToday = true;
document.addEventListener('visibilitychange', () => { // открыли на следующий день — показать новый день
  if (document.hidden) { onToday = cur === today(); return; }
  if (onToday && cur !== today() && view === 'today' && !$('#sheet').classList.contains('on')) { cur = today(); shown.left = null; renderToday(true); }
});
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
