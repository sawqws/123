<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Будильник">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="Умный будильник: будит в лёгком сне по твоим циклам из WHOOP и движению телефона">
<title>Будильник</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* «Будильник» — ночной сайт: всегда тёмный (светлый экран ночью будит), чистый чёрный фон (OLED гасит пиксели),
   тёплый белый текст без синевы. Синий WHOOP «сон» — циклы, янтарь — окно пробуждения и рассвет. */
:root {
  --black: #000;
  --ink: #f4eee6;
  --mute: rgba(244, 238, 230, .58);
  --faint: rgba(244, 238, 230, .34);
  --line: rgba(244, 238, 230, .1);
  --surface: #131418;
  --surface2: #1d1e24;
  --sleep: #7ba1bb;
  --deep: #3f5f7d;
  --ember: #ffb067;
  --ember-ink: #1c1206;
  --rose: #d0606f;
  --ok: #16ec06;
  --mid: #ffde00;
  --bad: #ff0026;
  --r-lg: 26px;
  --r-md: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, "Segoe UI", system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--black); color: var(--ink); }
body { font: 400 16px/1.4 var(--font); min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 10px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ── главный экран ── */
#app { min-height: 100vh; min-height: 100dvh; padding: calc(var(--st) + 10px) calc(var(--sr) + 16px) calc(var(--sb) + 24px) calc(var(--sl) + 16px);
  max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.top h1 { font: 600 17px/1 var(--display); margin: 0; flex: 1; letter-spacing: -.01em; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--ember); text-decoration: none; font-size: 17px;
  min-height: 44px; padding-right: 10px; }
.back svg { width: 12px; height: 20px; }
.ibtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--mute);
  transition: background .2s, color .2s; }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { background: var(--surface2); }
@media (hover: hover) { .ibtn:hover { background: var(--surface); color: var(--ink); } }

.grid { flex: 1; display: grid; gap: 22px; align-content: start; padding-top: 6px; }
.lead { margin: 6px 0 0; color: var(--mute); font-size: 15px; }
.hero { container-type: inline-size; min-width: 0; }
.win { font: 200 min(16.5cqi, 116px)/1 var(--display); letter-spacing: -.035em; margin: 4px 0 0;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.win .dash { color: var(--faint); margin: 0 .04em; font-weight: 200; }
.win .to { color: var(--ember); }
.sub { margin: 12px 0 0; color: var(--ink); font-size: 16px; max-width: 34em; }
.sub b { font-weight: 600; }

.sky { margin: 22px 0 0; position: relative; }
.sky svg { display: block; width: 100%; height: auto; overflow: hidden; }
.sky .lbl { position: relative; height: 18px; margin-top: 6px; font-size: 12px; color: var(--faint); }
.sky .lbl span { position: absolute; top: 0; white-space: nowrap; transform: translateX(-50%); }
.sky .lbl span:first-child { transform: none; left: 0 !important; }
.sky .lbl span:last-child { transform: translateX(-100%); left: 100% !important; color: var(--ember); }
.sky figcaption { margin-top: 8px; font-size: 13px; color: var(--mute); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--mute); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.beds { margin-top: 18px; display: grid; gap: 2px; }
.bed { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.bed .t { font: 300 26px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 2.9em; letter-spacing: -.02em; }
.bed .d { color: var(--mute); font-size: 14px; flex: 1; }
.bed .tag { font-size: 12px; color: var(--sleep); white-space: nowrap; }
.bed .tag.low { color: var(--faint); }

.group { background: var(--surface); border-radius: var(--r-lg); padding: 4px 16px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.row + .row { border-top: 1px solid var(--line); }
.row > .k { flex: 1; font-size: 16px; }
.row > .k small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.row .link2 { color: var(--ember); font-size: 13px; padding: 4px 0; min-height: 36px; }

.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 20px; background: var(--surface2); font-size: 22px; line-height: 1;
  display: grid; place-items: center; transition: transform .12s, background .2s; }
.step button:active { transform: scale(.92); }
@media (hover: hover) { .step button:hover { background: #2a2b33; } }
.tbox { position: relative; }
.tbox .tv { font: 300 28px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 3.1em; text-align: center;
  padding: 6px 4px; border-radius: 12px; letter-spacing: -.02em; display: block; }
.tbox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0;
  font-size: 16px; }
.tbox:focus-within .tv { outline: 2px solid var(--ember); outline-offset: 2px; }

.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 2px; gap: 2px; }
.seg button { min-height: 36px; min-width: 44px; padding: 0 10px; border-radius: 10px; font-size: 14px; color: var(--mute);
  transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: #3a3b44; color: var(--ink); font-weight: 500; }
.play { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--surface2); color: var(--ember); }
.play svg { width: 16px; height: 16px; }

.sw { position: relative; width: 51px; height: 31px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 16px; background: #39393d; transition: background .25s; }
.sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .3); transition: transform .25s cubic-bezier(.3, .7, .4, 1.2); }
.sw input:checked + span { background: var(--ember); }
.sw input:checked + span::after { transform: translateX(20px); }
.sw input:focus-visible + span { outline: 2px solid var(--ember); outline-offset: 2px; }

.forma { background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; display: block; width: 100%; text-align: left; }
.forma .h { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); }
.forma .h .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--sleep); }
.forma .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.forma .stats b { display: block; font: 300 24px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.forma .stats span { font-size: 12px; color: var(--mute); }
.forma .note { margin-top: 10px; font-size: 13px; color: var(--mute); }
.forma.pair { display: flex; align-items: center; gap: 12px; min-height: 64px; transition: background .2s; }
.forma.pair .k { flex: 1; }
.forma.pair .k small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.forma.pair:active { background: var(--surface2); }
.chev { width: 8px; height: 14px; color: var(--faint); flex: none; }

.go { display: block; width: 100%; min-height: 56px; border-radius: 28px; background: var(--ember); color: var(--ember-ink);
  font: 600 18px/1 var(--display); letter-spacing: -.01em; transition: transform .15s, filter .2s; }
.go:active { transform: scale(.97); filter: brightness(.92); }
@media (hover: hover) { .go:hover { filter: brightness(1.06); } }
.go[disabled] { opacity: .5; }
.lnk { display: block; margin: 12px auto 0; color: var(--mute); font-size: 14px; min-height: 40px; padding: 0 12px; }
@media (hover: hover) { .lnk:hover { color: var(--ink); } }
.side { display: grid; gap: 14px; align-content: start; }
.hint { font-size: 13px; color: var(--mute); text-align: center; margin: -2px 8px 0; }

@media (min-width: 720px) {
  #app { padding-left: calc(var(--sl) + 32px); padding-right: calc(var(--sr) + 32px); }
  .grid { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 48px; align-content: center; padding-bottom: 24px; }
  .side { padding-top: 28px; }
}
@media (min-width: 720px) and (max-height: 520px) {
  .win { font-size: min(16.5cqi, 21vh); }
  .grid { align-content: start; }
}

/* ── ночь ── */
.night { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: calc(var(--st) + 20px) 24px calc(var(--sb) + 24px); user-select: none;
  -webkit-user-select: none; touch-action: manipulation; }
.night .face { transition: opacity 1.2s ease, transform 2s ease; }
.night.dim .face { opacity: .16; }
.night .nclock { font: 200 clamp(64px, 22vw, 132px)/1 var(--display); color: var(--ember); opacity: .62; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; }
.night .nline { margin-top: 14px; color: rgba(255, 176, 103, .55); font-size: 17px; }
.night .nstat { margin-top: 8px; color: rgba(244, 238, 230, .34); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.night .nstat i { width: 6px; height: 6px; border-radius: 3px; background: rgba(123, 161, 187, .7); transition: transform .3s, background .3s; }
.night .nstat i.pulse { transform: scale(1.8); background: var(--sleep); }
.night .nwarn { margin-top: 18px; max-width: 22em; color: rgba(255, 176, 103, .7); font-size: 14px; }
.night .nact { position: absolute; left: 0; right: 0; bottom: calc(var(--sb) + 22px); display: flex; justify-content: center; gap: 10px;
  transition: opacity .6s; }
.night.dim .nact { opacity: 0; pointer-events: none; }
.night .nact button { min-height: 44px; padding: 0 20px; border-radius: 22px; background: #141416; color: rgba(244, 238, 230, .6); font-size: 15px; }
.night .resume { margin-top: 26px; }

/* ── рассвет ── */
.alarm { position: fixed; inset: 0; z-index: 30; overflow: hidden; background: #07060f; display: flex; flex-direction: column;
  align-items: center; justify-content: space-between; text-align: center;
  padding: calc(var(--st) + 12vh) 24px calc(var(--sb) + 28px); }
.alarm .sky2 { position: absolute; inset: 0; background: linear-gradient(180deg, #120d2c 0%, #3b1f4a 34%, #a24a62 64%, #f08a5d 84%, #ffc785 100%);
  opacity: 0; transition: opacity 70s linear; }
.alarm .sun { position: absolute; left: 50%; bottom: -46vmax; width: 92vmax; height: 92vmax; margin-left: -46vmax; border-radius: 50%;
  background: radial-gradient(circle, #fff3d9 0%, #ffd79a 18%, rgba(255, 176, 103, .55) 38%, rgba(255, 140, 90, 0) 66%);
  transform: translateY(40vmax); opacity: .2; transition: transform 90s cubic-bezier(.25, .1, .25, 1), opacity 30s ease; }
.alarm.rise .sky2 { opacity: 1; }
.alarm.rise .sun { transform: translateY(6vmax); opacity: 1; }
.alarm > div { position: relative; }
.alarm .aclock { font: 200 clamp(84px, 28vw, 168px)/1 var(--display); letter-spacing: -.045em; font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 30px rgba(0, 0, 0, .25); }
.alarm .agreet { font: 500 24px/1.2 var(--display); margin-top: 10px; }
.alarm .awhy { margin: 10px auto 0; max-width: 22em; color: rgba(255, 245, 235, .82); font-size: 16px; }
.alarm .acts { width: 100%; max-width: 380px; }
.alarm .go { background: #140d22; color: #fff1dd; }
.alarm .lnk { color: #2a1430; font-weight: 500; }

/* ── лист ── */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet .bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); opacity: 0; transition: opacity .3s; }
.sheet .pn { position: relative; width: 100%; max-height: 88vh; max-height: 88dvh; overflow: auto; overscroll-behavior: contain;
  background: #17181d; border-radius: 26px 26px 0 0; padding: 8px 20px calc(var(--sb) + 22px);
  transform: translateY(102%); transition: transform .38s cubic-bezier(.2, .8, .2, 1); }
.sheet.on .bg { opacity: 1; }
.sheet.on .pn { transform: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: #3a3b42; margin: 0 auto 10px; }
.sheet h2 { font: 600 22px/1.2 var(--display); margin: 8px 0 12px; letter-spacing: -.01em; }
.sheet p { color: var(--mute); margin: 0 0 12px; }
.sheet .x { position: absolute; right: 12px; top: 12px; }
@media (min-width: 700px) {
  .sheet { align-items: center; }
  .sheet .pn { width: 460px; border-radius: 26px; transform: translateY(24px) scale(.97); opacity: 0;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .25s; padding-bottom: 24px; }
  .sheet.on .pn { transform: none; opacity: 1; }
  .sheet .grab { display: none; }
}
.steps { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps li svg { width: 22px; height: 22px; flex: none; color: var(--ember); margin-top: 1px; }
.steps li span { color: var(--ink); }
.steps li small { display: block; color: var(--mute); font-size: 14px; margin-top: 2px; }
.code { width: 100%; min-height: 56px; border-radius: 16px; border: 1px solid #34353c; background: #0e0f12; padding: 0 16px;
  font: 300 28px/1 var(--display); letter-spacing: .2em; text-align: center; margin: 4px 0 14px; }
.code:focus { outline: 2px solid var(--ember); outline-offset: 1px; }
.err { color: #ff8a8a; font-size: 14px; min-height: 20px; margin: -6px 0 10px; }
.hist { display: grid; }
.hist button { display: flex; align-items: center; gap: 12px; min-height: 60px; text-align: left; border-top: 1px solid var(--line); }
.hist button:first-child { border-top: 0; }
.hist .d { flex: 1; }
.hist .d small { display: block; color: var(--mute); font-size: 13px; margin-top: 2px; }
.hist .m { font: 300 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.ns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.ns b { display: block; font: 300 26px/1.1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.ns span { color: var(--mute); font-size: 12px; }
.empty { color: var(--mute); padding: 18px 0; }

.toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 24px); z-index: 60; max-width: min(92vw, 420px);
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: rgba(40, 40, 46, .92); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px); padding: 12px 18px; border-radius: 18px; font-size: 15px; text-align: center;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .alarm .sky2 { opacity: 1; }
  .alarm .sun { transform: translateY(6vmax); opacity: 1; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="back" id="back" href="/" hidden><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Форма</a>
    <h1>Будильник</h1>
    <button class="ibtn" id="histBtn" aria-label="Прошлые ночи" title="Прошлые ночи"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
  </header>
  <main class="grid">
    <section class="hero" aria-live="polite">
      <p class="lead">Разбужу в лёгком сне</p>
      <div class="win num" id="win"><span id="wFrom">06:25</span><span class="dash">–</span><span class="to" id="wTo">06:45</span></div>
      <p class="sub" id="heroSub"></p>
      <figure class="sky" id="sky"></figure>
      <div class="beds" id="beds"></div>
    </section>
    <section class="side">
      <div class="group">
        <div class="row">
          <div class="k">Подъём<small id="wakeSrc"></small></div>
          <div class="step">
            <button id="wMinus" aria-label="На 5 минут раньше">−</button>
            <label class="tbox"><span class="tv" id="wakeTv">06:45</span><input type="time" id="wakeIn" step="300" aria-label="Время подъёма"></label>
            <button id="wPlus" aria-label="На 5 минут позже">+</button>
          </div>
        </div>
        <div class="row">
          <div class="k">Окно<small>минут до подъёма</small></div>
          <div class="seg" id="winSeg" role="group" aria-label="Окно пробуждения">
            <button data-v="10">10</button><button data-v="20">20</button><button data-v="30">30</button><button data-v="45">45</button>
          </div>
        </div>
        <div class="row">
          <div class="k">Мелодия</div>
          <div class="seg" id="sndSeg" role="group" aria-label="Мелодия">
            <button data-v="dawn">Рассвет</button><button data-v="chime">Звон</button>
          </div>
          <button class="play" id="preview" aria-label="Послушать мелодию"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5Z"/></svg></button>
        </div>
        <div class="row">
          <label class="k" for="micSw">Слушать звуки<small>Если телефон не на кровати</small></label>
          <span class="sw"><input type="checkbox" id="micSw" role="switch"><span></span></span>
        </div>
      </div>
      <div id="forma"></div>
      <button class="go" id="go">Спать</button>
      <p class="hint" id="goHint"></p>
      <button class="lnk" id="howBtn">Как положить телефон</button>
    </section>
  </main>
</div>

<div class="night" id="night" hidden>
  <div class="face" id="face">
    <div class="nclock" id="nclock">00:00</div>
    <div class="nline" id="nline"></div>
    <div class="nstat" id="nstat"><i id="ndot"></i><span id="nstatT"></span></div>
    <div class="nwarn" id="nwarn" hidden></div>
    <button class="go resume" id="resume" hidden>Продолжить ночь</button>
  </div>
  <div class="nact"><button id="nOff">Выключить</button></div>
</div>

<div class="alarm" id="alarm" hidden>
  <div class="sky2"></div><div class="sun"></div>
  <div>
    <div class="aclock" id="aclock">06:31</div>
    <div class="agreet">Доброе утро</div>
    <div class="awhy" id="awhy"></div>
  </div>
  <div class="acts">
    <button class="go" id="upBtn">Я встал</button>
    <button class="lnk" id="snoozeBtn">Ещё 5 минут</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="bg" id="shBg"></div>
  <div class="pn" id="shPn"><div class="grab"></div>
    <button class="ibtn x" id="shX" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div id="shBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

    return { from, wakeAt, onset, ends: bs, onCycle: i >= 0, pred: i >= 0 ? bs[i] : wakeAt, k: i >= 0 ? i + 1 : bs.length };
  }

    estOnset() { return this.onset || this.start + this.latency * MIN; }

})();

  openSheet(`<h2 id="shT">${fresh ? 'Доброе утро' : 'Ночь ' + nightName(r)}</h2>
    <p>Проснулся в ${esc(r.woke)} ${esc(WHY[r.reason] || '')}</p>
    <div class="ns"><div><b class="num">${dur(r.minutes)}</b><span>сна (оценка)</span></div><div><b class="num">${esc(r.onset)}</b><span>уснул</span></div><div><b class="num">${r.moves}</b><span>${plural(r.moves, 'движение', 'движения', 'движений')}</span></div></div>
    <figure class="sky" style="margin-top:14px">${nightSVG(r)}<div class="lbl num"><span style="left:0">${esc(r.start)}</span><span style="left:100%">${esc(r.woke)}</span></div>
    <div class="legend"><span><i style="background:#3f5f7d"></i>спокойно</span><span><i style="background:#7ba1bb"></i>ворочался</span><span><i style="background:#e8dccb"></i>не спал</span></div>
    <figcaption>По движению телефона — примерно. Точные фазы — в WHOOP.</figcaption></figure>
    <button class="go" id="nsOk" style="margin-top:18px">Готово</button>`);
  $('#nsOk').onclick = closeSheet;
}
function openHist() {
  const h = ls.get('wake.nights', []);
  openSheet(`<h2 id="shT">Прошлые ночи</h2>${h.length ? `<div class="hist">${h.map((r, i) => `<button data-i="${i}"><span class="d">${nightName(r)}<small>${esc(r.onset)} → ${esc(r.woke)} · ${esc(WHY[r.reason] || '')}</small></span><span class="m">${dur(r.minutes)}</span>${ICON.chev}</button>`).join('')}</div>`
    : '<p class="empty">Здесь будут ночи с будильником: во сколько уснул, когда разбудил и почему.</p>'}`);
  document.querySelectorAll('.hist button').forEach(b => b.onclick = () => { const r = h[+b.dataset.i]; shOpen = false; showNightSheet(r, false); });
}
let toastT = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ═════════ События ═════════ */
function setWake(v, own = true) {
  if (!mins(v)) return;
  cfg.wake = v; if (own) { cfg.src = 'own'; cfg.day = (fd() && fd().plan && fd().plan.day) || null; }
  saveCfg(); renderMain();
}
$('#wMinus').onclick = () => setWake(toHM(mins(cfg.wake) - 5));
$('#wPlus').onclick = () => setWake(toHM(mins(cfg.wake) + 5));
$('#wakeIn').onchange = e => setWake(e.target.value);
$('#wakeIn').onkeydown = e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); setWake(toHM(mins(cfg.wake) + (e.key === 'ArrowUp' ? 5 : -5))); } };
document.querySelectorAll('#winSeg button').forEach(b => b.onclick = () => { cfg.win = +b.dataset.v; saveCfg(); renderMain(); });
document.querySelectorAll('#sndSeg button').forEach(b => b.onclick = () => { cfg.snd = b.dataset.v; saveCfg(); renderMain(); setTimeout(() => prepare(cfg.snd).catch(() => {}), 50); });
$('#micSw').onchange = e => { cfg.mic = e.target.checked; saveCfg(); };
$('#preview').onclick = preview;
$('#go').onclick = () => { if (!cfg.how) openHow(goSleep); else goSleep(); };
$('#howBtn').onclick = () => openHow(null);
$('#histBtn').onclick = openHist;
$('#shBg').onclick = closeSheet; $('#shX').onclick = closeSheet;
$('#night').addEventListener('pointerdown', wakeFace);
$('#nOff').onclick = nightOff;
$('#upBtn').onclick = finishNight;
$('#snoozeBtn').onclick = snooze;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && shOpen) { e.preventDefault(); closeSheet(); }
  else if (!$('#night').hidden) wakeFace();
});
(() => {  // лист тянется вниз пальцем — закрыть
  const pn = $('#shPn'); let y0 = null, dy = 0;
  pn.addEventListener('touchstart', e => { y0 = pn.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  pn.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); pn.style.transition = 'none'; pn.style.transform = `translateY(${dy}px)`; }, { passive: true });
  pn.addEventListener('touchend', () => { if (y0 == null) return; pn.style.transition = ''; pn.style.transform = ''; if (dy > 90) closeSheet(); y0 = null; });
})();
document.addEventListener('visibilitychange', () => {
  if (!night || night.end) return;
  if (document.visibilityState === 'hidden') { hiddenAt = now(); return; }
  keepAwake();
  const gap = hiddenAt ? now() - hiddenAt : 0; hiddenAt = 0;
  if (gap > 2 * MIN) { lastEp = now(); toast('Экран гас — в это время я не слышал движений'); }
  nightTick();
});
setInterval(() => { if ($('#night').hidden && $('#alarm').hidden) renderMain(); }, 20000);
window.addEventListener('focus', () => { if (F && Date.now() - F.at > 15 * MIN && !night) refresh(); });

/* ═════════ Старт ═════════ */
(function takePair() {  // из Формы: …/wake/#pair=<токен>
  const m = /^#pair=([\w-]{16,128})$/.exec(location.hash);
  if (m) { setTok(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
})();
if (!location.hostname.endsWith('github.io') && !/^(localhost|127\.)/.test(location.hostname)) $('#back').hidden = false;  // внутри Формы — назад в Форму
applyPlan();
renderMain();
if (!resumeNight()) refresh(); else if (getTok()) refresh();
(window.requestIdleCallback || (f => setTimeout(f, 800)))(() => prepare(cfg.snd).catch(() => {}));
if ('serviceWorker' in navigator && !/^(localhost|127\.)/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__wake = { Core, jump: ms => { OFF += ms; }, night: () => night, S, cfg, sounds, AU };  // для проверки
</script>
</body>
