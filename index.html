<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style id="pwa">
/* приложение на весь экран: шапка уходит под статус-бар, низ — над полоской «Домой» */
.topbar { top: 0 !important; padding-top: calc(12px + env(safe-area-inset-top, 0px)) !important; }
[hidden] { display: none !important; }
</style>
<title>Ритм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Ритм: один шрифт (Onest), все цифры моноширинные (tabular-nums), мягкие карточки без рамок.
   Числа, которые меняются (счётчики, проценты, серии), стоят в ячейках фиксированной ширины — соседи не сдвигаются. */
:root {
  --bg: #f4f4f6;
  --surface: #ffffff;
  --surface-2: #efeff3;
  --surface-3: #e3e3ea;
  --line: rgba(20, 22, 30, .07);
  --line-2: rgba(20, 22, 30, .13);
  --fg: #15161a;
  --fg-2: #41444d;
  --muted: #7a7d88;
  --accent: #5b5ff0;
  --accent-ink: #4347d4;
  --on-accent: #ffffff;
  --good: #1fa463;
  --bad: #e5484d;
  --ice: #5fb4f0;
  --shadow: 0 1px 2px rgba(20, 22, 30, .04), 0 6px 20px rgba(20, 22, 30, .05);
  --font: "Onest", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --surface: #161619; --surface-2: #1f1f23; --surface-3: #2c2c32;
    --line: rgba(255, 255, 255, .06); --line-2: rgba(255, 255, 255, .12);
    --fg: #f3f3f5; --fg-2: #c7c7cf; --muted: #8a8a96;
    --accent: #8083ff; --accent-ink: #a7a9ff; --on-accent: #ffffff;
    --good: #3dd68c; --bad: #ff6369; --ice: #7cc4f5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #161619; --surface-2: #1f1f23; --surface-3: #2c2c32;
  --line: rgba(255, 255, 255, .06); --line-2: rgba(255, 255, 255, .12);
  --fg: #f3f3f5; --fg-2: #c7c7cf; --muted: #8a8a96;
  --accent: #8083ff; --accent-ink: #a7a9ff; --on-accent: #ffffff;
  --good: #3dd68c; --bad: #ff6369; --ice: #7cc4f5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- каркас ---------- */
.app { display: block; min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.logo { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.logo i { width: 4px; border-radius: 2px; background: var(--accent); }
.logo i:nth-child(1) { height: 40%; } .logo i:nth-child(2) { height: 100%; } .logo i:nth-child(3) { height: 65%; } .logo i:nth-child(4) { height: 85%; }
.toptabs { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
.toptabs button { height: 36px; padding: 0 16px; border-radius: 999px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; transition: background .2s, color .2s; }
.toptabs button svg { display: none; }
.toptabs button:hover { color: var(--fg); }
.toptabs button.on { background: var(--fg); color: var(--bg); }
.top-r { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); }
.round:hover { background: var(--surface-2); }
.sync { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.local i { background: var(--accent); }
.sync span { display: none; }
main { min-width: 0; padding: 8px 32px 120px; }
.wrap { max-width: 1080px; margin: 0 auto; }
.tabbar { display: none; }

/* ---------- шапка экрана ---------- */
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 8px 0 22px; }
.head .grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); }
.title { font-size: clamp(30px, 4.4vw, 40px); font-weight: 700; line-height: 1.1; letter-spacing: -.03em; margin-top: 2px; }
.btn {
  height: 42px; padding: 0 16px; border-radius: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent); color: var(--on-accent); transition: transform .15s var(--ease), filter .2s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.btn.danger { background: transparent; color: var(--bad); box-shadow: none; }
.btn.wide { width: 100%; justify-content: center; height: 50px; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--fg-2); }
.icon-btn:hover { background: var(--surface-2); }
.seg { display: inline-flex; padding: 4px; gap: 2px; border-radius: 14px; background: var(--surface-2); }
.seg button { height: 34px; padding: 0 13px; border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

/* ---------- сетки и секции ---------- */
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.sec { display: flex; align-items: baseline; gap: 8px; margin: 8px 2px 0; }
.sec h3 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.sec .n { color: var(--muted); font-size: 14px; font-weight: 500; }
.sec .sp { flex: 1; }
.link { color: var(--accent-ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.hint { color: var(--muted); font-size: 13px; text-align: center; margin: -8px 0 22px; }

/* ---------- кольцо и полосы ---------- */
.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .tr { stroke: var(--surface-3); }
.ring .vl { stroke: var(--c, var(--accent)); transition: stroke-dashoffset .7s var(--ease); }
.ring .lb { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--accent)); transition: width .6s var(--ease); }

/* ---------- сегодня: заголовок дня и лента ---------- */
.dayhead { display: flex; align-items: center; gap: 16px; margin: 6px 2px 14px; }
.dayhead .grow { flex: 1; min-width: 0; }
.dayhead h1 { font-size: clamp(30px, 4.4vw, 40px); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.dayhead p { margin: 2px 0 0; color: var(--muted); }
.strip { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -8px 22px; padding: 4px 8px; }
.strip::-webkit-scrollbar { display: none; }
.strip button { flex: 0 0 auto; width: 50px; padding: 8px 0 9px; border-radius: 25px; display: grid; justify-items: center; gap: 6px; color: var(--muted); transition: background .2s; }
.strip small { font-size: 12px; font-weight: 500; }
.strip .dn { position: relative; width: 36px; height: 36px; display: grid; place-items: center; font-size: 14px; color: var(--fg-2); }
.strip .dn svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.strip .dn .bg { fill: var(--surface); stroke: none; }
.strip .dn .arc { stroke: var(--good); stroke-width: 3; fill: none; }
.strip .dn b { position: relative; font-weight: 600; width: 2ch; text-align: center; }
.strip .fut .dn .bg { fill: transparent; }
.strip .today:not(.on) small { color: var(--accent-ink); font-weight: 700; }
.strip .on { background: var(--fg); color: var(--bg); }
.strip .on small { color: var(--bg); }
.strip .on .dn .bg { fill: color-mix(in srgb, var(--bg) 16%, transparent); }
.strip .on .dn .arc { stroke: var(--good); }
.strip .on .dn { color: var(--bg); }

/* ---------- группы и карточки привычек ---------- */
.groups { display: grid; gap: 22px; margin-bottom: 30px; }
.grp > header { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; }
.grp > header b { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.grp > header .n { color: var(--muted); font-size: 14px; font-weight: 500; min-width: 3.2ch; }
.grp > header .sp { flex: 1; }
.grp .fold { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); transition: transform .25s var(--ease); }
.grp .fold svg { width: 18px; height: 18px; }
.grp.closed .fold { transform: rotate(180deg); }
.grp.closed .hgrid { display: none; }
.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.hcard {
  position: relative; display: grid; gap: 12px; padding: 12px 12px 12px 12px; border-radius: var(--r); min-width: 0;
  background: var(--surface); box-shadow: var(--shadow); transition: background .3s var(--ease);
}
.hcard .row { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hcard .hic { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 25px; flex: none; background: color-mix(in srgb, var(--c) 15%, transparent); }
.hcard .nm { flex: 1; min-width: 0; text-align: left; display: grid; gap: 2px; }
.hcard .nm b { font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hcard .nm small { color: var(--muted); font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.hcard .nm small > span { overflow: hidden; text-overflow: ellipsis; }
.hcard .st { color: var(--fg-2); font-weight: 600; flex: none; }
.hcard .st.hot { color: var(--c); }
.hcard .st.miss { color: var(--bad); }
.hcard.done-card { background: color-mix(in srgb, var(--c) 11%, var(--surface)); }
.hcard.skip-card { opacity: .62; }
.check {
  width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative; touch-action: manipulation;
  border: 3px solid color-mix(in srgb, var(--c) 38%, transparent); color: var(--c); background: transparent;
  transition: background .25s var(--ease), transform .2s var(--spring), border-color .2s; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.check:active { transform: scale(.9); }
.check svg { width: 24px; height: 24px; stroke-width: 2.6; }
.check.done { background: var(--c); border-color: var(--c); color: #ffffff; }
.check.fail { background: var(--bad); border-color: var(--bad); color: #ffffff; }
.check.skip { border-style: dashed; border-color: var(--ice); color: var(--ice); }
.check.met { border-color: color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); }
.check .v { font-weight: 700; font-size: 16px; width: 3ch; text-align: center; color: var(--fg); }
.check .arc { position: absolute; inset: -3px; width: calc(100% + 6px); height: calc(100% + 6px); transform: rotate(-90deg); }
.check .arc circle { stroke: var(--c); stroke-width: 3; fill: none; stroke-linecap: round; transition: stroke-dashoffset .35s var(--ease); }
.pop { animation: pop .45s var(--spring); }
@keyframes pop { 40% { transform: scale(1.16); } }
.pop.done::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--c); animation: ripple .6s var(--ease) forwards; pointer-events: none; }
@keyframes ripple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
.notday { font-size: 12.5px; color: var(--muted); flex: none; }
.grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); grid-template-rows: repeat(7, auto); gap: 3px; }
.grid i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); }
.grid i.h1 { background: color-mix(in srgb, var(--c) 30%, var(--surface-2)); }
.grid i.h2 { background: color-mix(in srgb, var(--c) 60%, var(--surface-2)); }
.grid i.h3 { background: var(--c); }
.grid i.x { background: var(--bad); }
.grid i.s { background: color-mix(in srgb, var(--ice) 45%, var(--surface-2)); }
.grid i.off { background: transparent; }
.grid i.now { box-shadow: 0 0 0 1.5px var(--fg); }

/* ---------- задачи ---------- */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-top: 1px solid var(--line); text-align: left; width: 100%; cursor: pointer; }
.task:first-child { border-top: 0; }
.task:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.tick { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; margin-top: 1px; color: #fff; transition: all .2s var(--ease); }
.tick svg { width: 14px; height: 14px; stroke-width: 3; opacity: 0; }
.task.done .tick { background: var(--good); border-color: var(--good); }
.task.done .tick svg { opacity: 1; }
.task .tt { flex: 1; min-width: 0; }
.task .tt b { font-weight: 500; display: block; overflow-wrap: break-word; }
.task.done .tt b { color: var(--muted); text-decoration: line-through; }
.task .tm { font-size: 13px; font-weight: 600; color: var(--fg-2); width: 5ch; text-align: right; flex: none; margin-top: 1px; }
.task .sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; margin-top: 2px; }
.imp { color: var(--bad); font-weight: 800; }
.task .sub .tmi { color: var(--fg-2); font-weight: 600; }
.add { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: text; }
.add:first-child { border-top: 0; }
.add svg { color: var(--accent-ink); width: 18px; height: 18px; }
.add input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 6px 0; }
.add input::placeholder { color: var(--muted); }

/* ---------- цели ---------- */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.gcard { padding: 16px; text-align: left; display: grid; gap: 10px; position: relative; overflow: hidden; }
.gcard .e { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: color-mix(in srgb, var(--c) 15%, transparent); }
.gcard b { font-size: 16px; font-weight: 600; }
.gcard .gs { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
.gcard .gs strong { color: var(--fg); font-weight: 700; min-width: 4ch; text-align: right; }
.gcard.done b { text-decoration: line-through; color: var(--muted); }
.ghero { padding: 22px; display: grid; gap: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, var(--surface)), var(--surface) 70%); }
.ghero .top { display: flex; gap: 16px; align-items: center; }
.ghero .e { font-size: 42px; line-height: 1; }
.ghero h2 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.ghero .why { padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); white-space: pre-wrap; }
.note { padding: 14px 16px; display: grid; gap: 4px; text-align: left; width: 100%; }
.note small { color: var(--muted); font-weight: 600; font-size: 12px; }
.note p { margin: 0; white-space: pre-wrap; overflow-wrap: break-word; }
.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px; }
.composer textarea { flex: 1; min-width: 0; border: 0; resize: none; background: none; outline: none; min-height: 24px; max-height: 200px; }

/* ---------- план ---------- */
.week7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
.dayc { padding: 10px 0 4px; min-width: 0; }
.dayc.today { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
.dayc.past { opacity: .7; }
.dayc .dh { padding: 0 12px 6px; display: flex; align-items: baseline; gap: 6px; }
.dayc .dh b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.dayc .dh small { color: var(--muted); font-weight: 600; font-size: 12px; }
.dayc .dh .sp { flex: 1; }
.dayc .dh .n { font-size: 12px; color: var(--muted); }
.dayc .task { padding: 8px 12px; font-size: 14px; gap: 9px; }
.dayc .tick { width: 20px; height: 20px; border-radius: 6px; }
.dayc .add { padding: 6px 12px; font-size: 14px; }
.cal { padding: 14px; }
.cal .wd, .cal .cg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .wd span { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; padding-bottom: 6px; }
.cal .cg button { aspect-ratio: 1.1; border-radius: 12px; display: grid; align-content: center; justify-items: center; gap: 5px; background: var(--surface-2); min-width: 0; }
.cal .cg button[disabled] { cursor: default; }
.cal .cg button.out { opacity: .35; }
.cal .cg button.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .cg button.sel { background: var(--fg); color: var(--bg); }
.cal .cg b { font-size: 15px; font-weight: 600; }
.cal .fill { width: 60%; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.cal .fill i { display: block; height: 100%; background: var(--good); }

/* ---------- итоги ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { padding: 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile small { color: var(--muted); font-weight: 500; font-size: 13px; }
.tile b { font-size: 32px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
.tile b i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 3px; }
.tile span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .up { color: var(--good); font-weight: 600; }
.tile .down { color: var(--bad); font-weight: 600; }
.yearwrap { overflow-x: auto; padding: 16px; scrollbar-width: thin; }
.year { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); grid-auto-columns: 11px; gap: 3px; width: max-content; }
.year i { border-radius: 3px; background: var(--surface-2); }
.year i.l1 { background: color-mix(in srgb, var(--c, var(--accent)) 28%, var(--surface-2)); }
.year i.l2 { background: color-mix(in srgb, var(--c, var(--accent)) 52%, var(--surface-2)); }
.year i.l3 { background: color-mix(in srgb, var(--c, var(--accent)) 78%, var(--surface-2)); }
.year i.l4 { background: var(--c, var(--accent)); }
.year i.s { background: color-mix(in srgb, var(--ice) 45%, var(--surface-2)); }
.year i.x { background: var(--bad); }
.year i.fut { background: transparent; }

const habitsActive = () => S.habits.filter(h => !h.archived);

      <div class="panel tile"><small>Успех за 30 дней</small><b>${rate(h)}<i>%</i></b></div><div class="panel tile"><small>${h.kind === 'bad' ? 'Срывов' : 'Всего раз'}</small><b>${h.kind === 'bad' ? Object.values(S.log[h.id] || {}).filter(v => v === -1).length : total(h)}</b></div></div>
      ${!h.archived && scheduled(h, today()) ? `<button class="btn ghost wide" id="hToday" style="margin-top:10px">${I.note}Сегодня: пропуск, заметка${(h.target || 1) > 1 ? ', −1' : ''}</button>` : ''}
      <div class="lbl">Последние полгода</div><div style="--c:${c}">${yearMap(habitYearCell(h), 26, 'fit')}</div>
      <div class="lbl" style="display:flex;align-items:center;gap:8px"><span style="flex:1">${MN[+m.slice(5, 7) - 1]} ${m.slice(0, 4)} · нажми на день, чтобы исправить</span><button class="icon-btn" id="hmPrev" style="width:34px;height:34px" aria-label="Прошлый месяц">${I.left}</button><button class="icon-btn" id="hmNext" style="width:34px;height:34px" aria-label="Следующий месяц">${I.right}</button></div>
      <div class="panel cal"><div class="wd">${WD.map(w => `<span>${w}</span>`).join('')}</div><div class="cg">${cells}</div></div>
      ${notes.length ? `<div class="lbl">Заметки к отметкам</div><div class="hnotes">${notes.map(([d, t]) => `<div><small>${rel(d) || dm(d)}</small>${esc(t)}</div>`).join('')}</div>` : ''}`;
  }
  const goals = S.goals.filter(g => g.status === 'active');
  openSheet(isNew ? 'Новая привычка' : h.name, `${stats}
    <div class="lbl">Название</div><input class="field big" id="hName" value="${esc(f.name)}" placeholder="Например, читать 20 минут" maxlength="80">
    <div class="lbl">Когда</div>${chips('group', GROUPS.map(([k, n, ic]) => [k, ic + ' ' + n]), f.group || 'any')}
    <div class="lbl">Тип</div>${chips('kind', [['good', '✅ Делать'], ['bad', '🛡 Бросить']], f.kind)}
    <div class="lbl">Расписание</div><div id="modeBox" ${f.kind === 'bad' ? 'hidden' : ''} style="margin-bottom:10px">${chips('mode', [['days', 'По дням недели'], ['weekly', 'N раз в неделю']], f.mode)}</div>
    <div id="daysBox" ${f.mode === 'weekly' && f.kind !== 'bad' ? 'hidden' : ''}>${chips('days', WD.map((w, i) => [String(i + 1), w]), f.days, true)}</div>
    <div id="wkBox" ${f.mode === 'weekly' && f.kind !== 'bad' ? '' : 'hidden'}><div class="stepper"><button id="wkM" aria-label="Меньше">−</button><b id="wkN">${f.wn}</b><button id="wkP" aria-label="Больше">+</button></div><span style="color:var(--muted);margin-left:10px">раз в неделю, в любые дни</span></div>
    <div id="tgt" ${f.kind === 'bad' ? 'hidden' : ''}><div class="lbl">Сколько за день</div><div style="display:flex;gap:10px"><input class="field" type="number" inputmode="numeric" id="hTarget" min="1" max="50" value="${f.target || 1}" style="width:96px"><input class="field" id="hUnit" value="${esc(f.unit || '')}" placeholder="стаканов, страниц, минут…" maxlength="20"></div></div>
    <div class="lbl">Значок</div><div class="emojis" id="hEmoji">${EMOJI.map(e => `<button class="${e === f.emoji ? 'on' : ''}" data-e="${e}">${e}</button>`).join('')}</div>
    <div class="lbl">Цвет</div><div class="swatch" id="hColor">${Object.entries(COLORS).map(([k, c]) => `<button class="${k === f.color ? 'on' : ''}" style="--c:${c}" data-c="${k}" aria-label="${k}"></button>`).join('')}</div>
    ${goals.length ? `<div class="lbl">Ведёт к цели</div><select class="field" id="hGoal"><option value="">Без цели</option>${goals.map(g => `<option value="${g.id}"${g.id === f.goal ? ' selected' : ''}>${esc(g.emoji + ' ' + g.title)}</option>`).join('')}</select>` : ''}
    <div class="actions"><button class="btn wide" id="hSave">${isNew ? 'Добавить привычку' : 'Сохранить'}</button>
    ${isNew ? '' : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" id="hArch" style="justify-content:center">${h.archived ? 'Вернуть из архива' : 'В архив'}</button><button class="btn danger" id="hDel" style="justify-content:center">Удалить</button></div>${confirmBox('Удалить привычку вместе со всей историей отметок?', 'Удалить')}`}</div>`, sh => {
    chipGroup(sh, 'kind', f, 'kind'); chipGroup(sh, 'days', f, 'days', true); chipGroup(sh, 'group', f, 'group'); chipGroup(sh, 'mode', f, 'mode');
    const vis = () => {
      const bad = f.kind === 'bad', wk = f.mode === 'weekly' && !bad;
      $('#tgt', sh).hidden = bad; $('#modeBox', sh).hidden = bad; $('#daysBox', sh).hidden = wk; $('#wkBox', sh).hidden = !wk;
    };
    $('[data-g="kind"]', sh).addEventListener('click', vis);
    $('[data-g="mode"]', sh).addEventListener('click', vis);
    const wk = n => { f.wn = Math.max(1, Math.min(6, f.wn + n)); $('#wkN', sh).textContent = f.wn; };
    $('#wkM', sh).onclick = () => wk(-1); $('#wkP', sh).onclick = () => wk(1);
    $('#hEmoji', sh).onclick = e => { const b = e.target.closest('[data-e]'); if (!b) return; f.emoji = b.dataset.e; $$('#hEmoji button', sh).forEach(x => x.classList.toggle('on', x === b)); };
    $('#hColor', sh).onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; f.color = b.dataset.c; $$('#hColor button', sh).forEach(x => x.classList.toggle('on', x === b)); };
    if (h) {
      $$('[data-hd]', sh).forEach(b => b.onclick = () => { tapHabit(h, b.dataset.hd); habitSheet(S.habits.find(x => x.id === h.id)); });
      $('#hmPrev', sh).onclick = () => { ui.hmonth = addMonths(ui.hmonth || firstOfMonth(today()), -1); habitSheet(h); };
      $('#hmNext', sh).onclick = () => { ui.hmonth = addMonths(ui.hmonth || firstOfMonth(today()), 1); habitSheet(h); };
      if ($('#hToday', sh)) $('#hToday', sh).onclick = () => daySheet(h, today());
      $('#hArch', sh).onclick = () => { h.archived = !h.archived; save(); closeSheet(); render(); toast(h.archived ? 'Привычка в архиве' : 'Привычка снова в работе'); };
      bindConfirm(sh, '#hDel', () => { S.habits = S.habits.filter(x => x.id !== h.id); delete S.log[h.id]; delete S.skips[h.id]; delete S.hnotes[h.id]; save(); closeSheet(); render(); toast('Привычка удалена'); });
    }
    $('#hSave', sh).onclick = () => {
      const name = $('#hName', sh).value.trim();
      if (!name) { $('#hName', sh).focus(); return; }
      const wkly = f.kind !== 'bad' && f.mode === 'weekly' ? f.wn : 0;
      if (!wkly && !f.days) { toast('Выбери хотя бы один день'); return; }
      const data = { name, emoji: f.emoji, color: f.color, group: f.group || 'any', kind: f.kind, days: wkly ? '1234567' : f.days, weekly: wkly, target: Math.max(1, Math.min(50, +$('#hTarget', sh).value || 1)), unit: $('#hUnit', sh).value.trim(), goal: $('#hGoal', sh) ? $('#hGoal', sh).value : '' };
      if (h) Object.assign(h, data); else S.habits.push({ id: uid(), created: today(), archived: false, ...data });
      save(); closeSheet(); render(); toast(isNew ? 'Привычка добавлена' : 'Сохранено');
    };
    if (isNew) setTimeout(() => $('#hName', sh).focus(), 320);
  });
}

// отметка за один день: −1/+1, пропуск без потери серии, заметка (открывается удержанием кружка)
function daySheet(h, d) {
  if (d > today()) { toast('Будущие дни отмечать нельзя'); return; }
  try { localStorage.setItem('ritm.hint', '1'); } catch (e) { /* */ }
  const t = h.target || 1, q = t > 1 && h.kind !== 'bad';
  openSheet(`${h.emoji} ${h.name}`, `<div class="eyebrow" style="margin:-8px 2px 14px">${rel(d) ? rel(d) + ', ' : ''}${dm(d)}</div>
    ${q ? `<div class="panel dayhab" style="--c:${col(h)}"><div class="grow"><b>${h.unit ? esc(h.unit[0].toUpperCase() + h.unit.slice(1)) : 'Сколько'}</b><small>норма ${t}</small></div><div class="stepper"><button id="dM" aria-label="Минус один">−</button><b id="dV">${Math.max(0, val(h, d))}</b><button id="dP" aria-label="Плюс один">+</button></div></div>` : ''}
    ${weekly(h) ? '' : `<button class="panel dayhab" id="dSkip" style="width:100%;text-align:left;margin-top:10px"><span class="hicon" style="--c:var(--ice);color:var(--ice)">${I.snow}</span><span class="grow"><b>${skipped(h, d) ? 'Снять пропуск' : 'Пропустить день'}</b><small>${skipped(h, d) ? 'День снова считается' : 'Болел, в дороге, выходной — серия не сгорит'}</small></span></button>`}
    <div class="lbl">Заметка к дню</div><textarea class="field" id="dNote" placeholder="Как прошло? Что помогло или помешало…" maxlength="1000">${esc(hnote(h, d))}</textarea>
    <div class="actions"><button class="btn wide" id="dSave">Готово</button></div>`, sh => {
    if (q) {
      const set = n => { const v = Math.max(0, Math.min(999, Math.max(0, val(h, d)) + n)); setVal(h, d, v); if (v) setSkip(h, d, false); $('#dV', sh).textContent = v; buzz(6); save(); render(); };
      $('#dM', sh).onclick = () => set(-1); $('#dP', sh).onclick = () => set(1);
    }
    if ($('#dSkip', sh)) $('#dSkip', sh).onclick = () => {
      const on = !skipped(h, d); setSkip(h, d, on);
      if (on && h.kind !== 'bad') setVal(h, d, 0);
      setNote(h, d, $('#dNote', sh).value.trim()); save(); closeSheet(); render();
      toast(on ? '❄️ День пропущен — серия сохранится' : 'Пропуск снят');
    };
    $('#dSave', sh).onclick = () => { setNote(h, d, $('#dNote', sh).value.trim()); save(); closeSheet(); render(); };
  });
}

function taskSheet(t, date) {
  const isNew = !t;
  const f = t ? { ...t } : { title: '', date: date === undefined ? today() : date, time: '', goal: '', important: false, note: '' };
  const goals = S.goals.filter(g => g.status === 'active' || g.id === f.goal);
  openSheet(isNew ? 'Новая задача' : 'Задача', `
    <input class="field big" id="tTitle" value="${esc(f.title)}" placeholder="Что сделать?" maxlength="200">
    <div class="lbl">Когда</div><div class="chips"><button class="chip" data-d="${today()}">Сегодня</button><button class="chip" data-d="${addDays(today(), 1)}">Завтра</button><button class="chip" data-d="">Без даты</button><input type="date" class="field" id="tDate" value="${f.date || ''}" style="width:auto;height:36px;padding:0 10px"></div>
    <div class="lbl">Время</div><input type="time" class="field" id="tTime" value="${f.time || ''}" style="width:140px">
    ${goals.length ? `<div class="lbl">Цель</div><select class="field" id="tGoal"><option value="">Без цели</option>${goals.map(g => `<option value="${g.id}"${g.id === f.goal ? ' selected' : ''}>${esc(g.emoji + ' ' + g.title)}</option>`).join('')}</select>` : ''}
    <div class="lbl">Важность</div>${chips('imp', [['0', 'Обычная'], ['1', '❗ Важная']], f.important ? '1' : '0')}
    <div class="lbl">Заметка</div><textarea class="field" id="tNote" placeholder="Детали, ссылки…" maxlength="3000">${esc(f.note || '')}</textarea>
    <div class="actions"><button class="btn wide" id="tSave">${isNew ? 'Добавить' : 'Сохранить'}</button>${isNew ? '' : `<button class="btn danger wide" id="tDel">Удалить задачу</button>`}</div>`, sh => {
    const dateIn = $('#tDate', sh);
    const mark = () => $$('[data-d]', sh).forEach(b => b.classList.toggle('on', b.dataset.d === (dateIn.value || '')));
    mark();
    $$('[data-d]', sh).forEach(b => b.onclick = () => { dateIn.value = b.dataset.d; mark(); });
    dateIn.onchange = mark;
    const imp = { v: f.important ? '1' : '0' }; chipGroup(sh, 'imp', imp, 'v');
    $('#tSave', sh).onclick = () => {
      const title = $('#tTitle', sh).value.trim();
      if (!title) { $('#tTitle', sh).focus(); return; }
      const data = { title, date: dateIn.value || null, time: $('#tTime', sh).value || '', goal: $('#tGoal', sh) ? $('#tGoal', sh).value : '', important: imp.v === '1', note: $('#tNote', sh).value };
      if (t) Object.assign(t, data); else S.tasks.push({ id: uid(), done: false, ...data });
      save(); closeSheet(); render(); toast(isNew ? 'Задача добавлена' : 'Сохранено');
    };
    if (t) $('#tDel', sh).onclick = () => { const i = S.tasks.indexOf(t); S.tasks.splice(i, 1); save(); closeSheet(); render(); toast('Задача удалена', 'Вернуть', () => { S.tasks.splice(i, 0, t); save(); render(); }); };
    if (isNew) setTimeout(() => $('#tTitle', sh).focus(), 320);
  });
}

function goalSheet(g, pre = {}) {
  const isNew = !g;
  const f = g ? { ...g } : { title: '', emoji: '🎯', color: 'amber', horizon: pre.horizon || 'month', start: pre.start || null, due: '', why: '' };
  if (!f.start && f.horizon !== 'none') f.start = periodStart(f.horizon, today());
  openSheet(isNew ? 'Новая цель' : 'Цель', `
    <input class="field big" id="gTitle" value="${esc(f.title)}" placeholder="Чего хочу достичь?" maxlength="120">
    <div class="lbl">Срок</div>${chips('hz', [['week', 'Неделя'], ['month', 'Месяц'], ['year', 'Год'], ['none', 'Без срока']], f.horizon)}
    <div id="per" style="display:flex;align-items:center;gap:8px;margin-top:10px" ${f.horizon === 'none' ? 'hidden' : ''}><button class="icon-btn" id="pPrev">${I.left}</button><b id="pLbl" style="flex:1;text-align:center">${periodLabel(f.horizon, f.start || today())}</b><button class="icon-btn" id="pNext">${I.right}</button></div>
    <div class="lbl">Дедлайн (необязательно)</div><input type="date" class="field" id="gDue" value="${f.due || ''}" style="width:auto">
    <div class="lbl">Значок</div><div class="emojis" id="gEmoji">${EMOJI.map(e => `<button class="${e === f.emoji ? 'on' : ''}" data-e="${e}">${e}</button>`).join('')}</div>
    <div class="lbl">Цвет</div><div class="swatch" id="gColor">${Object.entries(COLORS).map(([k, c]) => `<button class="${k === f.color ? 'on' : ''}" style="--c:${c}" data-c="${k}" aria-label="${k}"></button>`).join('')}</div>
    <div class="lbl">Зачем мне это</div><textarea class="field" id="gWhy" placeholder="Что изменится, когда достигну? Помогает не бросить." maxlength="1000">${esc(f.why || '')}</textarea>
    <div class="actions"><button class="btn wide" id="gSave">${isNew ? 'Поставить цель' : 'Сохранить'}</button></div>`, sh => {
    chipGroup(sh, 'hz', f, 'horizon');
    const upd = () => { $('#per', sh).hidden = f.horizon === 'none'; if (f.horizon !== 'none') $('#pLbl', sh).textContent = periodLabel(f.horizon, f.start); };
    $('[data-g="hz"]', sh).addEventListener('click', () => { f.start = f.horizon === 'none' ? null : periodStart(f.horizon, today()); upd(); });
    const shift = n => { f.start = f.horizon === 'week' ? addDays(f.start, 7 * n) : f.horizon === 'month' ? addMonths(f.start, n) : (+f.start.slice(0, 4) + n) + '-01-01'; upd(); };
    $('#pPrev', sh).onclick = () => shift(-1); $('#pNext', sh).onclick = () => shift(1);
    $('#gEmoji', sh).onclick = e => { const b = e.target.closest('[data-e]'); if (!b) return; f.emoji = b.dataset.e; $$('#gEmoji button', sh).forEach(x => x.classList.toggle('on', x === b)); };
    $('#gColor', sh).onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; f.color = b.dataset.c; $$('#gColor button', sh).forEach(x => x.classList.toggle('on', x === b)); };
    $('#gSave', sh).onclick = () => {
      const title = $('#gTitle', sh).value.trim();
      if (!title) { $('#gTitle', sh).focus(); return; }
      const data = { title, emoji: f.emoji, color: f.color, horizon: f.horizon, start: f.horizon === 'none' ? null : f.start, due: $('#gDue', sh).value || '', why: $('#gWhy', sh).value };
      if (g) Object.assign(g, data); else { const ng = { id: uid(), status: 'active', progress: 0, created: today(), ...data }; S.goals.push(ng); ui.view = 'goals'; ui.goalId = ng.id; }
      save(); closeSheet(); render(); toast(isNew ? 'Цель поставлена' : 'Сохранено');
    };
    if (isNew) setTimeout(() => $('#gTitle', sh).focus(), 320);
  });
}

function noteSheet(n) {
  openSheet('Заметка', `<small style="color:var(--muted)">${noteDate(n.created)}</small><textarea class="field" id="nText" style="min-height:200px;margin-top:10px" maxlength="5000">${esc(n.text)}</textarea>
    <div class="actions"><button class="btn wide" id="nSave">Сохранить</button><button class="btn danger wide" id="nDel">Удалить заметку</button>${confirmBox('Удалить заметку?', 'Удалить')}</div>`, sh => {
    $('#nSave', sh).onclick = () => { const t = $('#nText', sh).value.trim(); if (!t) return; n.text = t; save(); closeSheet(); render(); };
    bindConfirm(sh, '#nDel', () => { S.notes = S.notes.filter(x => x !== n); save(); closeSheet(); render(); toast('Заметка удалена'); });
  });
}

/* ===== действия ===== */
const A = {
  nav: el => { ui.view = el.dataset.v; if (ui.view !== 'goals') ui.goalId = null; render(); },
  day: el => { ui.sel = el.dataset.d; if (el.dataset.go) ui.view = 'today'; render(); },
  'go-today': () => { ui.sel = today(); render(); },
  tap: el => { if (press.block) { press.block = false; return; } const h = S.habits.find(x => x.id === el.dataset.id); if (h) tapHabit(h, el.dataset.d || today()); },
  habit: el => { ui.hmonth = null; habitSheet(S.habits.find(x => x.id === el.dataset.id)); },
  'new-habit': () => habitSheet(null),
  pick: el => { const k = el.dataset.k; ui.picks.has(k) ? ui.picks.delete(k) : ui.picks.add(k); render(); },
  start: () => {
    PRESETS.filter(p => ui.picks.has(p.k)).forEach(p => S.habits.push({ id: uid(), name: p.name, emoji: p.emoji, color: p.color, kind: p.kind || 'good', days: p.days || '1234567', target: p.target || 1, unit: p.unit || '', goal: '', created: today(), archived: false }));
    if (!S.habits.length) return habitSheet(null);
    save(); render(); toast('Готово. Отмечай привычки каждый день');
  },
  hfilter: el => { ui.habitFilter = el.dataset.f; render(); },
  hview: el => { ui.gridView = !!el.dataset.g; render(); },
  fold: el => { const k = el.dataset.k; ui.closed.has(k) ? ui.closed.delete(k) : ui.closed.add(k); try { localStorage.setItem('ritm.closed', JSON.stringify([...ui.closed])); } catch (e) { /* */ } render(); },
  'import-grit': () => importGrit(),
  export: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    a.download = `ritm-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast('Копия сохранена в «Загрузки»');
  },
  'quick-add': () => ui.view === 'habits' ? habitSheet(null) : ui.view === 'goals' ? goalSheet(null) : taskSheet(null, ui.view === 'today' ? ui.sel : today()),
  task: (el, e) => { if (e.target.closest('[data-a="tick"],[data-a="to-today"]')) return; taskSheet(S.tasks.find(x => x.id === el.dataset.id)); },
  tick: (el, e) => { e.stopPropagation(); const t = S.tasks.find(x => x.id === el.dataset.id); t.done = !t.done; save(); render(); if (t.done && t.date && dayProgress(t.date).pct === 100) { confetti(); toast('День закрыт полностью 🎉'); } },
  'new-task': () => taskSheet(null, ui.view === 'today' ? ui.sel : today()),
  'to-today': (el, e) => { e.stopPropagation(); S.tasks.find(x => x.id === el.dataset.id).date = today(); save(); render(); },
  'all-today': () => { const l = overdue(); l.forEach(t => { t.date = today(); }); save(); render(); toast(`Перенесено: ${l.length}`); },
  pmode: el => { ui.planMode = el.dataset.m; render(); },
  shift: el => { const n = +el.dataset.n; if (ui.planMode === 'week') ui.week = addDays(ui.week, 7 * n); else { ui.month = addMonths(ui.month, n); ui.msel = ui.month.slice(0, 7) === today().slice(0, 7) ? today() : ui.month; } render(); },
  mday: el => { ui.msel = el.dataset.d; render(); },
  goal: el => { ui.view = 'goals'; ui.goalId = el.dataset.id; render(); },
  'goal-back': () => { ui.goalId = null; render(); },
  gtab: el => { ui.goalTab = el.dataset.t; render(); },
  'new-goal': el => goalSheet(null, { horizon: el.dataset.h, start: el.dataset.s }),
  'edit-goal': () => goalSheet(S.goals.find(x => x.id === ui.goalId)),
  gstatus: el => { const g = S.goals.find(x => x.id === ui.goalId); g.status = el.dataset.s; save(); render(); if (g.status === 'done') { confetti(); toast('Цель достигнута! 🏆'); } },
  'del-goal': () => { const g = S.goals.find(x => x.id === ui.goalId); const i = S.goals.indexOf(g); S.goals.splice(i, 1); S.tasks.forEach(t => { if (t.goal === g.id) t.goal = ''; }); ui.goalId = null; save(); render(); toast('Цель удалена', 'Вернуть', () => { S.goals.splice(i, 0, g); save(); render(); }); },
  'note-add': () => { const ta = $('#noteIn'), text = ta.value.trim(); if (!text) return; S.notes.push({ id: uid(), goal: ui.goalId, text, created: new Date().toISOString() }); save(); render(); },
  note: el => noteSheet(S.notes.find(x => x.id === el.dataset.id)),
};
// удержание кружка привычки (или правый клик) — меню дня: пропуск, заметка, −1
const press = { timer: 0, block: false };
const hintSeen = () => { try { return !!localStorage.getItem('ritm.hint'); } catch (e) { return true; } };
function openDay(el) { const h = S.habits.find(x => x.id === el.dataset.id); if (h) { press.block = true; buzz(15); daySheet(h, el.dataset.d || today()); } }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-a="tap"]'); if (!el || el.closest('.sheet')) return;
  press.block = false; clearTimeout(press.timer); press.timer = setTimeout(() => openDay(el), 480);
});
['pointerup', 'pointercancel', 'scroll'].forEach(k => document.addEventListener(k, () => clearTimeout(press.timer), true));
document.addEventListener('contextmenu', e => { const el = e.target.closest('[data-a="tap"]'); if (!el || el.closest('.sheet')) return; e.preventDefault(); clearTimeout(press.timer); if (!press.block) openDay(el); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || !A[el.dataset.a] || el.closest('.sheet')) return;
  A[el.dataset.a](el, e);
});
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    const data = JSON.parse(txt);
    if (!data || !Array.isArray(data.habits) || !Array.isArray(data.tasks)) throw new Error('bad');
    const prev = S; S = migrate(data); save(); render();
    toast('Копия загружена', 'Отменить', () => { S = prev; save(); render(); });
  }).catch(() => toast('Это не копия Ритма — выбери файл ritm-….json'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-add]')) {
    const v = e.target.value.trim(); if (!v) return;
    let title = v, time = '', important = false;
    if (title.includes('!')) { important = true; title = title.replace(/!/g, ' '); }
    title = title.replace(/(^|\s)(?:в\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s|$)/i, (m, a, h, mm) => { time = pad(h) + ':' + mm; return ' '; }).replace(/\s+/g, ' ').trim();
    if (!title) return;
    S.tasks.push({ id: uid(), title: title[0].toUpperCase() + title.slice(1), date: e.target.dataset.date || null, time, goal: e.target.dataset.goal || '', important, note: '', done: false });
    e.target.value = ''; save(); render();
  }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'noteIn') A['note-add']();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.task[data-a]')) { e.preventDefault(); A.task(e.target, e); }
});

/* ===== тост и конфетти ===== */
let tt;
function toast(text, action, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
  t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), action ? 4500 : 2400);
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'), r = devicePixelRatio || 1;
  c.width = innerWidth * r; c.height = innerHeight * r; x.setTransform(r, 0, 0, r, 0, 0);
  const cs = Object.values(COLORS), ps = Array.from({ length: 130 }, () => ({ x: innerWidth / 2, y: innerHeight * .4, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, s: Math.random() * 6 + 4, c: cs[Math.random() * cs.length | 0], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t) {
    const k = (t - t0) / 1500; x.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.globalAlpha = Math.max(0, 1 - k); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (k < 1) requestAnimationFrame(f); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ===== старт ===== */
const tab = (location.hash || '').slice(1);
if (TABS.some(t => t[0] === tab)) ui.view = tab;
render();
initStore();
// полночь: «сегодня» сдвигается
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { if (ui.sel === lastDay) ui.sel = today(); lastDay = today(); render(); } }, 60000);
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
