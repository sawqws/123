# Сайт «Ритм» (docs/) → ветка gh-pages → https://sawqws.github.io/123/
name: Ритм на GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: pages
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Выложить docs/ в gh-pages
        run: |
          cd docs
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
