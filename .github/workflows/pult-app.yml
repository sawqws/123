name: pult-app
# Свой «Пульт» для Windows: исходники RustDesk + брендинг pult-app/ → установщик Pult-setup.exe,
# проверка установки на чистой Windows и выпуск в релиз pult-app. Шаги сборки — как в rustdesk flutter-build.yml.
on:
  workflow_dispatch:
  push:
    paths: ['pult-app/**', '.github/workflows/pult-app.yml']
permissions:
  contents: write
env:
  RUSTDESK_REF: "1.5.0"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  PYTHONIOENCODING: "utf-8"
concurrency:
  group: pult-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_REF }}
          submodules: recursive
      - name: Пакеты
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: pult-bridge
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: pult-bridge-bin-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}-${{ env.CARGO_EXPAND_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true
      - name: Генерация моста Flutter↔Rust
        run: |
          command -v cargo-expand || cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          command -v flutter_rust_bridge_codegen || cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  windows:
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Кеш GitHub для vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ env.RUSTDESK_REF }}
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          path: pult-src
          sparse-checkout: pult-app
      - uses: actions/download-artifact@v4
        with:
          name: bridge
          path: ./
      - name: Брендинг «Пульт»
        shell: bash
        run: |
          pip3 install pynacl
          python3 pult-src/pult-app/brand.py apply .
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Движок Flutter от RustDesk
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
      - name: Патч Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: pult-windows
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Зависимости vcpkg
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | head -20 | while read -r f; do echo "== $f"; tail -50 "$f"; done
            exit 1
          fi
      - name: Сборка
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk
          python3 pult-src/pult-app/brand.py sign . ./rustdesk/custom.txt
      - name: Runner.res
        continue-on-error: true
        shell: bash
        run: |
          r=$(find . -name "Runner.res" | head -1); [ -n "$r" ] && cp "$r" ./libs/portable/Runner.res
      - name: Установщик (самораспаковка)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p out
          mv ./target/release/rustdesk-portable-packer.exe ./out/Pult-setup.exe
          rm -f .pult-seed
          sha256sum out/Pult-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pult-setup
          path: out/Pult-setup.exe

  test:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pult-setup
      - name: Тихая установка
        shell: pwsh
        run: |
          $p = Start-Process .\Pult-setup.exe -ArgumentList '--silent-install' -PassThru
          $null = $p.WaitForExit(180000)
          for ($i = 0; $i -lt 60 -and !(Test-Path "$env:ProgramFiles\Pult\Pult.exe"); $i++) { Start-Sleep 2 }
          Get-ChildItem "$env:ProgramFiles\Pult" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (!(Test-Path "$env:ProgramFiles\Pult\Pult.exe")) { throw 'нет Program Files\Pult\Pult.exe' }
      - name: Служба, ID, настройки
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\Pult\Pult.exe"
          for ($i = 0; $i -lt 30 -and (Get-Service Pult -ErrorAction SilentlyContinue).Status -ne 'Running'; $i++) { Start-Sleep 2 }
          Get-Service Pult | Format-List Name, DisplayName, Status | Out-String | Write-Host
          if ((Get-Service Pult).Status -ne 'Running') { throw 'служба Pult не запущена' }
          & $exe --password Test-Pult-42 | Out-Null
          $id = ''
          for ($i = 0; $i -lt 30 -and $id -notmatch '^\d{6,}$'; $i++) { $id = (& $exe --get-id | Out-String).Trim(); Start-Sleep 2 }
          "ID: $id"
          if ($id -notmatch '^\d{6,}$') { throw 'нет ID' }
          $upd = (& $exe --option enable-check-update | Out-String).Trim()
          "enable-check-update: '$upd'"
      - name: Окно и скриншот
        shell: pwsh
        run: |
          Start-Process "$env:ProgramFiles\Pult\Pult.exe"
          Start-Sleep 12
          Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table | Out-String | Write-Host
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\pult-${{ matrix.os }}.png")
      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.os }}
          path: pult-*.png
      - name: Удаление
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\Pult\Pult.exe" -ArgumentList '--uninstall' -PassThru
          $null = $p.WaitForExit(180000)
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:ProgramFiles\Pult\Pult.exe"); $i++) { Start-Sleep 2 }
          if (Test-Path "$env:ProgramFiles\Pult\Pult.exe") { throw 'не удалился' }
          if (Get-Service Pult -ErrorAction SilentlyContinue) { throw 'служба осталась' }
          'удалён'

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pult-setup
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pult-app
          name: Пульт для Windows
          prerelease: false
          files: Pult-setup.exe
          body: |
            Пульт — удалённое управление компьютером. Сборка ${{ github.sha }} на основе RustDesk ${{ env.RUSTDESK_REF }} (AGPL-3.0); изменения — папка pult-app/.
