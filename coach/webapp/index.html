<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#283339">

        <div class="sk" style="height:14px;width:80%;margin-top:8px"></div><div class="sk" style="height:48px;margin-top:16px;border-radius:24px"></div></div>
      <div class="card"><div class="sk" style="height:120px"></div></div>
    </main>
  </div>
  <nav id="tabs"></nav>
  <input type="file" id="pick" accept="image/*" hidden>
