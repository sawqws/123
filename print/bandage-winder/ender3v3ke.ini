# Ender-3 V3 KE, сопло 0.4, слой 0.2 — по профилю Creality из OrcaSlicer, перенесено в PrusaSlicer.
# Пластик (температуры, поток) задаётся отдельно: pla.ini / petg.ini.
printer_model =
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 245
gcode_flavor = klipper
nozzle_diameter = 0.4
use_relative_e_distances = 1
retract_length = 0.5
retract_speed = 30
retract_lift = 0.2
retract_before_travel = 1
machine_max_acceleration_extruding = 8000
machine_max_acceleration_travel = 8000
machine_max_acceleration_x = 8000
machine_max_acceleration_y = 8000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
thumbnails = 96x96/PNG, 300x300/PNG
start_gcode = SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan0_min VALUE=30\nSET_VELOCITY_LIMIT ACCEL_TO_DECEL=2500\nM220 S100\nM221 S100\nM140 S[first_layer_bed_temperature]\nG28 X Y\nM190 S[first_layer_bed_temperature]\nG28 Z\nBED_MESH_CALIBRATE PROBE_COUNT=5,5\nM104 S[first_layer_temperature]\nG92 E0\nG1 X-2.0 Y20 Z0.3 F5000.0\nM109 S[first_layer_temperature]\nG1 Z0.2\nG1 Y145.0 F1500.0 E15\nG1 X-1.7 F5000.0\nG1 Y30 F1500.0 E15\nG92 E0
end_gcode = G92 E0\nG1 E-1.2 Z{max_layer_z + 0.5} F1800\n{if max_layer_z < 50}G1 Z{max_layer_z + 25} F900\n{endif}G1 X2 Y218 F3000\nM106 S0\nM104 S0\nM140 S0\nM84 X Y E
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = gyroid
infill_anchor = 2
seam_position = aligned
external_perimeters_first = 0
elefant_foot_compensation = 0.1
support_material = 0
skirts = 1
skirt_distance = 4
brim_width = 0
perimeter_speed = 200
external_perimeter_speed = 150
infill_speed = 250
solid_infill_speed = 200
top_solid_infill_speed = 120
gap_fill_speed = 100
bridge_speed = 50
travel_speed = 400
first_layer_speed = 50
default_acceleration = 5000
perimeter_acceleration = 4000
external_perimeter_acceleration = 3000
infill_acceleration = 5000
first_layer_acceleration = 1000
travel_acceleration = 5000
bridge_acceleration = 2000
extrusion_width = 0.45
first_layer_extrusion_width = 0.5
avoid_crossing_perimeters = 0
output_filename_format = {input_filename_base}_{filament_type[0]}.gcode
