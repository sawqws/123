<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>HDP</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="kit.css?v={{v}}">
  <link rel="stylesheet" href="app.css?v={{v}}">
  <link rel="stylesheet" href="prep.css?v={{v}}">
</head>
<body data-support="/api/support">
  <div id="app">
    <header class="hero">
      <div class="logo" aria-hidden="true">🎓</div>
      <div class="titles">
        <h1 id="title">Задания</h1>
        <div class="sub" id="sub">загружаю…</div>
      </div>
      <div class="end">
        <button class="btn icon" id="refresh" data-a="refresh" aria-label="Обновить"><span>↻</span></button>
        <button class="btn icon" data-a="settings" aria-label="Настройки"><span>⚙︎</span></button>
      </div>
    </header>
    <div id="err"></div>
    <div id="live"></div>
    <main id="view"></main>
  </div>
  <nav id="tabs"></nav>
  <canvas id="confetti"></canvas>
  <script src="kit.js?v={{v}}"></script>
  <script src="prep.js?v={{v}}"></script>
  <script src="app.js?v={{v}}"></script>
</body>
</html>
