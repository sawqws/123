<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0c10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Глаз">
  <title>Глаз</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="app.css?v={{v}}">
</head>
<body class="off">
  <main id="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5C6.5 5 2.7 9.4 1.6 11.4a1.3 1.3 0 0 0 0 1.2C2.7 14.6 6.5 19 12 19s9.3-4.4 10.4-6.4a1.3 1.3 0 0 0 0-1.2C21.3 9.4 17.5 5 12 5Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/></svg>
        </span>
        <span>Глаз</span>
      </div>
      <div id="place" class="place">📍 определяю место…</div>
      <button id="new" class="icon-btn" aria-label="Начать заново" title="Начать заново">
        <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.9 8.2 1 1 0 1 1 2-.4A5 5 0 1 0 8.6 8.4l1.5 1.5H5V4.8l2.2 2.2A7 7 0 0 1 12 5Z"/></svg>
      </button>
    </header>

    <section class="stage" aria-live="polite">
      <div class="orb" aria-hidden="true">
        <span class="glow"></span>
        <span class="wave"></span><span class="wave"></span><span class="wave"></span>
        <span class="ring" id="ring"></span>
        <span class="arc"></span>
        <span class="core">
          <svg class="mic" viewBox="0 0 24 24"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V5.5a3.5 3.5 0 0 0-7 0V11a3.5 3.5 0 0 0 3.5 3.5Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.1a6 6 0 0 0 5-5.9Z"/></svg>
          <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="dots"><i></i><i></i><i></i></span>
        </span>
      </div>
      <div id="state" class="state">Готов слушать</div>
      <div id="hint" class="hint">Нажми «Говорить» — дальше без рук</div>
      <div id="heard" class="heard"></div>
      <div id="say" class="say"></div>
      <button id="stop" class="chip">⏹ Тише</button>
    </section>

    <div id="notice" class="notice" hidden></div>

    <section class="block">
      <h2>Разговор</h2>
      <div id="chat" class="chat"><div class="empty">Скажи что-нибудь — отвечу в динамики очков.</div></div>
    </section>

    <section class="block">
      <h2>Что видел</h2>
      <div id="feed" class="feed"><div class="empty">Пришли фото с очков в чат или нажми «Фото».</div></div>
    </section>
  </main>

  <nav class="dock">
    <button id="talk" class="btn primary" aria-label="Говорить">
      <span id="talk-label">🎙 Говорить</span>
      <small id="talk-sub" class="sub"></small>
    </button>
    <label class="btn" for="pick">📷 Фото<input id="pick" type="file" accept="image/*" multiple hidden></label>
  </nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v={{v}}"></script>
</body>
</html>
