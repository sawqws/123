<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f3ee">
  <title>КПП</title>
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="kit.css?v={{v}}">
  <link rel="stylesheet" href="app.css?v={{v}}">
</head>
<body data-support="/api/support">
  <main id="app">
    <header class="hero">
      <div class="logo" aria-hidden="true">🚕</div>
      <button id="where" class="titles where" type="button" disabled>
        <h1>КПП</h1>
        <div id="sub" class="sub">Пропуск для такси</div>
      </button>
    </header>
    <div id="view">
      <div class="card feature"><div class="sk" style="height:84px"></div>
        <div class="sk" style="height:56px;margin-top:16px"></div></div>
      <div class="label">Последние пропуска</div>
      <div class="list"><div class="row"><div class="sk" style="height:34px;width:100%"></div></div>
        <div class="row"><div class="sk" style="height:34px;width:100%"></div></div></div>
    </div>
  </main>
  <input id="file" type="file" accept="image/*" hidden>
  <div id="toast" class="toast" role="status"></div>
  <script src="kit.js?v={{v}}"></script>
  <script src="app.js?v={{v}}"></script>
</body>
</html>
